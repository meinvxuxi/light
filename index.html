<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休赛期训练师暂未开放</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(1200px 600px at 20% -10%, rgba(74,144,217,.16), transparent 60%),
                radial-gradient(900px 500px at 110% 110%, rgba(111,158,99,.14), transparent 55%), #f0f2f5;
    color:#2c3e50; font-family:'Segoe UI','PingFang SC',sans-serif; padding:20px;
  }
  .card {
    background: rgba(255,255,255,.78); border:1px solid rgba(74,144,217,.22);
    border-radius:22px; padding:36px 30px; max-width:430px; width:100%;
    text-align:center; box-shadow:0 10px 34px rgba(31,45,61,.12);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .badge { display:inline-block; background:rgba(240,98,146,.14); color:#c73e79;
    border:1px solid rgba(240,98,146,.4); border-radius:20px; padding:4px 14px;
    font-size:.78rem; font-weight:700; letter-spacing:1px; margin-bottom:14px; }
  h1 { font-size:1.5rem; margin-bottom:8px; }
  p { color:#6b7a90; font-size:.92rem; line-height:1.7; margin-bottom:6px; }
  .sub { color:#9aa5b1; font-size:.82rem; }
  .btn {
    margin-top:18px; display:inline-block; padding:10px 26px; border-radius:12px;
    border:1px solid rgba(74,144,217,.5); background:rgba(74,144,217,.14); color:#2f6fb2;
    font-size:.9rem; font-weight:700; cursor:pointer; text-decoration:none;
  }
  .btn:hover { background:rgba(74,144,217,.24); }
  .status { margin-top:16px; font-size:.78rem; color:#9aa5b1; min-height:18px; }
  .dots::after { content:''; animation:dt 1.2s steps(4) infinite; }
  @keyframes dt { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge">休赛期</div>
    <h1 id="title">现在是休赛期</h1>
    <p>「训练室」暂未开放，<br>请等本机/服务器开机后再来。</p>
    <p class="sub">通常几个小时后就有能约到赛训，刷新或稍等会自动跳转。</p>
    <a class="btn" href="#" id="retryBtn" onclick="check()">我再看看</a>
    <div class="status" id="status">正在探测服务器…</div>
  </div>
<script>
  // 用法：把本页托管到任意外部静态站点，链接后追加 ?srv=你的公网服务地址
  // 例：https://xxx.github.io/standby.html?srv=https://your-tunnel-address
  function base() {
    const u = new URLSearchParams(location.search).get('srv') || '';
    return u.replace(/\/+$/, '');
  }
  async function check() {
    const status = document.getElementById('status');
    const card = document.getElementById('card');
    const b = base();
    if (!b) { status.textContent = '未配置 srv 参数（提示页需要在链接后带 ?srv=…）'; return; }
    status.textContent = '正在探测服务器…';
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 3500);
    try {
      const r = await fetch(b + '/healthz', { mode: 'cors', signal: ctrl.signal });
      clearTimeout(t);
      if (r.ok) {
        status.textContent = '训练师在线！正在进入游戏…';
        card.style.transition = 'opacity .3s'; card.style.opacity = '.4';
        setTimeout(() => { location.replace(b); }, 600);
        return;
      }
      throw new Error('bad');
    } catch (e) {
      clearTimeout(t);
      status.textContent = '服务器暂未开放，稍后自动重试…';
      setTimeout(check, 8000);
    }
  }
  check();
  document.getElementById('retryBtn').addEventListener('click', (e) => e.preventDefault());
</script>
</body>
</html>
