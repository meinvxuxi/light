<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏房间</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f0f2f5;
      color: #2c3e50;
      font-family: 'Segoe UI', 'PingFang SC', sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    .room-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .room-header h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .room-header .room-id { color: #6c757d; font-size: 0.85rem; }

    .seats {
      display: flex;
      flex-wrap: nowrap;   /* 四个座位始终同一行，座位弹性伸缩 */
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .seat {
      background: white;
      border-radius: 14px;
      padding: 14px 8px;
      flex: 1;
      min-width: 0;
      width: auto;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 2px solid #dee2e6;
      transition: all 0.2s;
    }

    .seat.occupied { border-color: #4a90d9; }
    .seat.host { border-color: #f0c040; }
    .seat.ready { border-color: #27ae60; background: #eafaf1; }

    .seat .seat-num { font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; }
    .seat .player-name { font-size: 0.9rem; margin-bottom: 4px; }
    .seat .player-status { font-size: 0.75rem; color: #6c757d; }
    .seat .seat-empty { color: #adb5bd; font-size: 0.85rem; }

    .spectator-list {
      text-align: center;
      margin: 10px 0;
      font-size: 0.85rem;
      color: #6c757d;
    }

    .controls {
      text-align: center;
      margin: 16px 0;
    }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 4px;
    }

    .btn-primary { background: #4a90d9; color: white; }
    .btn-primary:hover { background: #357abd; }
    .btn-primary:disabled { background: #c0c7cf; cursor: not-allowed; }

    .btn-success { background: #27ae60; color: white; }
    .btn-success:hover { background: #1e8449; }

    .btn-warning { background: #f0c040; color: #1a1a2e; }
    .btn-warning:hover { background: #d4a820; }

    .btn-outline {
      background: white;
      color: #4a90d9;
      border: 2px solid #4a90d9;
    }
    .btn-outline:hover { background: #eaf2fb; }

    .settings {
      text-align: center;
      margin: 12px 0;
      font-size: 0.9rem;
    }

    .settings select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
      font-size: 0.9rem;
      margin: 0 4px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #6c757d;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-link:hover { text-decoration: underline; }

    /* 网页内小提示 toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 46px;
      transform: translate(-50%, 20px);
      background: rgba(255, 255, 255, 0.82);
      color: #2c3e50;
      border: 1px solid rgba(74, 144, 217, 0.5);
      padding: 10px 20px;
      border-radius: 24px;
      font-size: .9rem;
      font-weight: 600;
      white-space: nowrap;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      box-shadow: 0 4px 18px rgba(31,45,61,.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===== 房间页 v2.1 轻量风格（与大厅 v2.1 一致） ===== */
    body { padding: 14px 12px 34px; }
    .room-header, .settings, .seats, .spectator-list, .controls, .back-link { max-width: 620px; margin-left: auto; margin-right: auto; }
    .room-header { text-align: center; margin-bottom: 8px; }
    .room-header h1 { font-size: 1.08rem; margin-bottom: 2px; color: #2c3e50; }
    .room-header div { color: #9aa5b1; font-size: .82rem; }
    .settings { text-align: center; font-size: .85rem; color: #6b7a90; margin-top: 8px; }
    .settings select { padding: 4px 8px; border-radius: 8px; border: 1px solid #dee2e6; font-size: .85rem; outline: none; }
    .seats { margin-top: 16px; }
    .seat { box-shadow: none; border-radius: 10px; background: #fff; padding: 12px 6px; }
    .seat.occupied { border-color: #b9d6f2; }
    .seat.ready { border-color: #b7e0c8; background: #f6fbf7; }
    .seat.host { border-color: #f0c040; }
    .seat .player-name { font-size: .85rem; }
    .seat .player-status { font-size: .7rem; }
    .host-tag, .me-tag { font-style: normal; font-size: .62rem; border-radius: 4px; padding: 1px 4px; margin-left: 3px; vertical-align: middle; }
    .host-tag { background: #f7e8b5; color: #8a6d00; }
    .me-tag { background: #eaf2fb; color: #4a90d9; }
    .spectator-list { text-align: center; font-size: .8rem; color: #9aa5b1; margin: 8px 0; }
    .controls { text-align: center; margin: 8px 0; }
    .controls button { box-shadow: none; background: #fff; color: #2c3e50; border: 1px solid #d7dde3; }
    .controls button.btn-primary, .controls button.btn-success, .controls button.btn-warning, .controls button.btn-outline { background: #fff; color: #2c3e50; border: 1px solid #d7dde3; }
    .controls button:hover { background: #f1f4f8; transform: none; }
    .controls #btnStart { background: #2c3e50; color: #fff; border: 1px solid #2c3e50; }
    .controls #btnStart:hover { background: #1a1a2e; }
    .controls button:disabled { background: #eef1f5; color: #98a2ad; cursor: not-allowed; }
    .back-link { display: block; text-align: center; margin-top: 22px; color: #6b7a90; font-size: .85rem; }
    .back-link:hover { color: #4a90d9; }

    @media (max-width: 480px) {
      .seat { width: auto; min-width: 0; padding: 10px 4px; }
      .seat .player-name { font-size: .78rem; }
      .seat .player-status { font-size: .62rem; }
    }
    /* ===== p1 专属主题：素材背景 + 粉色点缀 ===== */
    body.theme-p1 { background-image: linear-gradient(rgba(255,255,255,.82), rgba(255,255,255,.82)), url('/assets/avatars/p1/beijing.png.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
    body.theme-p1 .back, body.theme-p1 .back:hover { color: #f06292; }
    body.theme-p1 .controls #btnStart { background: #f06292; border-color: #f06292; }
    body.theme-p1 .controls #btnStart:hover { background: #e0507f; }
    body.theme-p1 .seat.occupied { border-color: #ffb3c6; }
    body.theme-p1 .seat.ready { border-color: #f9b7ca; background: #fff4f7; }
    body.theme-p1 .me-tag { background: #ffe3ec; color: #e0507f; }
    body.theme-p1 .toast { background: rgba(240,98,146,.16); color: #c73e79; border-color: rgba(240,98,146,.55); }
  </style>
</head>
<body>
  <div class="room-header">
    <h1 id="roomTitle">游戏房间</h1>
    <div class="room-id">房间号：<span id="roomId">---</span></div>
    <div>房主：<span id="hostName">---</span></div>
  </div>

  <!-- 对局进行中：显示提示与 返回游戏/进入观战 -->
  <div id="gameZone" style="display:none;">
    <div style="text-align:center; color:#4a90d9; font-size:.92rem; margin:6px 0;">本局进行中</div>
    <div class="controls">
      <button class="btn-primary" id="btnGameAction" onclick="enterGame()">返回游戏</button>
    </div>
  </div>

  <!-- 开赛前操作区（准备/入座等；对局开始后隐藏） -->
  <div id="preStartControls">
    <div class="settings" id="hostSettings" style="display:none;">
      人数设置：
      <select id="maxPlayersSelect" onchange="changeMaxPlayers()">
        <option value="2">2人</option>
        <option value="3">3人</option>
        <option value="4" selected>4人</option>
      </select>
      <span style="color:#6c757d;font-size:0.8rem;">（仅房主可改）</span>
      <div id="skipOfflineWrap" style="display:none;margin-top:7px;padding:6px 10px;font-size:.8rem;color:#6c757d;background:rgba(74,144,217,.06);border-radius:8px;border:1px dashed rgba(74,144,217,.25);">
        <label style="cursor:pointer;display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="skipOfflineCk" onchange="changeSkipOffline()">
          <span>离线自动跳过（炸飞机）<br><small style="color:#9aa5b1;">不勾＝轮到离线玩家就等TA回来；勾上＝自动让给在场下一位</small></span>
        </label>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="btnTakeSeat" onclick="takeSeat()">入座</button>
      <button class="btn-outline" id="btnSpectate" onclick="spectate()">观战</button>
      <button class="btn-outline" id="btnReady" onclick="toggleReady()">准备</button>
      <button class="btn-success" id="btnStart" onclick="startGame()">开始游戏</button>
    </div>

    <div class="controls">
      <button class="btn-warning" id="btnLeaveSeat" onclick="leaveSeat()" style="display:none;">离开座位</button>
    </div>
  </div>

  <div class="seats" id="seats"></div>
  <div class="spectator-list" id="spectatorList"></div>

  <a href="#" class="back-link" onclick="goToLobby(); return false;">返回大厅</a>

  <!-- 网页内小提示 toast -->
  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
  
    const socket = io();
    // 未登录直接点开房间链接 → 先回登录页，登录成功后自动回到本房间
    if (!sessionStorage.getItem('playerName')) {
      location.replace('/?next=' + encodeURIComponent(location.pathname + location.search));
    }
    const myName = sessionStorage.getItem('playerName') || '';
    const isTest = sessionStorage.getItem('isTest') === 'true';

    let roomId = '';
    let isHost = false;
    let mySeat = null;
    let isReady = false;
    let isSpectator = false;
    let serverMaxPlayers = 4;   // 服务器当前实际人数（改人数被拒时用于恢复下拉框）
    let latestRoom = null;      // 最近一次 room_update 的完整房间状态（startGame 校验用）

    const params = new URLSearchParams(window.location.search);
    const gameName = params.get('game') || 'yahtzee';
    const GAME_LABEL = { yahtzee: '快艇骰子', light: '拍灯大作战', drawing: '画猜接龙', bomber: '炸飞机' };
    const isDrawing = gameName === 'drawing'; // 画猜接龙固定 4 人，无人数设置
    document.getElementById('roomTitle').textContent = (GAME_LABEL[gameName] || '游戏') + ' · 房间';

    // ========== 心跳发送（防止被踢 + 刷新/跳转后自动续接身份） ==========
    // 第三个参数 true = 房间页属于"房间上下文"，服务器会把本连接续接到玩家所在房间。
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', myName, sessionStorage.getItem('isTest') === 'true', true);
    }
    socket.on('connect', sendHeartbeat);   // 连接/重连后立即续接
    setInterval(sendHeartbeat, 10000);

    // ===== p1 主题应用 =====
    // ===== 主题引擎（粉/绿两种强调色 + 各素材背景）=====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6, agly: 0.82, lyff: 0.8 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.g-hall,.save,.mini-link,.l-link,.l-link:hover,.gear,.gear:hover,.guest-toggle:hover,.f-link:hover,.theme-opt.active,.p-tri:hover,.player-card.online .status-text';
      const btn = '.controls #btnStart,.btn-roll';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        scoped('body.dyn-pink', '.g-tab.active') + '{color:#f06292!important;border-bottom-color:#ffb3c6!important}' +
        scoped('body.dyn-pink', '.g-tab:hover') + '{color:#f06292!important}' +
        scoped('body.dyn-pink', btn) + '{background:#f06292!important;border-color:#f06292!important}' +
        'body.dyn-pink .controls #btnStart:hover,body.dyn-pink .btn-roll:hover{background:#e0507f!important}' +
        'body.dyn-pink .game-link{border-bottom-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.occupied{border-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.ready{border-color:#f9b7ca!important;background:#fff4f7!important}' +
        'body.dyn-pink .me-tag{background:#ffe3ec!important;color:#e0507f!important}' +
        'body.dyn-pink .toast,body.dyn-pink .home-toast{background:rgba(240,98,146,.16)!important;color:#c73e79!important;border-color:rgba(240,98,146,.55)!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', '.g-tab.active') + '{color:#6f9e63!important;border-bottom-color:#a9c79e!important}' +
        scoped('body.dyn-green', '.g-tab:hover') + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', btn) + '{background:#6f9e63!important;border-color:#6f9e63!important}' +
        'body.dyn-green .controls #btnStart:hover,body.dyn-green .btn-roll:hover{background:#5b8a50!important}' +
        'body.dyn-green .game-link{border-bottom-color:#a9c79e!important}' +
        'body.dyn-green .seat.occupied{border-color:#a9c79e!important}' +
        'body.dyn-green .seat.ready{border-color:#b9d6af!important;background:#f2f8f0!important}' +
        'body.dyn-green .me-tag{background:#e6f1e2!important;color:#5b8a50!important}' +
        'body.dyn-green .toast,body.dyn-green .home-toast{background:rgba(111,158,99,.18)!important;color:#4f8a45!important;border-color:rgba(111,158,99,.55)!important}';
          const gold = pink
      .replace(/dyn-pink/g, 'dyn-gold')
      .replace(/#f06292/g, '#d6a843')
      .replace(/#e0507f/g, '#b98a2e')
      .replace(/#a0345c/g, '#b98a2e')
      .replace(/#c73e79/g, '#a8791b')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(214, 168, 67,')
      .replace(/#ffb3c6/g, '#eeddb3')
      .replace(/#f9b7ca/g, '#f0e3bd')
      .replace(/#fff4f7/g, '#fff8ea')
      .replace(/#ffe3ec/g, '#fdf3dd');
    const red = pink
      .replace(/dyn-pink/g, 'dyn-red')
      .replace(/#f06292/g, '#a6403a')
      .replace(/#e0507f/g, '#8c332d')
      .replace(/#a0345c/g, '#8c332d')
      .replace(/#c73e79/g, '#8c332d')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(166, 64, 58,')
      .replace(/#ffb3c6/g, '#ddb5b2')
      .replace(/#f9b7ca/g, '#ddb5b2')
      .replace(/#fff4f7/g, '#fcf1f0')
      .replace(/#ffe3ec/g, '#faeae8');
    s.textContent = pink + '\n' + green + '\n' + gold + '\n' + red;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green', 'dyn-gold', 'dyn-red');
      if (id && id !== 'initial') {
        b.classList.add((id === 'agly') ? 'dyn-gold' : ((id === 'lyff') ? 'dyn-red' : ((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink')));
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = IS_MOBILE ? 'scroll' : 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function applyTheme() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    socket.on('connect', applyTheme);
    setTimeout(applyTheme, 600);

    // ===== 显示名映射（服务器内部用真名，展示统一翻译成昵称）=====
    let _dispMap = {};
    function dn(n) { return _dispMap[n] || n; }
    socket.on('connect', () => {
      socket.emit('get_display_names', (r) => { if (r && r.success) _dispMap = r.map; });
    });

    socket.emit('join_room', { game: gameName, playerName: myName, isTest }, (res) => {
      console.log('📥 join_room 服务器回复:', JSON.stringify(res));
      if (!res || !res.roomId) {
        alert('加入房间失败，请重试');
        return;
      }
      roomId = res.roomId || '';
      isHost = res.isHost || false;
      document.getElementById('roomId').textContent = roomId;
      if (isHost && !isDrawing) {
        document.getElementById('hostSettings').style.display = 'block';
      }
    });

    socket.on('room_update', (roomState) => {
      if (!roomState) return;

      document.getElementById('hostName').textContent = dn(roomState.hostName) || '---';
      serverMaxPlayers = roomState.maxPlayers || 4;
      document.getElementById('maxPlayersSelect').value = serverMaxPlayers;
      const skWrap = document.getElementById('skipOfflineWrap');
      if (skWrap) skWrap.style.display = (gameName === 'bomber' && roomState.hostName === myName) ? 'block' : 'none';
      const skCk = document.getElementById('skipOfflineCk');
      if (skCk && roomState.hostName === myName) skCk.checked = !!roomState.skipOffline;

      const seatsDiv = document.getElementById('seats');
      seatsDiv.innerHTML = '';
      const max = roomState.maxPlayers || 4;

      for (let i = 1; i <= max; i++) {
        const seat = roomState.seats ? roomState.seats[i] : null;
        const occupied = !!seat;
        const isMe = occupied && seat.name === myName;
        const ready = occupied && seat.ready;
        const isHostPlayer = occupied && seat.isHost;

        seatsDiv.innerHTML += `
          <div class="seat ${occupied ? 'occupied' : ''} ${isHostPlayer ? 'host' : ''} ${ready ? 'ready' : ''}">
            <div class="seat-num">座位 ${i}</div>
            <div class="player-name">${occupied ? dn(seat.name) : ''}${isMe ? '<em class="me-tag">你</em>' : ''}${isHostPlayer ? '<em class="host-tag">房主</em>' : ''}</div>
            <div class="player-status">${ready ? '已准备' : (occupied ? '未准备' : '')}</div>
            <div class="seat-empty">${!occupied ? '空座位' : ''}</div>
          </div>
        `;
      }

      const specs = roomState.spectators || [];
      document.getElementById('spectatorList').textContent =
        specs.length > 0 ? '观战：' + specs.map(dn).join(', ') : '';

      mySeat = roomState.mySeat ?? null;
      isReady = roomState.myReady ?? false;
      isSpectator = specs.includes(myName);

      isHost = (roomState.hostName === myName);
      document.getElementById('hostSettings').style.display = (isHost && !isDrawing) ? 'block' : 'none';
      latestRoom = roomState;   // 保存最新房间状态，供 startGame 的本地校验用
      updateBtnStates(roomState);
      updateGameView(roomState);
    });

    // ===== 对局中视图：本局玩家可"返回游戏"，非本局玩家可"进入观战" =====
    function updateGameView(room) {
      if (!room) return;
      const started = !!room.gameStarted;
      document.getElementById('gameZone').style.display = started ? 'block' : 'none';
      document.getElementById('preStartControls').style.display = started ? 'none' : 'block';
      if (!started) return;

      const isPlayer = (room.gamePlayers || []).includes(myName);
      const note = document.querySelector('#gameZone > div');
      if (note) note.textContent = isPlayer ? '本局进行中，你正在对局中' : '本局进行中，你正在观战';
      document.getElementById('btnGameAction').textContent = isPlayer ? '返回游戏' : '进入观战';
    }

    function enterGame() {
      const urlMap = { yahtzee: '/yahtzee.html', light: '/light.html', drawing: '/drawing.html', bomber: '/bomber.html' };
      const fallback = { yahtzee: 'yahtzee_001', light: 'light_001', drawing: 'drawing_001', bomber: 'bomber_001' };
      const g = (gameName in urlMap) ? gameName : 'yahtzee';
      const rid = roomId || (latestRoom && latestRoom.roomId) || fallback[g];
      window.location.href = urlMap[g] + '?room=' + rid;
    }

    function updateBtnStates(room) {
      if (!room) return;
      const seats = room.seats || {};
      const allReady = Object.values(seats).every(s => !s || s.ready);
      const playerCount = Object.values(seats).filter(Boolean).length;
      const needPlayers = gameName === 'drawing' ? 4 : 2; // 画猜接龙为四人版
      const canStart = isHost && allReady && playerCount >= needPlayers;

      // 开始按钮始终可点：不符合条件时点击会在 startGame 里弹网页内小提示（见下方 showToast）
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnTakeSeat').style.display = mySeat === null ? 'inline-block' : 'none';
      document.getElementById('btnSpectate').style.display = mySeat === null ? 'inline-block' : 'none';
      document.getElementById('btnReady').style.display = mySeat !== null ? 'inline-block' : 'none';
      document.getElementById('btnReady').textContent = isReady ? '取消准备' : '准备';
      document.getElementById('btnLeaveSeat').style.display = mySeat !== null ? 'inline-block' : 'none';
    }

    // ---- 网页内小提示（toast）----
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ---- 防重复处理 ----
    let isRoomProcessing = false;

    function takeSeat() { 
      if (isRoomProcessing) return;
      isRoomProcessing = true;
      document.getElementById('btnTakeSeat').disabled = true;
      socket.emit('take_seat', () => {
        isRoomProcessing = false;
        document.getElementById('btnTakeSeat').disabled = false;
      });
      setTimeout(() => {
        isRoomProcessing = false;
        document.getElementById('btnTakeSeat').disabled = false;
      }, 1000);
    }

    function leaveSeat() { 
      if (isRoomProcessing) return;
      isRoomProcessing = true;
      document.getElementById('btnLeaveSeat').disabled = true;
      socket.emit('leave_seat', () => {
        isRoomProcessing = false;
        document.getElementById('btnLeaveSeat').disabled = false;
      });
      setTimeout(() => {
        isRoomProcessing = false;
        document.getElementById('btnLeaveSeat').disabled = false;
      }, 1000);
    }

    function spectate() { 
      if (isRoomProcessing) return;
      isRoomProcessing = true;
      document.getElementById('btnSpectate').disabled = true;
      socket.emit('spectate', () => {
        isRoomProcessing = false;
        document.getElementById('btnSpectate').disabled = false;
      });
      setTimeout(() => {
        isRoomProcessing = false;
        document.getElementById('btnSpectate').disabled = false;
      }, 1000);
    }

    function toggleReady() { 
      if (isRoomProcessing) return;
      isRoomProcessing = true;
      document.getElementById('btnReady').disabled = true;
      socket.emit('toggle_ready', () => {
        isRoomProcessing = false;
        document.getElementById('btnReady').disabled = false;
      });
      setTimeout(() => {
        isRoomProcessing = false;
        document.getElementById('btnReady').disabled = false;
      }, 1000);
    }

    function changeSkipOffline() {
      const on = document.getElementById('skipOfflineCk') && document.getElementById('skipOfflineCk').checked;
      const max = parseInt((document.getElementById('maxPlayersSelect') || {}).value || '4') || serverMaxPlayers;
      socket.emit('change_settings', { maxPlayers: max, skipOffline: on }, (res) => {
        if (res && res.success === false && res.msg) showToast('人数：' + res.msg);
      });
    }

    function startGame() {
      if (isRoomProcessing) return;

      // ===== 点击"开始游戏"时的网页内小提示（不弹浏览器 alert） =====
      if (!isHost) {
        showToast('🤨 这个房是你的吗？只有房主能开始游戏');
        return;
      }
      const seats = (latestRoom && latestRoom.seats) || {};
      const seatedList = Object.values(seats).filter(Boolean);
      const playerCount = seatedList.length;
      const allReady = seatedList.every(s => s.ready);

      if (playerCount < 2) {
        showToast('少人？人数还不够（至少 2 人才能开局）');
        return;
      }
      if (!allReady) {
        showToast('😤 有玩家未准备 (#`O′)，等大家都点"✅ 准备"再开始');
        return;
      }

      const maxPlayers = (latestRoom && latestRoom.maxPlayers) || serverMaxPlayers;
      if (playerCount < maxPlayers) {
        // 未满员：仅提醒不阻止（规则仍是 ≥2 人即可开局），提示停留一下后自动开始
        showToast('多人？人数还没满，马上开始！');
        isRoomProcessing = true;
        document.getElementById('btnStart').disabled = true;
        setTimeout(() => {
          socket.emit('start_game', () => { isRoomProcessing = false; });
        }, 1200);
        return;
      }

      isRoomProcessing = true;
      document.getElementById('btnStart').disabled = true;
      socket.emit('start_game', () => {
        isRoomProcessing = false;
      });
      setTimeout(() => {
        isRoomProcessing = false;
      }, 1000);
    }

    function changeMaxPlayers() {
      if (isRoomProcessing) return;
      isRoomProcessing = true;
      const selectEl = document.getElementById('maxPlayersSelect');
      selectEl.disabled = true;
      const v = parseInt(selectEl.value);
      socket.emit('change_settings', { maxPlayers: v }, (res) => {
        isRoomProcessing = false;
        selectEl.disabled = false;
        if (res && res.success === false) {
          showToast('多人？' + (res.msg || '当前人数不允许改到这么少'));
          selectEl.value = String(serverMaxPlayers);   // 恢复成服务器当前实际人数
        }
      });
      setTimeout(() => {
        isRoomProcessing = false;
        selectEl.disabled = false;
      }, 1000);
    }

    // ========== 返回大厅：彻底离开房间（离座/取消观战并移出房间） ==========
    // 离开后回到大厅，在线身份由大厅的心跳自动恢复
    function goToLobby() {
      socket.emit('leave_room', gameName, () => {
        window.location.href = '/lobby.html';
      });
    }

    socket.on('game_start', (data) => {
      if (data?.gameUrl) window.location.href = data.gameUrl;
    });

    socket.on('host_changed', (data) => {
      if (data?.newHost === myName) {
        isHost = true;
        document.getElementById('hostSettings').style.display = 'block';
      }
    });
  </script>
  <script>try {
    const _t = localStorage.getItem('myTheme');
    if (_t && _t !== 'initial' && typeof paintTheme === 'function') { paintTheme(_t); if (typeof applySticker === 'function') applySticker(_t); }
    // 身份注册完成后再校正主题：避免“过早读到 initial 把已存主题抹掉”
    let _a = 0;
    const _sync = () => socket.emit('get_profile', r => {
      if (r && r.success && r.theme && r.theme !== 'initial') {
        if (localStorage.getItem('myTheme') !== r.theme) {
          localStorage.setItem('myTheme', r.theme);
          paintTheme(r.theme);
          if (typeof applySticker === 'function') applySticker(r.theme);
        }
      } else if (_a < 3) { _a++; setTimeout(_sync, 500); }
    });
    setTimeout(_sync, 400);
  } catch (e) {}</script>
