<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荣誉墙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .filter { max-width: 680px; margin: 14px auto 2px; display: flex; gap: 6px; }
    .g-tab { background: none; border: none; padding: 5px 14px; font-size: .88rem; cursor: pointer; color: #6b7a90; border-radius: 8px; }
    .g-tab:hover { color: #4a90d9; background: none; }
    .g-tab.active { color: #4a90d9; font-weight: 700; border-bottom: 2px solid #4a90d9; border-radius: 0; }
    .t-tag { font-style: normal; font-size: .62rem; background: #fff1e0; color: #b45309; border-radius: 4px; padding: 1px 4px; margin-left: 3px; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 12px 6px 60px; }
    .empty { text-align: center; color: #9aa5b1; padding: 40px 0; font-size: .9rem; }
    .qhead { font-size: .78rem; color: #9aa5b1; letter-spacing: 2px; margin: 20px 0 8px; }
    .ach-card { background: rgba(255,255,255,.74); border: 1px solid rgba(237,240,244,.9); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    body.dyn-pink .ach-card { background: rgba(255,255,255,.66); border-color: rgba(240,98,146,.18); }
    body.dyn-green .ach-card { background: rgba(255,255,255,.66); border-color: rgba(111,158,99,.2); }
    .ach-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .ach-name { font-weight: 700; }
    .q-tag { font-size: .68rem; border-radius: 5px; padding: 1px 7px; font-weight: 600; }
    .q-legend { background: #fff1e0; color: #ff9800; }
    .q-epic { background: #f3e8fb; color: #9c27b0; }
    .q-rare { background: #e9f6ec; color: #4caf50; }
    .q-common { background: #eef0f3; color: #9e9e9e; }
    .q-hidden { background: #fdeceb; color: #d32f2f; }
    .p-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: .88rem; }
    .p-name em { font-style: normal; font-size: .75rem; color: #9aa5b1; margin-left: 4px; }
    .p-first { font-size: .78rem; color: #9aa5b1; }
    .p-tri { margin-left: auto; cursor: pointer; color: #9aa5b1; user-select: none; padding: 0 4px; font-size: .8rem; }
    .p-tri:hover { color: #4a90d9; }
    .p-detail { display: none; border-radius: 8px; padding: 6px 12px; font-size: .8rem; color: #6c7a8c; margin: 2px 0 8px; line-height: 1.7; background: rgba(74,144,217,.08); }
    body.dyn-pink .p-detail { background: rgba(240,98,146,.08); }
    body.dyn-green .p-detail { background: rgba(111,158,99,.1); }
    .p-detail.open { display: block; }
    /* ===== p1 专属主题：素材背景 + 粉色点缀 ===== */
    body.theme-p1 { background-image: linear-gradient(rgba(255,255,255,.82), rgba(255,255,255,.82)), url('/assets/avatars/p1/beijing.png.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
    body.theme-p1 .back, body.theme-p1 .back:hover { color: #f06292; }
    body.theme-p1 .g-tab.active { color: #f06292; border-bottom-color: #ffb3c6; }
    body.theme-p1 .g-tab:hover { color: #f06292; }
  </style>
</head>
<body>
  <div class="headbar">
    <span class="title">荣誉墙</span>
    <a class="back" href="/lobby.html">返回大厅</a>
  </div>

  <div class="filter">
    <button class="g-tab active" data-game="yahtzee" onclick="setGame('yahtzee')">快艇骰子</button>
    <button class="g-tab" data-game="drawing" onclick="setGame('drawing')">画猜接龙</button>
    <button class="g-tab" data-game="more" onclick="setGame('more')">更多游戏</button>
  </div>

  <div class="wrap" id="achList">
    <div class="empty">加载中…</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // 守卫：未登录回登录页；游客不可见荣誉墙（回大厅）
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    if (sessionStorage.getItem('isGuest') === 'true') { window.location.href = '/lobby.html'; }

    const QUALITY_ORDER = ['legend', 'epic', 'rare', 'common', 'hidden'];
    const QUALITY_LABEL = { legend: '传说', epic: '史诗', rare: '稀有', common: '普通', hidden: '隐藏' };

    // ===== 显示名映射（服务器内部用真名，展示统一翻译成昵称）=====
    let _dispMap = {};
    function dn(n) { return _dispMap[n] || n; }

    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function toggleDetail(playerName, achId) {
      const d = document.getElementById('detail-' + achId + '-' + playerName);
      const tri = document.getElementById('tri-' + achId + '-' + playerName);
      if (!d) return;
      const open = d.classList.toggle('open');
      tri.textContent = open ? '▾' : '▸';
    }

    let achData = null;       // 最近一次从服务器拉到的数据
    let curGame = 'yahtzee';  // 当前选中的游戏筛选

    function setGame(game) {
      curGame = game;
      document.querySelectorAll('.g-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-game') === game));
      render();
    }

    function render() {
      const data = achData;
      const list = (data && data.list) || [];
      const testList = (data && data.testList) || [];
      const meta = (data && data.meta) || {};
      const el = document.getElementById('achList');

      if (curGame === 'more') {
        el.innerHTML = '<div class="empty">更多游戏的成就尚未开放，敬请期待</div>';
        return;
      }

      // 测试账号登录时，额外合并显示"测试记录"（正式玩家看不到测试数据）
      const isTestUser = sessionStorage.getItem('isTest') === 'true' &&
                         sessionStorage.getItem('isGuest') !== 'true';
      const all = list.slice();
      if (isTestUser) testList.forEach(r => all.push(Object.assign({}, r, { isTest: true })));

      const byId = {};
      all.filter(r => meta[r.achievementId] && meta[r.achievementId].game === curGame)
         .forEach(r => { (byId[r.achievementId] = byId[r.achievementId] || []).push(r); });

      if (!Object.keys(byId).length) {
        el.innerHTML = '<div class="empty">还没有任何成就记录，快去游戏里解锁吧～</div>';
        return;
      }

      // 过滤：只显示"有玩家触发过"的成就；按品质高级→低级分组；同成就按首次触发时间早者在前
      let html = '';
      QUALITY_ORDER.forEach(q => {
        const ids = Object.keys(byId).filter(id => (meta[id] && meta[id].quality === q));
        if (!ids.length) return;
        html += `<div class="qhead">${QUALITY_LABEL[q]}</div>`;
        ids.forEach(id => {
          const recs = byId[id].slice().sort((a, b) => a.firstTime - b.firstTime);
          const rows = recs.map(r => {
            const detail = (r.events && r.events.length)
              ? r.events.map(t => '· ' + fmtTime(t)).join('<br>')
              : '· 首次：' + fmtTime(r.firstTime) + '<br>· 最近：' + fmtTime(r.lastTime);
            const dId = 'detail-' + id + '-' + r.playerName;
            const tId = 'tri-' + id + '-' + r.playerName;
            const nameHtml = dn(r.playerName) + (r.isTest ? ' <em class="t-tag">测试</em>' : '');
            return `
              <div class="p-row">
                <span class="p-name">${nameHtml}<em>x${r.count}</em></span>
                <span class="p-first">首触 ${fmtTime(r.firstTime)}</span>
                <span class="p-tri" id="${tId}" onclick="toggleDetail('${r.playerName}', '${id}')">▸</span>
              </div>
              <div class="p-detail" id="${dId}">${detail}</div>`;
          }).join('');
          html += `
            <div class="ach-card">
              <div class="ach-top">
                <span class="ach-name">${(meta[id] && meta[id].name) || id}</span>
                <span class="q-tag q-${q}">${QUALITY_LABEL[q]}</span>
              </div>
              ${rows}
            </div>`;
        });
      });

      el.innerHTML = html || '<div class="empty">还没有任何成就记录，快去游戏里解锁吧～</div>';
    }

    const socket = io();

    // ===== 心跳：让服务器识别当前身份（荣誉墙必须有心跳，主题/档案才读得到）=====
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', false);
    }
    socket.on('connect', sendHeartbeat);
    setInterval(sendHeartbeat, 10000);

    // ===== p1 主题应用 =====
    // ===== 主题引擎 =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.g-hall,.save,.mini-link,.l-link,.l-link:hover,.gear,.gear:hover,.guest-toggle:hover,.f-link:hover,.theme-opt.active,.p-tri:hover,.player-card.online .status-text';
      const btn = '.controls #btnStart,.btn-roll';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        scoped('body.dyn-pink', '.g-tab.active') + '{color:#f06292!important;border-bottom-color:#ffb3c6!important}' +
        scoped('body.dyn-pink', '.g-tab:hover') + '{color:#f06292!important}' +
        scoped('body.dyn-pink', btn) + '{background:#f06292!important;border-color:#f06292!important}' +
        'body.dyn-pink .controls #btnStart:hover,body.dyn-pink .btn-roll:hover{background:#e0507f!important}' +
        'body.dyn-pink .game-link{border-bottom-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.occupied{border-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.ready{border-color:#f9b7ca!important;background:#fff4f7!important}' +
        'body.dyn-pink .me-tag{background:#ffe3ec!important;color:#e0507f!important}' +
        'body.dyn-pink .toast,body.dyn-pink .home-toast{background:#a0345c!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', '.g-tab.active') + '{color:#6f9e63!important;border-bottom-color:#a9c79e!important}' +
        scoped('body.dyn-green', '.g-tab:hover') + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', btn) + '{background:#6f9e63!important;border-color:#6f9e63!important}' +
        'body.dyn-green .controls #btnStart:hover,body.dyn-green .btn-roll:hover{background:#5b8a50!important}' +
        'body.dyn-green .game-link{border-bottom-color:#a9c79e!important}' +
        'body.dyn-green .seat.occupied{border-color:#a9c79e!important}' +
        'body.dyn-green .seat.ready{border-color:#b9d6af!important;background:#f2f8f0!important}' +
        'body.dyn-green .me-tag{background:#e6f1e2!important;color:#5b8a50!important}' +
        'body.dyn-green .toast,body.dyn-green .home-toast{background:#48673f!important}';
      s.textContent = pink + '\n' + green;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green');
      if (id && id !== 'initial') {
        b.classList.add((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink');
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function applyTheme() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    socket.on('connect', applyTheme);
    setTimeout(applyTheme, 600);
    setTimeout(applyTheme, 1800); // 保险：等身份登记后再应用
    setTimeout(applyTheme, 3500);
    applyTheme(); // 打开页面立即根据本地记忆上色（不依赖网络/时序）
    socket.on('connect', () => {
      socket.emit('get_display_names', (res) => {
        if (res && res.success) { _dispMap = res.map; render(); }
      });
      socket.emit('get_achievements', (res) => {
        if (res && res.success) { achData = res; render(); }
        else document.getElementById('achList').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
      });
    });
  </script>
</body>
</html>
