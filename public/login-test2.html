<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>登录诊断</title>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <h2>登录诊断工具</h2>
  <div id="log" style="background:#1a1a2e;color:#0f0;padding:10px;font-family:monospace;white-space:pre-wrap;min-height:200px;"></div>
  <input type="text" id="keyInput" placeholder="输入密钥">
  <button id="loginBtn">登录</button>

  <script>
    const log = document.getElementById('log');
    function addLog(msg) {
      log.textContent += msg + '\n';
    }

    addLog('1. 尝试连接服务器...');
    const socket = io();

    socket.on('connect', () => {
      addLog('2. ✅ 已连接到服务器！Socket ID: ' + socket.id);
    });

    socket.on('connect_error', (err) => {
      addLog('2. ❌ 连接失败: ' + err.message);
    });

    socket.on('disconnect', () => {
      addLog('⚠️ 连接已断开');
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const key = document.getElementById('keyInput').value.trim().toLowerCase();
      addLog('3. 点击登录，密钥: ' + (key || '(空)'));
      
      if (!key) {
        addLog('❌ 密钥为空，不发送');
        return;
      }

      addLog('4. 发送 login 事件到服务器...');
      socket.emit('login', key, (res) => {
        addLog('5. 收到服务器回复: ' + JSON.stringify(res));
        if (res && res.success) {
          addLog('6. ✅ 登录成功！准备跳转...');
          sessionStorage.setItem('playerName', res.name);
          setTimeout(() => {
            window.location.href = '/lobby.html';
          }, 500);
        } else {
          addLog('6. ❌ 登录失败: ' + (res ? res.message : '无回复'));
        }
      });
    });
  </script>
</body>
</html>
