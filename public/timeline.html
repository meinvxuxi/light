<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光墙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 16px 4px 60px; }
    .tl-item { padding: 9px 2px; border-bottom: 1px solid #e8ecf1; font-size: .9rem; line-height: 1.6; }
    .tl-item:last-child { border-bottom: none; }
    .tl-time { color: #9aa5b1; font-size: .76rem; margin-right: 6px; }
    .tl-tri { float: right; color: #9aa5b1; cursor: pointer; user-select: none; padding: 0 4px; }
    .tl-tri:hover { color: #4a90d9; }
    .tl-detail { display: none; border-radius: 8px; padding: 6px 12px; margin-top: 4px; font-size: .82rem; color: #6c7a8c; background: rgba(74,144,217,.08); }
    body.dyn-pink .tl-detail { background: rgba(240,98,146,.08); }
    body.dyn-green .tl-detail { background: rgba(111,158,99,.1); }
    .tl-detail.open { display: block; }
    .ach-q-common { color: #9e9e9e; } .ach-q-rare { color: #4caf50; } .ach-q-epic { color: #9c27b0; } .ach-q-legend { color: #ff9800; } .ach-q-hidden { color: #d32f2f; }
    .empty { text-align: center; color: #adb5bd; padding: 50px 0; font-size: .88rem; }
    /* ===== p1 专属主题：素材背景 + 粉色点缀 ===== */
    body.theme-p1 { background-image: linear-gradient(rgba(255,255,255,.82), rgba(255,255,255,.82)), url('/assets/avatars/p1/beijing.png.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
    body.theme-p1 .back, body.theme-p1 .back:hover { color: #f06292; }
  
    body.dyn-gold .tl-detail{background:rgba(214,168,67,.09);}
    body.dyn-gold .tl-tri:hover{color:#c9982f;}
  </style>
</head>
<body>
  <div class="headbar">
    <span class="title">时光墙</span>
    <a class="back" href="/lobby.html">返回大厅</a>
  </div>

  <div class="wrap" id="tlList"><div class="empty">加载中…</div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    if (sessionStorage.getItem('isGuest') === 'true') { window.location.href = '/lobby.html'; }

    const GAME_LABEL = { yahtzee: '快艇骰子', drawing: '画猜接龙' };

    // ===== 显示名映射 =====
    let _dispMap = {};
    function dn(n) { return _dispMap[n] || n; }

    function fmtTime(ts) {
      const d = new Date(ts);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}年${p(d.getMonth() + 1)}月${p(d.getDate())}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function toggleDetail(ts) {
      const d = document.getElementById('detail-' + ts);
      const t = document.getElementById('tri-' + ts);
      if (!d) return;
      const open = d.classList.toggle('open');
      t.textContent = open ? '▾' : '▸';
    }

    function render(list) {
      const el = document.getElementById('tlList');
      if (!list || !list.length) { el.innerHTML = '<div class="empty">还没有记录，快去玩一局吧～</div>'; return; }
      el.innerHTML = '';
      for (const it of list) {
        const row = document.createElement('div');
        row.className = 'tl-item';
        const dId = 'detail-' + it.ts;
        const tId = 'tri-' + it.ts;
        if (it.type === 'game') {
          const who = (it.players || []).map(dn).join('、');
          const gameName = GAME_LABEL[it.game] || it.game;
          row.innerHTML = `<span class="tl-time">${fmtTime(it.ts)}</span>${who} 游玩了【${gameName}】<span class="tl-tri" id="${tId}" onclick="toggleDetail(${it.ts})">▸</span>`;
          const results = (it.results || []).slice().sort((a, b) => a.rank - b.rank)
            .map(r => {
              const votes = [];
              if (r.mvpVotes) votes.push(`MVP票 ${r.mvpVotes}`);
              if (r.culpritVotes) votes.push(`罪魁票 ${r.culpritVotes}`);
              return `第${r.rank}名　${dn(r.name)}　${r.score}分${votes.length ? '（' + votes.join('、') + '）' : ''}`;
            }).join('<br>');
          const detail = document.createElement('div');
          detail.className = 'tl-detail';
          detail.id = dId;
          detail.innerHTML = results;
          row.appendChild(detail);
        } else {
          const q = (it.quality || 'common');
          row.innerHTML = `<span class="tl-time">${fmtTime(it.ts)}</span>${dn(it.player)} 获得成就「<span class="ach-q-${q}">${it.achievementName || it.achievementId}</span>」`;
        }
        el.appendChild(row);
      }
    }

    const socket = io();

    // ===== p1 主题应用 =====
    // ===== 主题引擎 =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6, agly: 0.82 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.g-hall,.save,.mini-link,.l-link,.l-link:hover,.gear,.gear:hover,.guest-toggle:hover,.f-link:hover,.theme-opt.active,.p-tri:hover,.player-card.online .status-text';
      const btn = '.controls #btnStart,.btn-roll';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        scoped('body.dyn-pink', '.g-tab.active') + '{color:#f06292!important;border-bottom-color:#ffb3c6!important}' +
        scoped('body.dyn-pink', '.g-tab:hover') + '{color:#f06292!important}' +
        scoped('body.dyn-pink', btn) + '{background:#f06292!important;border-color:#f06292!important}' +
        'body.dyn-pink .controls #btnStart:hover,body.dyn-pink .btn-roll:hover{background:#e0507f!important}' +
        'body.dyn-pink .game-link{border-bottom-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.occupied{border-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.ready{border-color:#f9b7ca!important;background:#fff4f7!important}' +
        'body.dyn-pink .me-tag{background:#ffe3ec!important;color:#e0507f!important}' +
        'body.dyn-pink .toast,body.dyn-pink .home-toast{background:#a0345c!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', '.g-tab.active') + '{color:#6f9e63!important;border-bottom-color:#a9c79e!important}' +
        scoped('body.dyn-green', '.g-tab:hover') + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', btn) + '{background:#6f9e63!important;border-color:#6f9e63!important}' +
        'body.dyn-green .controls #btnStart:hover,body.dyn-green .btn-roll:hover{background:#5b8a50!important}' +
        'body.dyn-green .game-link{border-bottom-color:#a9c79e!important}' +
        'body.dyn-green .seat.occupied{border-color:#a9c79e!important}' +
        'body.dyn-green .seat.ready{border-color:#b9d6af!important;background:#f2f8f0!important}' +
        'body.dyn-green .me-tag{background:#e6f1e2!important;color:#5b8a50!important}' +
        'body.dyn-green .toast,body.dyn-green .home-toast{background:#48673f!important}';
          const gold = pink
      .replace(/dyn-pink/g, 'dyn-gold')
      .replace(/#f06292/g, '#d6a843')
      .replace(/#e0507f/g, '#b98a2e')
      .replace(/#a0345c/g, '#b98a2e')
      .replace(/#ffb3c6/g, '#eeddb3')
      .replace(/#f9b7ca/g, '#f0e3bd')
      .replace(/#fff4f7/g, '#fff8ea')
      .replace(/#ffe3ec/g, '#fdf3dd');
    s.textContent = pink + '\n' + green + '\n' + gold;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green', 'dyn-gold');
      if (id && id !== 'initial') {
        b.classList.add((id === 'agly') ? 'dyn-gold' : ((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink'));
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function applyTheme() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    socket.on('connect', applyTheme);
    setTimeout(applyTheme, 600);
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', false);
    }
    socket.on('connect', sendHeartbeat);
    setInterval(sendHeartbeat, 10000);

    socket.on('connect', () => {
      socket.emit('get_display_names', (r) => { if (r && r.success) _dispMap = r.map; });
      socket.emit('get_timeline', (r) => {
        if (r && r.success) render(r.list);
        else document.getElementById('tlList').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
      });
    });
  </script>
</body>
</html>
