<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 620px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 620px; margin: 0 auto; padding: 16px 4px 60px; }
    .lb-hl { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .headbar .seg { margin-bottom: 0; }
    .tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 18px; border-bottom: 1px solid #e8ecf1; padding: 0 2px 8px; scrollbar-width: none; -ms-overflow-style: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .lb-tab { flex: 0 0 auto; color: #6b7a90; font-size: .92rem; cursor: pointer; padding: 2px 2px 4px; border-bottom: 2px solid transparent; user-select: none; white-space: nowrap; }
    .lb-tab:hover { color: #4a90d9; }
    .lb-tab.active { color: #4a90d9; border-bottom-color: #4a90d9; font-weight: 600; }
    .seg { flex: none; display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.55); border: 1px solid rgba(230,235,240,.9); border-radius: 999px; padding: 2px; margin-bottom: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.04); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .seg span { font-size: .7rem; color: #7f8fa6; padding: 2px 9px; border-radius: 999px; cursor: pointer; white-space: nowrap; border: 1px solid transparent; user-select: none; }
    .seg span.on { color: #4a90d9; background: rgba(74,144,217,.12); border-color: rgba(74,144,217,.35); font-weight: 600; }
    .lb-list { padding-top: 6px; }
    .lb-row { display: flex; align-items: baseline; gap: 10px; padding: 10px 2px; border-bottom: 1px dashed #eef0f4; font-size: .92rem; }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { width: 28px; color: #9aa5b1; font-size: .82rem; flex: none; }
    .lb-rank.top { color: #4a90d9; font-weight: 700; }
    .lb-who { color: #2c3e50; font-weight: 600; }
    .lb-with { font-size: .64rem; font-weight: 400; color: #7a8fa6; background: rgba(120,140,165,.1); border-radius: 999px; padding: 0 6px; margin-left: 6px; line-height: 1.7; letter-spacing: .2px; white-space: nowrap; }
    .lb-title { font-size: .7rem; color: #b6bec9; background: #eef1f5; border-radius: 20px; padding: 1px 8px; }
    .lb-stat { margin-left: auto; color: #7f8fa6; font-size: .82rem; white-space: nowrap; }
    .empty { text-align: center; color: #adb5bd; padding: 46px 0; font-size: .88rem; }
    .err { text-align: center; color: #e74c3c; padding: 34px 0; font-size: .9rem; }
    @media (max-width: 480px) {
      .tabs { gap: 14px; }
      .lb-who { overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <div class="headbar">
    <div class="lb-hl">
      <div class="seg" id="subMode">
        <span class="on" id="subBest" onclick="setMode('best')">最佳</span>
        <span id="subScore" onclick="setMode('score')">分数</span>
      </div>
      <span class="title">排行榜</span>
    </div>
    <a class="back" href="/lobby.html">返回大厅</a>
  </div>
  <div class="wrap">
    <div class="tabs" id="gameTabs">
      <span class="lb-tab active" id="tabBoard" onclick="switchTab('board')">快艇榜</span>
      <span class="lb-tab" id="tabDrawing" onclick="switchTab('drawing')">花菜榜</span>
      <span class="lb-tab" id="tabBomber" onclick="switchTab('bomber')">烟火师榜</span>
      <span class="lb-tab" id="tabMsP" onclick="switchTab('msP')">扫雷·个人</span>
      <span class="lb-tab" id="tabMsT" onclick="switchTab('msT')">扫雷·组队</span>
      <span class="lb-tab" id="tabAch" onclick="switchTab('ach')">成就榜</span>
    </div>
    <div class="lb-list" id="lbList"><div class="empty">加载中…</div></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    let board = [], achBoard = [], drawingBoard = [], bomberBoard = [], curTab = 'board', scoreMode = 'best';
    let msPBest = [], msPH = [], msTBest = [], msTH = [];
    let highHistBoard = [], drawingHistBoard = [], bomberHistBoard = [];

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    // ===== 主题引擎（五套：初始/粉/绿 + 各角色背景） =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6, agly: 0.82, lyff: 0.8 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.lb-tab.active,.lb-rank.top,.seg span.on,.lb-with';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        'body.dyn-pink .lb-tab.active{border-bottom-color:#ffb3c6!important}' +
        'body.dyn-pink .seg span.on{border-color:#ffb3c6!important;background:rgba(240,98,146,.13)!important}' +
        'body.dyn-pink .lb-with{background:rgba(240,98,146,.12)!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        'body.dyn-green .lb-tab.active{border-bottom-color:#a9c79e!important}' +
        'body.dyn-green .seg span.on{border-color:#a9c79e!important;background:rgba(111,158,99,.14)!important}' +
        'body.dyn-green .lb-with{background:rgba(111,158,99,.13)!important}';
          const gold = pink
      .replace(/dyn-pink/g, 'dyn-gold')
      .replace(/#f06292/g, '#d6a843')
      .replace(/#e0507f/g, '#b98a2e')
      .replace(/#a0345c/g, '#b98a2e')
      .replace(/#c73e79/g, '#a8791b')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(214, 168, 67,')
      .replace(/#ffb3c6/g, '#eeddb3')
      .replace(/#f9b7ca/g, '#f0e3bd')
      .replace(/#fff4f7/g, '#fff8ea')
      .replace(/#ffe3ec/g, '#fdf3dd');
    const red = pink
      .replace(/dyn-pink/g, 'dyn-red')
      .replace(/#f06292/g, '#a6403a')
      .replace(/#e0507f/g, '#8c332d')
      .replace(/#a0345c/g, '#8c332d')
      .replace(/#c73e79/g, '#8c332d')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(166, 64, 58,')
      .replace(/#ffb3c6/g, '#ddb5b2')
      .replace(/#f9b7ca/g, '#ddb5b2')
      .replace(/#fff4f7/g, '#fcf1f0')
      .replace(/#ffe3ec/g, '#faeae8');
    s.textContent = pink + '\n' + green + '\n' + gold + '\n' + red;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green', 'dyn-gold', 'dyn-red');
      if (id && id !== 'initial') {
        b.classList.add((id === 'agly') ? 'dyn-gold' : ((id === 'lyff') ? 'dyn-red' : ((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink')));
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = IS_MOBILE ? 'scroll' : 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function paintSaved() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
    }
    function applyTheme() {
      if (!socket.connected) return;
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', false);
    }
    const socket = io();
    socket.on('connect', () => { paintSaved(); sendHeartbeat(); applyTheme(); });
    setTimeout(() => { paintSaved(); if (socket.connected) applyTheme(); }, 600);
    window.addEventListener('pageshow', () => { paintSaved(); if (socket.connected) applyTheme(); });
    setInterval(sendHeartbeat, 10000);

    function setMode(m) {
      scoreMode = m;
      document.getElementById('subBest').classList.toggle('on', m === 'best');
      document.getElementById('subScore').classList.toggle('on', m === 'score');
      render();
    }
    function switchTab(tab) {
      curTab = tab;
      document.getElementById('tabBoard').classList.toggle('active', tab === 'board');
      document.getElementById('tabDrawing').classList.toggle('active', tab === 'drawing');
      document.getElementById('tabBomber').classList.toggle('active', tab === 'bomber');
      document.getElementById('tabMsP').classList.toggle('active', tab === 'msP');
      document.getElementById('tabMsT').classList.toggle('active', tab === 'msT');
      document.getElementById('tabAch').classList.toggle('active', tab === 'ach');
      render();
    }
    function currentRows() {
      if (curTab === 'board') return scoreMode === 'best' ? board : highHistBoard;
      if (curTab === 'drawing') return scoreMode === 'best' ? drawingBoard : drawingHistBoard;
      if (curTab === 'bomber') return scoreMode === 'best' ? bomberBoard : bomberHistBoard;
      if (curTab === 'msP') return scoreMode === 'best' ? msPBest : msPH;
      if (curTab === 'msT') return scoreMode === 'best' ? msTBest : msTH;
      return achBoard;
    }
    function render() {
      const el = document.getElementById('lbList');
      const sub = document.getElementById('subMode');
      if (sub) sub.style.display = (curTab === 'ach') ? 'none' : 'flex';
      const rows = currentRows();
      if (!rows.length) {
        const emptyTxt = curTab === 'board' ? '还没有快艇对局记录，去打一局吧～'
          : (curTab === 'drawing' ? '还没有花菜对局记录，去打一局画猜接龙吧～'
            : (curTab === 'bomber' ? '还没有烟火师记录，去炸一局飞机吧～'
              : (curTab === 'msP' ? '还没有扫雷个人记录，去玩一局扫雷吧～'
                : (curTab === 'msT' ? '还没有扫雷组队记录，去玩一局 2v2 吧～' : '还没有成就记录'))));
        el.innerHTML = '<div class="empty">' + emptyTxt + '</div>';
        return;
      }
      el.innerHTML = rows.map((r, i) => {
        const rankCls = i < 3 ? 'lb-rank top' : 'lb-rank';
        const rankTxt = curTab === 'bomber' ? 'S' + (i + 1) : (i + 1);
        let who = '', stat = '';
        if (curTab === 'ach') {
          who = esc(r.displayName);
          stat = `${r.count} 个成就`;
        } else if (curTab === 'msP') {
          const withTag = (r.mode === 'team' && (r.displayPartner || r.partner))
            ? `<span class="lb-with">with ${esc(r.displayPartner || r.partner)}</span>` : '';
          who = esc(r.displayName) + withTag;
          stat = scoreMode === 'best' ? `单场最高 ${r.best} 分` : `${r.score} 分`;
        } else if (curTab === 'msT') {
          who = esc((r.displayPlayers || r.players || []).join(' × '));
          stat = `${r.total} 分`;
        } else if (curTab === 'board') {
          who = esc(r.displayName);
          stat = scoreMode === 'best' ? `单局最高 ${r.best} 分` : `${r.total} 分`;
        } else if (curTab === 'drawing') {
          who = esc(r.displayName);
          stat = scoreMode === 'best' ? `单局最高 ${r.best} 分` : `${r.score} 分`;
        } else { // bomber
          who = esc(r.displayName);
          stat = scoreMode === 'best' ? `单局炸毁机头 ${r.best} 架` : `单局炸毁机头 ${r.score} 架`;
        }
        return `<div class="lb-row">
          <span class="${rankCls}">${rankTxt}</span>
          <span class="lb-who">${who}</span>
          ${r.title ? `<span class="lb-title">${esc(r.title)}</span>` : ''}
          <span class="lb-stat">${stat}</span>
        </div>`;
      }).join('');
    }
    socket.on('connect', () => {
      socket.emit('get_leaderboard', (res) => {
        if (res && res.success) {
          board = res.board || [];
          achBoard = res.achBoard || [];
          drawingBoard = res.drawingBoard || [];
          bomberBoard = res.bomberBoard || [];
          highHistBoard = res.highHistBoard || [];
          drawingHistBoard = res.drawingHistBoard || [];
          bomberHistBoard = res.bomberHistBoard || [];
          msPBest = res.msBestBoard || [];
          msPH = res.msHistBoard || [];
          msTBest = res.msTeamBestBoard || [];
          msTH = res.msTeamHistBoard || [];
          render();
        } else {
          document.getElementById('lbList').innerHTML = '<div class="err">加载失败，请刷新重试</div>';
        }
      });
    });
  </script>
  <script>try {
    const _t = localStorage.getItem('myTheme');
    if (_t && _t !== 'initial' && typeof paintTheme === 'function') { paintTheme(_t); if (typeof applySticker === 'function') applySticker(_t); }
    // 身份注册完成后再校正主题：避免“过早读到 initial 把已存主题抹掉”
    let _a = 0;
    const _sync = () => socket.emit('get_profile', r => {
      if (r && r.success && r.theme && r.theme !== 'initial') {
        if (localStorage.getItem('myTheme') !== r.theme) {
          localStorage.setItem('myTheme', r.theme);
          paintTheme(r.theme);
          if (typeof applySticker === 'function') applySticker(r.theme);
        }
      } else if (_a < 3) { _a++; setTimeout(_sync, 500); }
    });
    setTimeout(_sync, 400);
  } catch (e) {}</script>
</body>
</html>
