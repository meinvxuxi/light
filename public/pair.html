<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>默契空间</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 620px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 620px; margin: 0 auto; padding: 14px 4px 60px; }
    .meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .mpair { font-size: 1.2rem; font-weight: 700; color: #4a90d9; }
    .paint-canvas-box { border: 1px solid #e2e6eb; border-radius: 12px; background: #fff; padding: 6px; margin: 8px 0; }
    .paint-canvas { width: 100%; height: auto; display: block; touch-action: none; background: #fff; border-radius: 8px; cursor: crosshair; }
    .ptools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 6px 0; }
    .pcolor { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .pcolor.on { border-color: #2c3e50; }
    .psize { display: inline-flex; align-items: center; gap: 2px; }
    .pbtn { border: 1px solid #dfe3e8; background: #fff; color: #2c3e50; border-radius: 8px; padding: 4px 10px; font-size: .8rem; cursor: pointer; }
    .pbtn.on { background: rgba(74,144,217,.15); border-color: #4a90d9; font-weight: 700; }
    body.dyn-pink .pbtn.on { background: rgba(240,98,146,.15); border-color: #f06292; }
    body.dyn-green .pbtn.on { background: rgba(111,158,99,.18); border-color: #6f9e63; }
    .psecret { display: inline-block; margin: 2px 3px 0 0; font-weight: 800; font-size: 1.05rem; }
    .guess-box { display: flex; gap: 8px; margin: 10px 0 6px; }
    .guess-box input { flex: 1; padding: 10px 12px; border: 1px solid #d7dde3; border-radius: 10px; font-size: .95rem; outline: none; }
    .guess-box button { padding: 0 20px; border: none; border-radius: 10px; background: #2c3e50; color: #fff; font-size: .9rem; cursor: pointer; }
    .glabel { font-size: .84rem; color: #6b7a90; margin: 8px 0 4px; }
    .attempt { padding: 4px 2px; border-bottom: 1px dashed #f0f2f5; font-size: .9rem; }
    .attempt.wrong { color: #6b7a90; }
    .attempt.ok { color: #27ae60; font-weight: 700; }
    .cd { color: #e74c3c; font-weight: 700; font-size: .9rem; }
    .word-here { font-size: 1.25rem; font-weight: 800; letter-spacing: 2px; margin: 8px 0; }
    .mini-canvas { border: 1px solid #eef0f4; border-radius: 8px; background: #fff; width: 100%; height: auto; margin: 4px 0; }
    .w-detail { margin-top: 10px; padding: 8px 10px; border-top: 1px dashed #e8ecf1; }
    .miss-tip { color: #e67e22; font-size: .84rem; margin-top: 4px; min-height: 18px; }
    .line-input { width: 100%; padding: 10px 12px; border: 1px solid #d7dde3; border-radius: 10px; font-size: .95rem; outline: none; background: #fff; color: #2c3e50; }
    .mdetail { color: #7f8fa6; font-size: .84rem; }
    .asub { color: #9aa5b1; font-size: .8rem; width: 100%; }
    .aliasbar { font-size: .85rem; color: #6b7a90; padding: 8px 2px; margin-top: 8px; border-top: 1px dashed #e8ecf1; }
    .alias-hist { font-size: .78rem; color: #9aa5b1; padding: 4px 2px 8px; border-bottom: 1px dashed #f0f2f5; }
    .pet-card { margin: 6px 0 2px; padding: 10px 12px; border: 1px dashed rgba(74,144,217,.4); border-radius: 12px; background: rgba(255,255,255,.55); }
    .pet-head { font-size: .8rem; color: #6b7a90; margin-bottom: 4px; }
    .pet-svg { text-align: center; }
    .pet-meta { font-size: .78rem; color: #9aa5b1; margin-top: 2px; }
    .pet-logs { margin-top: 6px; font-size: .75rem; color: #9aa5b1; border-top: 1px dashed #eef0f4; padding-top: 5px; line-height: 1.6; }
    .mtl { color: #e08a2d; font-size: .78rem; background: #fbf4ea; border-radius: 12px; padding: 1px 9px; }
    .present { font-size: .8rem; color: #27ae60; margin-top: 6px; }
    .present.wait { color: #9aa5b1; }
    .lab { font-size: .76rem; color: #9aa5b1; letter-spacing: 1px; margin: 20px 0 4px; border-bottom: 1px solid #e8ecf1; padding: 0 2px 6px; }
    .g-row { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px dashed #eef0f4; }
    .g-row .g-name { font-weight: 700; }
    .g-row .g-desc { color: #9aa5b1; font-size: .78rem; }
    .g-row .go { margin-left: auto; color: #4a90d9; font-size: .84rem; cursor: pointer; white-space: nowrap; }
    .g-row .go:hover { text-decoration: underline; }
    .g-row .soon { margin-left: auto; color: #c0c7cf; font-size: .78rem; white-space: nowrap; }
    .qa-head { display: flex; justify-content: space-between; font-size: .8rem; color: #9aa5b1; margin-bottom: 8px; }
    .qa-q { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; line-height: 1.5; }
    .qa-opt { padding: 10px 14px; border: 1px solid #dfe3e8; border-radius: 10px; margin-bottom: 8px; font-size: .95rem; cursor: pointer; }
    .qa-opt.sel { background: rgba(74,144,217,.14); border-color: #4a90d9; font-weight: 700; }
    .qa-opt.dis { opacity: .55; cursor: default; }
    .qa-opt.other { border-color: #f0a020; background: rgba(240,160,32,.16); color: #8a5a00; font-weight: 700; opacity: .9; }
    /* 主题色半透明磨砂弹窗 */
    .glass-mask { position: fixed; inset: 0; background: rgba(30,40,60,.2); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 99; display: flex; align-items: center; justify-content: center; }
    .glass-box { background: rgba(255,255,255,.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(74,144,217,.45); border-radius: 16px; padding: 20px 22px; max-width: 330px; width: 86%; text-align: center; box-shadow: 0 8px 30px rgba(31,45,61,.18); }
    body.dyn-pink .glass-box { border-color: rgba(240,98,146,.5); }
    body.dyn-green .glass-box { border-color: rgba(111,158,99,.5); }
    body.dyn-gold .glass-box { border-color: rgba(214,168,67,.5); }
    body.dyn-red .glass-box { border-color: rgba(166,64,58,.5); }
    .glass-box .vbtn { border-radius: 10px; padding: 10px 24px; font-size: .9rem; font-weight: 700; cursor: pointer; border: 1px solid transparent; margin: 6px 6px 0; }
    .glass-box .vbtn.ok { color: #2f6fb2; background: rgba(74,144,217,.15); border-color: rgba(74,144,217,.5); }
    .glass-box .vbtn.no { color: #c62828; background: rgba(231,76,60,.1); border-color: rgba(231,76,60,.4); }
    body.dyn-pink .glass-box .vbtn.ok { color: #c73e79; background: rgba(240,98,146,.15); border-color: rgba(240,98,146,.5); }
    body.dyn-green .glass-box .vbtn.ok { color: #4f8a45; background: rgba(111,158,99,.16); border-color: rgba(111,158,99,.5); }
    body.dyn-gold .glass-box .vbtn.ok { color: #a8791b; background: rgba(214,168,67,.16); border-color: rgba(214,168,67,.5); }
    body.dyn-red .glass-box .vbtn.ok { color: #8c332d; background: rgba(166,64,58,.15); border-color: rgba(166,64,58,.5); }
    .qa-wait { color: #9aa5b1; font-size: .82rem; text-align: center; margin-top: 6px; }
    .live-box { margin-top: 10px; border-top: 1px dashed #e8ecf1; padding-top: 8px; }
    .live-typing { color: #4a90d9; font-weight: 700; min-height: 20px; font-size: .9rem; margin-bottom: 6px; word-break: break-all; }
    body.dyn-pink .live-typing { color: #d8567f; }
    body.dyn-green .live-typing { color: #4f8a45; }
    body.dyn-gold .live-typing { color: #a8791b; }
    body.dyn-red .live-typing { color: #8c332d; }
    .match-tip { display: none; text-align: center; padding: 10px 14px; border-radius: 12px; margin: 6px 0 10px; font-size: 1rem; font-weight: 700; color: #2f6fb2; background: rgba(74,144,217,.13); border: 1px solid rgba(74,144,217,.45); }
    .match-tip.show { display: block; }
    .match-tip.miss { color: #7f8fa6; background: rgba(122,134,150,.1); border-color: rgba(122,134,150,.3); }
    .score-line { font-size: .84rem; color: #6b7a90; margin: 10px 0 4px; }
    .btn-ok { padding: 9px 26px; border: none; border-radius: 8px; background: #4a90d9; color: #fff; font-size: .9rem; font-weight: 600; cursor: pointer; }
    .btn-ok:disabled { background: #c0c7cf; cursor: not-allowed; }
    .sec-hide { display: none; }
    .err { text-align: center; color: #e74c3c; padding: 34px 0; font-size: .9rem; }
    .t-new { color: #e08a2d; font-weight: 700; font-size: .95rem; margin: 10px 0; }
    body.dyn-pink .qa-opt.sel { background: rgba(240,98,146,.13); border-color: #f06292; }
    body.dyn-green .qa-opt.sel { background: rgba(111,158,99,.15); border-color: #6f9e63; }
    body.dyn-pink .match-tip { color: #d8567f; background: rgba(240,98,146,.13); border-color: rgba(240,98,146,.5); }
    body.dyn-green .match-tip { color: #4f8a45; background: rgba(111,158,99,.14); border-color: rgba(111,158,99,.5); }
  </style>
</head>
<body>
  <div class="headbar">
    <span class="title">默契空间</span>
    <a class="back" href="/sync.html" id="backLink">返回默契主页</a>
  </div>
  <div class="wrap" id="wrap"><div class="err">加载中…</div></div>

  <div class="glass-mask" id="pfMask" style="display:none;" onclick="if(event.target===this)pfClose()"><div class="glass-box" id="pfBox"></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    if (sessionStorage.getItem('isGuest') === 'true') { window.location.href = '/sync.html'; }
    const pairKey = (new URLSearchParams(location.search).get('pair') || '').trim();
    const pairNames = pairKey ? pairKey.split('|') : [];
    const isMember = pairNames.includes(myName);
    if (!pairKey || pairNames.length !== 2) {
      document.getElementById('wrap').innerHTML = '<div class="err">无法进入该默契空间</div>';
      throw new Error('pair deny');
    }
    let _dm = {};
    function dn(n) { return _dm[n] || n; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    // 主题色半透明磨砂弹窗（替代原生 confirm/提示）
    function pfModal(title, body, actionsHtml) {
      const m = document.getElementById('pfMask');
      const b = document.getElementById('pfBox');
      if (!m || !b) return;
      b.innerHTML = `<div style="font-weight:700;margin-bottom:8px;">${esc(title)}</div>
        <div style="color:#6b7a90;font-size:.88rem;line-height:1.6;">${body}</div>
        <div style="margin-top:6px;">${actionsHtml || ''}</div>`;
      m.style.display = 'flex';
    }
    function pfClose() { document.getElementById('pfMask').style.display = 'none'; }

    // ===== 主题引擎（五套） =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6, agly: 0.82, lyff: 0.8 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.g-row .go,.mpair';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        'body.dyn-pink .btn-ok{background:#f06292!important;border-color:#f06292!important}' +
        'body.dyn-pink .btn-ok:hover{background:#e0507f!important}' +
        'body.dyn-pink .mtl{color:#d8567f!important;background:#ffe9f0!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        'body.dyn-green .btn-ok{background:#6f9e63!important;border-color:#6f9e63!important}' +
        'body.dyn-green .btn-ok:hover{background:#5b8a50!important}' +
        'body.dyn-green .mtl{color:#5b8a50!important;background:#e6f1e2!important}';
          const gold = pink
      .replace(/dyn-pink/g, 'dyn-gold')
      .replace(/#f06292/g, '#d6a843')
      .replace(/#e0507f/g, '#b98a2e')
      .replace(/#a0345c/g, '#b98a2e')
      .replace(/#c73e79/g, '#a8791b')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(214, 168, 67,')
      .replace(/#ffb3c6/g, '#eeddb3')
      .replace(/#f9b7ca/g, '#f0e3bd')
      .replace(/#fff4f7/g, '#fff8ea')
      .replace(/#ffe3ec/g, '#fdf3dd');
    const red = pink
      .replace(/dyn-pink/g, 'dyn-red')
      .replace(/#f06292/g, '#a6403a')
      .replace(/#e0507f/g, '#8c332d')
      .replace(/#a0345c/g, '#8c332d')
      .replace(/#c73e79/g, '#8c332d')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(166, 64, 58,')
      .replace(/#ffb3c6/g, '#ddb5b2')
      .replace(/#f9b7ca/g, '#ddb5b2')
      .replace(/#fff4f7/g, '#fcf1f0')
      .replace(/#ffe3ec/g, '#faeae8');
    s.textContent = pink + '\n' + green + '\n' + gold + '\n' + red;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green', 'dyn-gold', 'dyn-red');
      if (id && id !== 'initial') {
        b.classList.add((id === 'agly') ? 'dyn-gold' : ((id === 'lyff') ? 'dyn-red' : ((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink')));
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = IS_MOBILE ? 'scroll' : 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', false);
    }
    const socket = io();
    function paintSaved() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
    }
    function applyTheme() {
      if (!socket.connected) return;
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    socket.on('connect', () => { paintSaved(); sendHeartbeat(); applyTheme(); });
    setTimeout(() => { paintSaved(); if (socket.connected) applyTheme(); }, 600);
    window.addEventListener('pageshow', () => { paintSaved(); if (socket.connected) applyTheme(); });
    setInterval(sendHeartbeat, 10000);

    // 当前组合信息（服务器下发的 score/titles/phase/members/ready 均以广播为准）
    let pairInfo = { score: 0, titles: [], phase: 'idle', members: [], readyGame: null, readyVotes: [], alias: '', aliasHistory: [], pendingName: '', pendingBy: '' };
    let qaMode = false;       // 是否进入问答视图
    let myAnswered = false;
    let lastQOpts = [];       // 当前题的选项（用于展示对方作答）
    let roundGain = 0;
    let wallMode = false;     // 是否打开画作墙
    let wallList = [];

    function fmtTs(ts) {
      const d = new Date(ts), p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function metaHtml() {
      const [a, b] = pairNames;
      const title = pairInfo.alias || `${dn(a)} × ${dn(b)}`;
      const sub = pairInfo.alias ? `${dn(a)} × ${dn(b)}` : '';
      const tls = pairInfo.titles && pairInfo.titles.length ? '　' + pairInfo.titles.map(t => `<span class="mtl">${esc(t)}</span>`).join(' ') : '';
      const viewer = !isMember;
      const present = viewer
        ? `<div class="present wait">只读查看：你不是该组合的成员，可查看默契分 / 称号 / 画作墙</div>`
        : (pairInfo.members.length >= 2
          ? `<div class="present">双方已就位，选择小游戏后双方准备即开始</div>`
          : `<div class="present wait">等待 ${esc(dn(pairNames.find(n => n !== myName)))} 进入默契空间…</div>`);
      return `<div class="meta">
        <span class="mpair">${esc(title)}</span>
        ${sub ? `<div class="asub">${esc(sub)}</div>` : ''}
        ${tls}
        <span class="mdetail">默契 ${pairInfo.score} 分</span>
      </div>${present}`;
    }
    // —— 组合名申请（仅成员）——
    function aliasBarHtml() {
      if (!isMember) return '';
      if (pairInfo.pendingName) {
        if (pairInfo.pendingBy === myName) {
          return `<div class="aliasbar">已申请组合名「${esc(pairInfo.pendingName)}」，等待对方同意…</div>`;
        }
        return `<div class="aliasbar">对方想把你们命名为「<b>${esc(pairInfo.pendingName)}</b>」
          <span class="go" onclick="aliasReply(true)" style="margin-left:10px;">同意</span>
          <span class="go" onclick="aliasReply(false)" style="margin-left:10px;">拒绝</span>
        </div>`;
      }
      return `<div class="aliasbar"><span class="go" onclick="aliasAsk()">给组合起个名字</span></div>`;
    }
    function aliasHistHtml() {
      const h = pairInfo.aliasHistory || [];
      if (!h.length) return '';
      return `<div class="alias-hist">曾用名：${h.map(x => esc(x.name || x)).join(' / ')}</div>`;
    }
    // ===== 默契宠物（B方案：代码圆萌宠物；预留素材位：pet.data.img 存在则优先用图） =====
    let petData = null;
    function petSvgHtml(color) {
      const size = petData ? Math.min(44 + petData.level * 2, 64) : 50;
      return `<svg width="${size * 1.7}" height="${size}" viewBox="0 0 100 60">
        <ellipse cx="50" cy="40" rx="38" ry="20" fill="${color}" fill-opacity=".45"/>
        <ellipse cx="42" cy="32" rx="12" ry="7" fill="#fff" fill-opacity=".35"/>
        <circle cx="38" cy="38" r="4.2" fill="#2c3e50"/><circle cx="62" cy="38" r="4.2" fill="#2c3e50"/>
        <circle cx="39.4" cy="36.6" r="1.5" fill="#fff"/><circle cx="63.4" cy="36.6" r="1.5" fill="#fff"/>
        <path d="M45 46 Q50 52 55 46" stroke="#2c3e50" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="30" cy="45" rx="3" ry="2" fill="#f2a0a8" fill-opacity=".7"/>
        <ellipse cx="70" cy="45" rx="3" ry="2" fill="#f2a0a8" fill-opacity=".7"/>
      </svg>`;
    }
    function petCardHtml() {
      if (!petData) return '<div class="pet-empty">🐾 宠物加载中…</div>';
      const next = Math.ceil(Math.sqrt(petData.exp / 4)) + 1;
      const pct = Math.min(100, Math.round((petData.exp / ((next * next) * 4)) * 100));
      return `<div class="pet-card">
        <div class="pet-head">默契宠物 · 等级 ${petData.level}</div>
        <div class="pet-svg">${petSvgHtml(petData.color)}</div>
        <div class="pet-meta">成长值 ${petData.exp}　·　距离下一级 ${pct}%</div>
        <div style="height:6px;background:#eef0f4;border-radius:4px;overflow:hidden;margin:6px 0;"><div style="height:100%;width:${pct}%;background:${petData.color};"></div></div>
        ${petData.canSign ? '<span class="go" onclick="petSignGo()">今日签到（+10 成长）</span>' : '<span class="soon">今日已签到</span>'}
        ${(petData.logs && petData.logs.length) ? `<div class="pet-logs">${petData.logs.map(l => `<div>${esc(l.t)}</div>`).join('')}</div>` : ''}
      </div>`;
    }
    function petLoad() {
      if (!isMember || !pairKey) return;
      socket.emit('sync_pet_get', { pair: pairKey }, (res) => {
        if (!res || !res.success) return;

      if (!canvas) return;

        const pts = st.p || [];

        ctx.strokeStyle = st.t === 'e' ? '#000' : (st.c || '#1a1a2e');

        ctx.moveTo(pts[0][0], pts[0][1]);

    // =====================================================

    let pPeekWord = null;         // 随机出词预览（仅画者可见，未确认前不进入绘制）

    const P_ER_W = [12, 28, 52];

    function paintClearTimer() {

    function paintViewReset() {

    let pTypingTimer = null;

    function redrawPaint(canvas) {
      if (!canvas) return;

        ctx.stroke();

    function paintEmit() {

    }
    function paintDrawCanvasInit() {
      const canvas = document.getElementById('paintCanvas');
      if (!canvas) return;
      redrawPaint(canvas);
      if (pRole !== 'drawer') return;
      let current = null;
      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        current = { t: pPenMode ? 'p' : 'e', c: P_PALETTE[pPenColorIdx], w: pPenMode ? P_PEN_W[pPenSizeIdx] : P_ER_W[pEraseIdx], p: [paintPos(e, canvas)] };
        pStrokes.push(current);
        redrawPaint(canvas);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!current) return;
        current.p.push(paintPos(e, canvas));
        redrawPaint(canvas);
      });
      const endStroke = () => {
        if (!current) return;
        current = null;
        paintEmit();
      };
      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);
    }
    function paintUndo() {
      pStrokes.pop();
      redrawPaint(document.getElementById('paintCanvas'));
      paintEmit();
    }
    function paintClearAll() {
      pStrokes = [];
      redrawPaint(document.getElementById('paintCanvas'));
      paintEmit();
    }
    // —— 猜者：猜测 ——
    function paintGuess() {
      const input = document.getElementById('guessInput');
      if (!input) return;
      const v = input.value.trim();
      if (!v) return;
      input.value = '';
      clearTimeout(pTypingTimer);
      socket.emit('paint_typing', { pair: pairKey, text: '' }, () => {});
      socket.emit('paint_guess', { pair: pairKey, text: v }, (res) => {
        if (res && res.correct === false) {
          pAttempts.push({ t: v, ts: Date.now() });
          const tip = document.getElementById('missTip');
          if (tip) tip.textContent = `不对哦，再想想（已猜 ${pAttempts.length} 次）`;
          const list = document.getElementById('attemptList');
          if (list) list.insertAdjacentHTML('beforeend', `<div class="attempt wrong">${esc(v)}</div>`);
        }
        // correct=true 时 paint_end 事件会接管
      });
    }
    // —— 阶段：结束 ——
    function paintEndBody() {
      const att = (pAttempts || []).map((a, i) => {
        const last = i === pAttempts.length - 1 && pEnd && pEnd.win;
        return `<div class="attempt ${last ? 'ok' : 'wrong'}">${esc(a.t)}${last ? '  ✓' : ''}</div>`;
      }).join('');
      const title = pEnd && pEnd.win ? `<div class="score-line" style="color:#27ae60;font-weight:700;font-size:1rem;">猜对啦！词是「${esc(pEnd.word)}」，默契分 +5</div>`
        : `<div class="score-line">时间到，没猜出来～ 词是「${esc((pEnd && pEnd.word) || '')}」</div>`;
      const newT = pNewTitle ? `<div class="t-new">解锁默契称号「${esc(pNewTitle)}」！</div>` : '';
      return `${title}${newT}
        <div class="glabel">画者：${esc(dn(pEnd ? pEnd.painter : pairNames[0]))} 的作画（上一步画布可见）</div>
        <div class="glabel">猜词记录（共 ${(pAttempts || []).length} 次）</div>
        ${att || '<div class="empty" style="padding:10px 0;">本轮没有猜测</div>'}
        <div style="margin-top:10px;font-size:.88rem;line-height:1.9;" id="pNextArea">${pNextMine
          ? '<span style="color:#9aa5b1;">已确认，等对方…</span>'
          : '<span class="go" onclick="paintNext()">下一轮</span>'}
          <span class="go" onclick="paintCancel()" style="margin-left:18px;color:#c62828;">取消</span>
        </div>`;
    }
    function paintNext() {
      socket.emit('paint_next', { pair: pairKey }, () => {});
    }
    function paintCancel() {
      pfModal('取消本局？', '现在返回菜单会取消本轮。对方会看到“对方已取消”的提示。',
        `<button class="vbtn ok" onclick="paintConfirmCancel()">确认取消</button><button class="vbtn no" onclick="pfClose()">暂不</button>`);
    }
    function paintConfirmCancel() {
      pSelfCancel = true;
      pfClose();
      socket.emit('paint_abort', { pair: pairKey }, () => {});
    }
    socket.on('paint_next_state', (data) => {
      if (!data || !paintOn || pStage !== 'end') return;
      pNextMine = (data.ready || []).includes(myName);
      paintRender();
    });
    // —— 你画我猜：服务器事件 ——
    function applyPaintRound(data) {
      paintOn = true;
      pRole = data.role;
      pStage = data.stage || 'word';
      pStrokes = [];
      pAttempts = [];
      pPaintSeen = [];
      pLiveTyping = '';
      pNextMine = false;
      pWord = null;
      pEnd = null;
      pGain = 0;
      pNewTitle = '';
      paintRender();
    }
    function applyPaintDraw(data) {
      // data: role / word(仅画者) / wordLen / deadline / strokes?
      pRole = data.role || pRole;
      pStage = 'draw';
      if (data.word !== undefined) pWord = data.word;
      pWordLen = data.wordLen || pWordLen;
      pDeadline = data.deadline || 0;
      if (data.strokes) pStrokes = data.strokes;
      pAttempts = [];
      pPaintSeen = [];
      pLiveTyping = '';
      paintRender();
    }
    socket.on('paint_round', (data) => { if (data) applyPaintRound(data); });
    socket.on('paint_restore', (data) => { if (data) applyPaintDraw(data); });
    socket.on('paint_draw_start', (data) => { if (data) applyPaintDraw(data); });
    socket.on('paint_strokes', (data) => {
      if (!data || !paintOn || pStage !== 'draw') return;
      pStrokes = data.strokes || [];
      redrawPaint(document.getElementById('paintCanvas'));
    });
    socket.on('paint_guess_miss', () => {
      const tip = document.getElementById('missTip');
      if (tip) tip.textContent = '不对哦，再想想';
    });
    socket.on('paint_typing', (data) => {
      if (!data || pRole !== 'drawer' || pStage !== 'draw') return;
      paintDrawerTyping(data.text || '');
    });
    socket.on('paint_attempt', (data) => {
      if (!data || pRole !== 'drawer' || pStage !== 'draw') return;
      pPaintSeen.push(String(data.t || ''));
      const box = document.getElementById('painterSeen');
      if (box) box.innerHTML = pPaintSeen.map(t => `<div class="attempt wrong">${esc(t)}</div>`).join('');
      paintDrawerTyping('');
    });
    socket.on('paint_attempt_ok', () => {
      paintDrawerTyping('猜对啦！');
    });
    socket.on('paint_end', (data) => {
      if (!data || !paintOn) return;
      paintClearTimer();
      pEnd = data;
      pStage = 'end';
      pWord = data.word;
      pAttempts = data.attempts || [];
      pGain = data.gain || 0;
      pNewTitle = data.newTitle || '';
      pairInfo.score = data.newScore;
      paintRender();
    });
    //__PAINT_MORE2__
    // 返回默契主页：游戏中退出需确认（会终止本局）；对方退出/掉线由 idle 事件提示
    function inSessionGame() { return isMember && (qaMode || paintOn); }
    function goBack() {
      if (inSessionGame()) {
        pfModal('退出确认', '现在退出会终止本局游戏，确定退出吗？',
          `<button class="vbtn ok" onclick="pfClose();doLeave()">退出</button><button class="vbtn no" onclick="pfClose()">继续玩</button>`);
        return;
      }
      doLeave();
    }
    function doLeave() {
      if (isMember) socket.emit('sync_leave', { pair: pairKey });
      window.location.href = '/sync.html';
    }
    document.getElementById('backLink').addEventListener('click', (e) => {
      e.preventDefault();
      goBack();
    });
    window.addEventListener('beforeunload', (e) => {
      if (inSessionGame()) { e.preventDefault(); e.returnValue = ''; }
    });
    window.addEventListener('pagehide', () => {
      if (isMember) socket.emit('sync_leave', { pair: pairKey });
    });
    // —— 进入 ——
    socket.on('connect', () => {
      socket.emit('get_display_names', (r) => { if (r && r.success) _dm = r.map; });
      socket.emit('sync_enter', { pair: pairKey }, (res) => {
        if (res && res.success) {
          pairInfo = Object.assign({}, pairInfo, {
            score: res.score || 0,
            titles: res.titles || [],
            phase: res.phase || 'idle',
            members: res.members || [],
            alias: res.alias || '',
            aliasHistory: res.aliasHistory || [],
            pendingName: res.pendingName || '',
            pendingBy: res.pendingBy || ''
          });
          // 进行中的小游戏视图由 onState / paint_* 事件接管
          if (!res.game || res.phase !== 'playing') renderRoot();
        } else {
          document.getElementById('wrap').innerHTML = '<div class="err">' + esc((res && res.msg) || '进入失败') + '</div>';
        }
      });
    });
  </script>
  <script>try {
    const _t = localStorage.getItem('myTheme');
    if (_t && _t !== 'initial' && typeof paintTheme === 'function') { paintTheme(_t); if (typeof applySticker === 'function') applySticker(_t); }
    // 身份注册完成后再校正主题：避免“过早读到 initial 把已存主题抹掉”
    let _a = 0;
    const _sync = () => socket.emit('get_profile', r => {
      if (r && r.success && r.theme && r.theme !== 'initial') {
        if (localStorage.getItem('myTheme') !== r.theme) {
          localStorage.setItem('myTheme', r.theme);
          paintTheme(r.theme);
          if (typeof applySticker === 'function') applySticker(r.theme);
        }
      } else if (_a < 3) { _a++; setTimeout(_sync, 500); }
    });
    setTimeout(_sync, 400);
  } catch (e) {}</script>
</body>
