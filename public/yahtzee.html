<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快艇骰子 · 联机版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px; }
    .game-top { max-width: 760px; margin: 0 auto 4px; display: flex; justify-content: flex-end; }
    .g-hall { color: #4a90d9; font-size: .84rem; cursor: pointer; text-decoration: underline; }
    h1 { text-align: center; margin-bottom: 6px; font-size: 1.5rem; }
    .status { text-align: center; margin-bottom: 12px; font-size: .92rem; }
    .status.turn { color: #4a90d9; font-weight: 700; }
    .status.wait { color: #6c757d; }
    .info { text-align: center; color: #6c757d; margin: 6px 0; font-size: .85rem; }

    /* ---- 玩家实时状态条：名字 + 实时骰子 + 总分（无卡片、细下划线风格） ---- */
    .player-strips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin: 2px 0 14px; }
    .pstrip { background: none; border: none; border-radius: 0; box-shadow: none; border-bottom: 2px solid transparent; padding: 2px 2px 6px; min-width: 104px; text-align: center; }
    .pstrip.turn { border-bottom-color: #f0c040; }
    .pstrip .pname { font-size: .8rem; font-weight: 700; margin-bottom: 3px; white-space: nowrap; color: #2c3e50; }
    .pstrip.me .pname { color: #4a90d9; }
    .pstrip .pname small { font-weight: 400; color: #8a97a5; margin-left: 2px; }
    .pstrip .ptotal { font-size: .8rem; font-weight: 700; color: #6b7a90; margin-top: 3px; }
    .mdice { display: flex; justify-content: center; gap: 3px; }
    .mdie { width: 21px; height: 21px; border-radius: 5px; background: #fff; border: 1.5px solid #adb5bd; font-size: .72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .mdie.hl { border-color: #4a90d9; background: #eaf2fb; }

    /* ---- 我的大骰子（掷骰者操作区） ---- */
    .dice-area { display: flex; justify-content: center; gap: 10px; margin: 10px 0 6px; min-height: 58px; }
    .die { width: 54px; height: 54px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; font-weight: 700; background: #fff; border: 3px solid #dee2e6; cursor: pointer; transition: all .2s; }
    .die.kept { border-color: #4a90d9; background: #eaf2fb; }
    .die.locked { opacity: .55; cursor: not-allowed; background: #e9ecef; }
    .controls { text-align: center; margin: 8px 0 14px; }
    button { padding: 9px 20px; border: none; border-radius: 8px; font-size: .9rem; font-weight: 600; cursor: pointer; margin: 4px; }
    button:disabled { background: #c0c7cf; cursor: not-allowed; }
    .btn-roll { background: #4a90d9; color: #fff; }
    .btn-submit { background: #27ae60; color: #fff; }
    .roll-info { margin-left: 6px; font-size: .85rem; color: #6c757d; }
    .cancel-row { text-align: center; margin: -2px 0 10px; }
    .cancel-link { color: #e74c3c; font-size: .78rem; text-decoration: underline; cursor: pointer; }
    .revoke-link { color: #6b7a90; font-size: .78rem; cursor: pointer; }
    .revoke-link:hover { color: #e74c3c; text-decoration: underline; }
    .pname .cv { color: #e74c3c; font-size: .68rem; margin-left: 4px; }
    .cancel-result { text-align: center; margin: 0 auto 12px; }
    .cancel-result .cr-tip { color: #e67e22; font-size: .9rem; margin-bottom: 12px; }

    /* ---- 合并计分总表：行=计分类别，列=每位玩家 ---- */
    .score-table-wrap { overflow-x: auto; max-width: 760px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.05); }
    table.score-table { border-collapse: collapse; width: 100%; min-width: 440px; font-size: .72rem; }
    .score-table th, .score-table td { border: 1px solid #e9ecef; padding: 3px 4px; text-align: center; }
    .score-table th { background: #f1f3f5; white-space: nowrap; }
    .score-table th.col-me { background: #dcebf9; }
    .score-table th.col-turn { background: #f7e8b5; }
    .score-table th.col-turn::after { content: ' 🎲'; }
    .score-table th.cat-head, .score-table td.cat-name { text-align: left; }
    .score-table td.cat-name { font-weight: 600; white-space: nowrap; }
    .score-table td.col-me { background: #f4f9fe; }
    .score-table td.col-turn { background: #fffbea; }
    .score-table tr.section td { background: #eef1f4; color: #495057; font-weight: 700; text-align: center; letter-spacing: 4px; }
    .score-table tr.total-row td { background: #eaf2fb; font-weight: 800; }
    .score-table tr.sum-row td { background: #f7f9fb; font-weight: 700; color: #495057; }
    .score-table td.pickable { cursor: pointer; color: #4a90d9; font-weight: 700; }
    .score-table td.picked { background: rgba(74,144,217,.16) !important; color: #2f6fb2; box-shadow: inset 0 0 0 2px rgba(74,144,217,.7); }
    .score-table td .pv { color: #4a90d9; font-weight: 600; }
    .score-table td.picked .pv { color: #2f6fb2; }
    /* ---- 结算结果面板（无卡片：分隔线列表排版） ---- */
    .result-panel { display: none; max-width: 480px; margin: 4px auto 16px; text-align: center; }
    .result-panel.visible { display: block; }
    .result-panel h2 { font-size: .92rem; letter-spacing: 3px; color: #6b7a90; margin: 0 0 10px; font-weight: 700; }
    .result-panel .rank-row { display: flex; align-items: baseline; gap: 8px; padding: 8px 6px; border-bottom: 1px dashed #e8ecf1; font-size: .95rem; }
    .result-panel .rank-row:last-of-type { border-bottom: none; }
    .result-panel .rank-row .rk { width: 26px; flex: none; color: #9aa5b1; font-size: .82rem; }
    .result-panel .rank-row .nm { color: #2c3e50; font-weight: 600; }
    .result-panel .rank-row.me .nm { color: #4a90d9; }
    .result-panel .rank-row.champ .nm { color: #d4890a; font-weight: 800; }
    .result-panel .rank-row .tag-champ { color: #d4890a; font-size: .72rem; border: 1px solid #e4b85c; padding: 0 7px; border-radius: 12px; line-height: 1.6; }
    .result-panel .rank-row .sc { margin-left: auto; color: #6b7a90; font-size: .9rem; }
    .result-panel .btn-back { margin-top: 16px; padding: 9px 30px; border: none; border-radius: 8px; background: #4a90d9; color: #fff; font-size: .9rem; font-weight: 600; cursor: pointer; }
    .result-panel .btn-back:hover { background: #357abd; }
    .result-panel .btn-back:disabled { background: #c0c7cf; cursor: not-allowed; }
    /* ---- 测试者开发者工具（直接结算） ---- */
    .dev-fab { display: none; position: fixed; right: 14px; bottom: 14px; background: #1a1a2e; color: #f0c040; border: none; border-radius: 22px; padding: 8px 14px; font-size: .8rem; font-weight: 600; cursor: pointer; opacity: .85; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .dev-fab:hover { opacity: 1; }
    .dev-panel { display: none; position: fixed; right: 14px; bottom: 60px; width: 300px; background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: 12px 14px; z-index: 1000; font-size: .82rem; }
    .dev-title { font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .dev-close { cursor: pointer; color: #6c757d; padding: 0 4px; }
    .dev-row { display: flex; gap: 6px; margin: 6px 0; align-items: center; }
    .dev-row input { flex: 1; padding: 6px 8px; border: 1px solid #dee2e6; border-radius: 8px; font-size: .8rem; outline: none; }
    .dev-row input[type=number] { flex: 0 0 74px; }
    .dev-del { cursor: pointer; color: #e74c3c; padding: 0 4px; font-weight: 700; }
    .dev-btn { width: 100%; background: #1a1a2e; color: #f0c040; border: none; border-radius: 8px; padding: 8px; font-size: .82rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .dev-btn.add { background: #eaf2fb; color: #4a90d9; }
    #devMsg { margin-top: 6px; min-height: 16px; color: #6c757d; }
    .dev-hr { margin: 10px 0; border: none; border-top: 1px solid #e9ecef; }
    .dev-label { font-weight: 600; margin: 4px 0; }
    .dev-panel select { width: 100%; padding: 6px 8px; border: 1px solid #dee2e6; border-radius: 8px; font-size: .8rem; outline: none; margin: 2px 0; }
    .dev-dice5 { display: flex; gap: 4px; margin: 6px 0; }
    .dev-dice5 input { flex: 1; width: 100%; text-align: center; padding: 6px 0; border: 1px solid #dee2e6; border-radius: 8px; font-size: .8rem; outline: none; }
    .dev-presets { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 2px; }
    .dev-presets span { background: #f1f3f5; border-radius: 6px; padding: 3px 7px; font-size: .75rem; cursor: pointer; user-select: none; }
    .dev-presets span:hover { background: #e2e6ea; }
    /* ---- 成就横幅 / 结算成就块 ---- */
    .ach-banner { position: fixed; top: 14px; left: 50%; transform: translate(-50%, -90px); background: rgba(26,26,46,.93); color: #fff; border: 1px solid #f0c040; border-radius: 12px; padding: 10px 18px; font-size: .9rem; font-weight: 600; z-index: 3000; opacity: 0; transition: all .35s; max-width: 86vw; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    .ach-banner.show { opacity: 1; transform: translate(-50%, 0); }
    .ach-banner.q-rare { border-color: #4caf50; }
    .ach-banner.q-epic { border-color: #9c27b0; }
    .ach-banner.q-legend { border-color: #ff9800; font-size: 1rem; }
    .ach-block { margin-top: 12px; padding-top: 8px; border-top: 1px dashed #e9ecef; text-align: left; }
    .ach-block h3 { font-size: .95rem; margin-bottom: 6px; }
    .ach-player { font-size: .85rem; margin: 3px 0; }
    .ach-q-common { color: #9e9e9e; }
    .ach-q-rare { color: #4caf50; font-weight: 600; }
    .ach-q-epic { color: #9c27b0; font-weight: 600; }
    .ach-q-legend { color: #ff9800; font-weight: 700; }
    .ach-q-hidden { color: #d32f2f; font-weight: 600; }
    @media (max-width: 560px) { .die { width: 46px; height: 46px; font-size: 1.4rem; } .pstrip { min-width: 96px; } }
    /* ===== p1 专属主题：素材背景 + 粉色点缀 ===== */
    body.theme-p1 { background-image: linear-gradient(rgba(255,255,255,.82), rgba(255,255,255,.82)), url('/assets/avatars/p1/beijing.png.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
    body.theme-p1 .g-hall { color: #f06292; }
    body.theme-p1 .btn-roll { background: #f06292; }
    body.theme-p1 .btn-roll:hover { background: #e0507f; }
    body.theme-p1 .toast, body.theme-p1 .home-toast { background: #a0345c; }
    /* ===== 粉/绿主题动态覆盖（body.dyn-* 由主题引擎切换） ===== */
    body.dyn-pink .status.turn { color: #f06292; }
    body.dyn-pink .pstrip.me .pname { color: #f06292; }
    body.dyn-pink .die.kept { border-color: #f06292; }
    body.dyn-pink .result-panel .btn-back { background: #f06292; }
    body.dyn-pink .result-panel .btn-back:hover { background: #e0507f; }
    body.dyn-pink .result-panel .rank-row.me .nm { color: #f06292; }
    body.dyn-green .status.turn { color: #6f9e63; }
    body.dyn-green .pstrip.me .pname { color: #6f9e63; }
    body.dyn-green .die.kept { border-color: #6f9e63; }
    body.dyn-green .result-panel .btn-back { background: #6f9e63; }
    body.dyn-green .result-panel .btn-back:hover { background: #5b8a50; }
    body.dyn-green .result-panel .rank-row.me .nm { color: #6f9e63; }
    /* ---- 计分表选中格：未选中无高亮，选中后=半透明主题色 ---- */
    body.dyn-pink .score-table td.pickable { color: #e0507f; }
    body.dyn-pink .score-table td.picked { background: rgba(240,98,146,.16) !important; color: #d8567f; box-shadow: inset 0 0 0 2px rgba(240,98,146,.7); }
    body.dyn-pink .score-table td.picked .pv { color: #d8567f; }
    body.dyn-green .score-table td.pickable { color: #5b8a50; }
    body.dyn-green .score-table td.picked { background: rgba(111,158,99,.18) !important; color: #5b8a50; box-shadow: inset 0 0 0 2px rgba(111,158,99,.7); }
    body.dyn-green .score-table td.picked .pv { color: #5b8a50; }
  </style>
</head>
<body>
  <!-- 成就即时解锁横幅 -->
  <div class="ach-banner" id="achBanner"></div>

  <!-- 顶部：返回大厅（玩家/观战者都可用） -->
  <div class="game-top">
    <span class="g-hall" onclick="goHallFromGame()">返回大厅</span>
  </div>

  <h1>快艇骰子</h1>
  <div class="status wait" id="status">加载游戏中...</div>

  <!-- 玩家实时状态条：名字 + 实时骰子 + 总分 -->
  <div class="player-strips" id="playerStrips"></div>

  <!-- 我的骰子操作区（掷骰 / 保持） -->
  <div class="dice-area" id="diceArea"></div>
  <div class="controls" id="controlsArea">
    <button class="btn-roll" id="rollBtn" onclick="roll()">掷骰子</button>
    <button class="btn-submit" id="submitBtn" onclick="submitScore()" disabled>提交计分</button>
    <span class="roll-info" id="rollInfo">剩余重掷：2次</span>
  </div>

  <!-- 取消本局（对局中的每位玩家可见；点取消需确认，同意后可撤回） -->
  <div class="cancel-row" id="cancelRow" style="display:none;">
    <span class="cancel-link" id="cancelLink" onclick="voteCancel()">取消本局</span>
    <span class="revoke-link" id="revokeLink" style="display:none;" onclick="revokeCancel()">已同意取消（0/0）· 撤回</span>
  </div>
  <!-- 本局被取消的提示（替代结算面板） -->
  <div class="cancel-result" id="cancelResult" style="display:none;"></div>

  <!-- 结算结果面板（游戏结束后显示：最终排名 + 返回房间） -->
  <div class="result-panel" id="resultPanel"></div>

  <!-- 合并计分总表 -->
  <div class="score-table-wrap">
    <table class="score-table" id="scoreTable"></table>
  </div>

  <!-- 测试者开发者工具：直接结算（仅测试账号可见按钮） -->
  <button class="dev-fab" id="devFab" onclick="devToggle(true)">🧪 直接结算</button>
  <div class="dev-panel" id="devPanel">
    <div class="dev-title">🧪 开发者工具
      <span class="dev-close" onclick="devToggle(false)">✖</span>
    </div>
    <div class="info" style="text-align:left;margin:0 0 4px;">为每个玩家填"总分"，点结束即可看到胜利/结算界面（会覆盖当前对局）。</div>
    <div id="devRows"></div>
    <button class="dev-btn add" onclick="devAddRow()">➕ 添加玩家</button>
    <button class="dev-btn" onclick="devFinish()">🏁 直接结束并显示排名</button>

    <hr class="dev-hr">
    <div class="dev-label">🎲 自定义本轮骰子（当作一次掷骰，可测即时成就）</div>
    <select id="devDicePlayer">
      <option value="">🎯 当前行动玩家</option>
    </select>
    <div class="dev-dice5">
      <input type="number" id="devDie1" value="6" min="1" max="6">
      <input type="number" id="devDie2" value="6" min="1" max="6">
      <input type="number" id="devDie3" value="6" min="1" max="6">
      <input type="number" id="devDie4" value="6" min="1" max="6">
      <input type="number" id="devDie5" value="6" min="1" max="6">
    </div>
    <div class="dev-presets">
      <span onclick="devPreset([6,6,6,6,6])">🎲 快艇</span>
      <span onclick="devPreset([2,2,2,5,5])">🏠 葫芦</span>
      <span onclick="devPreset([3,3,3,1,2])">三条</span>
      <span onclick="devPreset([1,2,3,4,6])">小顺</span>
    </div>
    <button class="dev-btn" onclick="devSetDice()">🎲 掷出这组骰子</button>

    <div id="devMsg"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const myName = sessionStorage.getItem('playerName') || '玩家';
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'yahtzee_001';

    let gameState = null;
    let isMyTurn = false;
    let selectedCategory = null;
    let isProcessing = false;
    let gameSummary = null;   // 本局成就汇总（结算面板展示）

    // ========== 主动拉取游戏状态（解决刷新丢失） ==========
    socket.on('connect', () => {
      console.log('✅ 已连接服务器，主动拉取游戏状态');
      if (roomId) socket.emit('get_game_state', roomId);
    });

    // ========== 心跳发送（防止被踢 + 刷新/跳转后自动续接身份） ==========
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', myName, sessionStorage.getItem('isTest') === 'true', true);
    }
    socket.on('connect', sendHeartbeat);
    setInterval(sendHeartbeat, 10000);

    // ===== p1 主题应用 =====
    // ===== 主题引擎 =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.g-hall,.save,.mini-link,.l-link,.l-link:hover,.gear,.gear:hover,.guest-toggle:hover,.f-link:hover,.theme-opt.active,.p-tri:hover,.player-card.online .status-text';
      const btn = '.controls #btnStart,.btn-roll';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        scoped('body.dyn-pink', '.g-tab.active') + '{color:#f06292!important;border-bottom-color:#ffb3c6!important}' +
        scoped('body.dyn-pink', '.g-tab:hover') + '{color:#f06292!important}' +
        scoped('body.dyn-pink', btn) + '{background:#f06292!important;border-color:#f06292!important}' +
        'body.dyn-pink .controls #btnStart:hover,body.dyn-pink .btn-roll:hover{background:#e0507f!important}' +
        'body.dyn-pink .game-link{border-bottom-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.occupied{border-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.ready{border-color:#f9b7ca!important;background:#fff4f7!important}' +
        'body.dyn-pink .me-tag{background:#ffe3ec!important;color:#e0507f!important}' +
        'body.dyn-pink .toast,body.dyn-pink .home-toast{background:#a0345c!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', '.g-tab.active') + '{color:#6f9e63!important;border-bottom-color:#a9c79e!important}' +
        scoped('body.dyn-green', '.g-tab:hover') + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', btn) + '{background:#6f9e63!important;border-color:#6f9e63!important}' +
        'body.dyn-green .controls #btnStart:hover,body.dyn-green .btn-roll:hover{background:#5b8a50!important}' +
        'body.dyn-green .game-link{border-bottom-color:#a9c79e!important}' +
        'body.dyn-green .seat.occupied{border-color:#a9c79e!important}' +
        'body.dyn-green .seat.ready{border-color:#b9d6af!important;background:#f2f8f0!important}' +
        'body.dyn-green .me-tag{background:#e6f1e2!important;color:#5b8a50!important}' +
        'body.dyn-green .toast,body.dyn-green .home-toast{background:#48673f!important}';
      s.textContent = pink + '\n' + green;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green');
      if (id && id !== 'initial') {
        b.classList.add((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink');
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function applyTheme() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    socket.on('connect', applyTheme);
    setTimeout(applyTheme, 600);

    // ===== 显示名映射（服务器内部用真名，展示统一翻译成昵称）=====
    let _dispMap = {};
    function dn(n) { return _dispMap[n] || n; }
    socket.on('connect', () => {
      socket.emit('get_display_names', (r) => { if (r && r.success) { _dispMap = r.map; updateUI(); } });
    });

    // ========== 计分类别定义 ==========
    const CATEGORIES = [
      { id: 'ones', name: '1点' }, { id: 'twos', name: '2点' }, { id: 'threes', name: '3点' },
      { id: 'fours', name: '4点' }, { id: 'fives', name: '5点' }, { id: 'sixes', name: '6点' },
      { id: 'threeOfAKind', name: '三条' }, { id: 'fourOfAKind', name: '四条' },
      { id: 'fullHouse', name: '葫芦' }, { id: 'smallStraight', name: '小顺' },
      { id: 'largeStraight', name: '大顺' }, { id: 'yahtzee', name: '快艇' }, { id: 'chance', name: '机会' }
    ];
    const UPPER_IDS = ['ones','twos','threes','fours','fives','sixes'];
    const LOWER_IDS = ['threeOfAKind','fourOfAKind','fullHouse','smallStraight','largeStraight','yahtzee','chance'];

    // ========== 游戏状态更新 ==========
    socket.on('game_state', (state) => {
      gameState = state;
      // 新一局开始时清掉上一局的成就汇总（只有 finished 那局保留展示）
      if (state.phase !== 'finished') gameSummary = null;
      isMyTurn = state.currentPlayer === myName;
      // 回合/状态变化后清掉本地选中的格子（下家回合或自己已提交时）
      const myData = state.players[myName];
      if (state.currentPlayer !== myName) selectedCategory = null;
      if (myData && selectedCategory && myData.scores[selectedCategory] !== undefined) selectedCategory = null;
      updateUI();
      devRefreshDicePlayer(); // 状态变化时刷新"自定义骰子"的玩家下拉
    });

    function getTotal(playerData) {
      if (!playerData) return { upper: 0, bonus: 0, lower: 0, yahtzeeBonus: 0, total: 0 };
      const upper = UPPER_IDS.reduce((s,id) => s + (playerData.scores[id] || 0), 0);
      const bonus = upper >= 63 ? 35 : 0;
      const lower = LOWER_IDS.reduce((s,id) => s + (playerData.scores[id] || 0), 0);
      const yahtzeeBonus = playerData.yahtzeeBonus || 0;   // 重复快艇 +100
      return { upper, bonus, lower, yahtzeeBonus, total: upper + bonus + lower + yahtzeeBonus };
    }

    // 小骰子（状态条用）：所有人都能看到当前这位玩家的实时骰面
    function miniDiceHtml(p, isTurn) {
      if (!p || !Array.isArray(p.dice)) {
        return '<div class="mdice">' + [0,1,2,3,4].map(() => '<div class="mdie">·</div>').join('') + '</div>';
      }
      return '<div class="mdice">' + p.dice.map((v, i) =>
        `<div class="mdie ${p.kept && p.kept[i] ? 'hl' : ''}">${v}</div>`
      ).join('') + '</div>';
    }

    // 玩家状态条（含实时骰子，观战者也看得到）
    function renderPlayerStrips(order) {
      const gs = gameState;
      document.getElementById('playerStrips').innerHTML = order.map(name => {
        const p = gs.players[name];
        const t = getTotal(p);
        const isMe = name === myName;
        const isTurn = name === gs.currentPlayer;
        const showDice = gs.phase !== 'finished';
        return `
          <div class="pstrip ${isMe ? 'me' : ''} ${isTurn ? 'turn' : ''}">
            <div class="pname">${dn(name)} ${isMe ? '<small>(你)</small>' : ''} ${isTurn ? '<small>行动中</small>' : ''}${(gs.cancelVotes || []).includes(name) ? '<span class="cv">已同意取消</span>' : ''}</div>
            ${showDice ? miniDiceHtml(p, isTurn) : ''}
            <div class="ptotal">总分 ${t.total}</div>
          </div>`;
      }).join('');
    }

    // 我的大骰子操作区（仅自己是玩家且对局中才显示）
    function renderMyDice() {
      const gs = gameState;
      const myData = gs.players[myName];
      const diceDiv = document.getElementById('diceArea');
      if (gs.phase === 'finished') {
        diceDiv.innerHTML = '<div class="info">本局已结束，点击返回房间重新开始</div>';
        return;
      }
      if (myData) {
        diceDiv.innerHTML = myData.dice.map((v, i) =>
          `<div class="die ${myData.kept[i] ? 'kept' : ''} ${!isMyTurn ? 'locked' : ''}" onclick="${isMyTurn ? `toggleKeep(${i})` : ''}">${v}</div>`
        ).join('');
      } else {
        diceDiv.innerHTML = '<div class="info">观战中：上方可实时看到每位玩家的骰子与总分</div>';
      }
    }
    // ========== 合并计分总表 ==========
    // 行 = 计分类别（含小计/总分行），列 = 每位玩家；当前行动玩家整列高亮。
    function renderScoreTable(order) {
      const gs = gameState;
      const tHead = `<tr>
        <th class="cat-head">计分类别</th>
        ${order.map(name => {
          const cls = (name === myName ? 'col-me' : '') + ' ' + (name === gs.currentPlayer ? 'col-turn' : '');
          return `<th class="${cls.trim()}">${dn(name)}${name === myName ? ' (你)' : ''}</th>`;
        }).join('')}
      </tr>`;

      // 单个类别行
      const catRow = (c) => {
        const tds = order.map(name => {
          const p = gs.players[name];
          const filled = p && p.scores[c.id] !== undefined;
          const isMe = name === myName;
          const clickable = isMyTurn && isMe && !filled && gs.phase === 'playing';
          const picked = clickable && selectedCategory === c.id;
          const preview = (!filled && isMe && p && p.previewScores && p.previewScores[c.id] !== undefined) ? p.previewScores[c.id] : null;
          const cls = (isMe ? 'col-me' : '') + ' ' + (name === gs.currentPlayer ? 'col-turn' : '') + ' ' + (clickable ? 'pickable' : '') + ' ' + (picked ? 'picked' : '');
          let val = '-';
          if (filled) val = `<span class="filled-val">${p.scores[c.id]}</span>`;
          else if (preview !== null) val = `<span class="pv">${preview}</span>`;
          return `<td class="${cls.trim()}" ${clickable ? `onclick="selectCategory('${c.id}')"` : ''}>${val}</td>`;
        }).join('');
        return `<tr><td class="cat-name">${c.name}</td>${tds}</tr>`;
      };

      // 汇总行（上半区小计 / 奖励 / 下半区小计 / 总分）
      const sumRow = (label, key, rowCls) => {
        const tds = order.map(name => {
          const t = getTotal(gs.players[name]);
          const cls = (name === myName ? 'col-me' : '') + ' ' + (name === gs.currentPlayer ? 'col-turn' : '');
          return `<td class="${cls.trim()}">${t[key]}</td>`;
        }).join('');
        return `<tr class="${rowCls}"><td class="cat-name">${label}</td>${tds}</tr>`;
      };

      document.getElementById('scoreTable').innerHTML = `
        <thead>${tHead}</thead>
        <tbody>
          <tr class="section"><td class="cat-name" colspan="${order.length + 1}">上 半 区</td></tr>
          ${CATEGORIES.slice(0, 6).map(catRow).join('')}
          ${sumRow('上半区小计', 'upper', 'sum-row')}
          ${sumRow('奖励 (+35)', 'bonus', 'sum-row')}
          <tr class="section"><td class="cat-name" colspan="${order.length + 1}">下 半 区</td></tr>
          ${CATEGORIES.slice(6).map(catRow).join('')}
          ${sumRow('下半区小计', 'lower', 'sum-row')}
          ${sumRow('重复快艇奖励', 'yahtzeeBonus', 'sum-row')}
          ${sumRow('总 分', 'total', 'total-row')}
        </tbody>`;
    }
    // ========== 主渲染入口 ==========
    function updateUI() {
      if (!gameState) {
        // 等待游戏开始：灰色骰子 + 只有类别名的空表
        document.getElementById('status').className = 'status wait';
        document.getElementById('status').textContent = '等待游戏开始...';
        document.getElementById('playerStrips').innerHTML = '';
        renderInitialDice();
        renderEmptyTable();
        document.getElementById('resultPanel').className = 'result-panel'; // 隐藏结算面板
        document.getElementById('rollBtn').disabled = true;
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('rollInfo').textContent = '';
        return;
      }

      const gs = gameState;
      const order = gs.playerOrder || Object.keys(gs.players);
      const myData = gs.players[myName];
      const diceBox = document.getElementById('diceArea');
      const ctrls = document.getElementById('controlsArea');
      const stripBox = document.getElementById('playerStrips');
      const cancelRow = document.getElementById('cancelRow');
      const cancelLink = document.getElementById('cancelLink');
      const revokeLink = document.getElementById('revokeLink');
      const cancelResult = document.getElementById('cancelResult');
      const votes = gs.cancelVotes || [];
      const ended = gs.phase === 'finished' || gs.phase === 'cancelled';

      // 顶部状态
      const statusEl = document.getElementById('status');
      if (ended) {
        diceBox.style.display = 'none';   // 结束态隐藏骰子区
        ctrls.style.display = 'none';     // 结束态隐藏掷骰/提交按钮
        stripBox.style.display = 'none';  // 结束态隐藏玩家条
        cancelRow.style.display = 'none';
        if (gs.phase === 'cancelled') {
          statusEl.className = 'status wait';
          statusEl.textContent = '本局已取消，不记录战绩';
          document.getElementById('resultPanel').className = 'result-panel'; // 隐藏结算面板
          renderCancelNotice();
        } else {
          statusEl.className = 'status wait';
          statusEl.textContent = '游戏结束！' + (myData ? ` 你的总分：${getTotal(myData).total}` : '');
          renderResultPanel();   // 显示最终排名 + 返回房间按钮
        }
      } else {
        document.getElementById('resultPanel').className = 'result-panel'; // 隐藏结算面板
        cancelResult.style.display = 'none';
        diceBox.style.display = '';
        ctrls.style.display = '';
        stripBox.style.display = '';
        // 取消本局入口：仅对局中的玩家可见（未同意=取消按钮带进度；已同意=撤回入口）
        if (myData) {
          cancelRow.style.display = 'block';
          const n = votes.length, m = gs.playerOrder.length;
          const agreed = votes.includes(myName);
          cancelLink.style.display = agreed ? 'none' : '';
          cancelLink.textContent = `取消本局（已同意 ${n}/${m}）`;
          revokeLink.style.display = agreed ? '' : 'none';
          revokeLink.textContent = `已同意取消（${n}/${m}）· 撤回`;
        } else {
          cancelRow.style.display = 'none';
        }
        if (isMyTurn) {
          statusEl.className = 'status turn';
          statusEl.textContent = `轮到你了！第 ${gs.round} / 13 轮`;
        } else {
          statusEl.className = 'status wait';
          statusEl.textContent = `等待 ${dn(gs.currentPlayer)} 掷骰...（第 ${gs.round} / 13 轮）`;
        }
      }

      renderPlayerStrips(order);
      renderMyDice();
      renderScoreTable(order);

      // 按钮状态
      document.getElementById('rollBtn').disabled = !isMyTurn || (myData && myData.rollCount >= 3) || gs.phase === 'finished';
      document.getElementById('rollInfo').textContent = myData ? `剩余重掷：${3 - myData.rollCount}次` : '';
      document.getElementById('submitBtn').disabled = !isMyTurn || !selectedCategory || gs.phase === 'finished';
    }

    // ---------- 等待态的初始渲染 ----------
    function renderInitialDice() {
      document.getElementById('diceArea').innerHTML =
        [1,1,1,1,1].map(v => `<div class="die locked">${v}</div>`).join('');
    }

    function renderEmptyTable() {
      const rows = CATEGORIES.map(c => `<tr><td class="cat-name">${c.name}</td><td>-</td></tr>`).join('');
      document.getElementById('scoreTable').innerHTML = `
        <thead><tr><th class="cat-head">计分类别</th><th>等待玩家...</th></tr></thead>
        <tbody>${rows}</tbody>`;
    }

    // ========== 取消对局：确认后投同意票；同意后可从底部入口撤回 ==========
    function voteCancel() {
      if (!confirm('确定要取消本局吗？全员同意后将结束本局，不计入场次与胜率（已触发成就保留）。')) return;
      socket.emit('vote_cancel', {}, () => {});
    }
    function revokeCancel() {
      socket.emit('vote_cancel', { revoke: true }, () => {});
    }
    function renderCancelNotice() {
      const el = document.getElementById('cancelResult');
      el.style.display = 'block';
      el.innerHTML = `<div class="cr-tip">本局已被全员同意取消：不计入场次与胜率，已触发的成就保留。</div>
        <button class="btn-roll" onclick="backToRoom()">返回房间</button>`;
    }

    // ========== 结算面板：最终排名 + 返回房间 ==========
    function renderResultPanel() {
      const gs = gameState;
      const order = gs.playerOrder || Object.keys(gs.players);
      const list = order.map(name => ({ name, total: getTotal(gs.players[name]).total }));
      list.sort((a, b) => b.total - a.total);

      // 名次：同分给相同名次（统一中文数字）
      const CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
      let rank = 0, prevTotal = null;
      const rows = list.map((it, i) => {
        if (prevTotal === null || it.total !== prevTotal) rank = i + 1;
        prevTotal = it.total;
        const rankCn = CN_NUM[rank - 1] || String(rank);
        const isChamp = rank === 1;
        const isMe = it.name === myName;
        return `<div class="rank-row ${isChamp ? 'champ' : ''} ${isMe ? 'me' : ''}">
          <span class="rk">${rankCn}</span>
          <span class="nm">${dn(it.name)}${isMe ? '（你）' : ''}</span>
          ${isChamp ? '<span class="tag-champ">冠军</span>' : ''}
          <span class="sc">${it.total} 分</span>
        </div>`;
      }).join('');

      const achHtml = buildAchievementBlock();

      const panel = document.getElementById('resultPanel');
      panel.className = 'result-panel visible';
      panel.innerHTML = `<h2>最终排名</h2>${rows}${achHtml}
        <button class="btn-back" onclick="backToRoom()">返回房间</button>`;
    }

    // ========== 成就：结算汇总展示 + 即时横幅 ==========
    function buildAchievementBlock() {
      if (!gameSummary || !gameSummary.players) return '';
      const entries = Object.entries(gameSummary.players).filter(([, arr]) => arr && arr.length);
      if (!entries.length) return '';
      const lines = entries.map(([pname, arr]) =>
        `<div class="ach-player">${dn(pname)}：${arr.map(a => `<span class="ach-q-${a.quality}">${a.name}</span>`).join('、')}</div>`
      ).join('');
      return `<div class="ach-block"><h3>本局成就</h3>${lines}</div>`;
    }

    // 结算时服务器广播"本局成就汇总"（含即时成就，标明达成玩家）
    socket.on('achievement_summary', (data) => {
      if (data && data.players) { gameSummary = data; updateUI(); }
    });

    // 即时解锁横幅
    let achBannerTimer = null;
    function showAchBanner(data) {
      if (!data || !data.name) return;
      const el = document.getElementById('achBanner');
      el.innerHTML = `<b>${dn(data.playerName)}</b> 获得成就 <b>${data.name}</b>`;
      el.className = 'ach-banner show q-' + (data.quality || 'common');
      clearTimeout(achBannerTimer);
      achBannerTimer = setTimeout(() => { el.className = 'ach-banner'; }, 3200);
    }
    socket.on('achievement_unlocked', showAchBanner);

    // 返回房间：先通知服务器清理本局（复位准备状态），再跳回房间页
    function backToRoom() {
      const btn = document.querySelector('#resultPanel .btn-back');
      if (btn) { btn.disabled = true; btn.textContent = '正在返回房间...'; }
      let done = false;
      const go = () => {
        if (done) return;
        done = true;
        window.location.href = '/room.html?game=yahtzee';
      };
      socket.emit('return_room', () => go());
      setTimeout(go, 1500); // 兜底：服务器无响应也跳转
    }

    // 返回大厅（玩家/观战者都可用；对局中离开会退出房间）
    function goHallFromGame() {
      const inGame = gameState && gameState.phase === 'playing';
      if (inGame && !confirm('确定离开当前对局、返回大厅吗？')) return;
      socket.emit('leave_room', 'yahtzee', () => { window.location.href = '/lobby.html'; });
    }

    // ========== 操作函数 ==========
    function toggleKeep(i) {
      if (!isMyTurn || isProcessing) return;
      socket.emit('yahtzee_action', { action: 'toggle_keep', index: i });
    }

    // 点选/取消计分格子：再次点击同一格可取消选中
    function selectCategory(id) {
      if (!isMyTurn || isProcessing || gameState?.phase !== 'playing') return;
      selectedCategory = (selectedCategory === id) ? null : id;
      socket.emit('yahtzee_action', { action: 'select_category', category: id });
      updateUI();
    }

    function roll() {
      if (!isMyTurn || isProcessing || gameState?.phase === 'finished') return;
      isProcessing = true;
      socket.emit('yahtzee_action', { action: 'roll' });
      setTimeout(() => { isProcessing = false; }, 500);
    }

    function submitScore() {
      if (!isMyTurn || !selectedCategory || isProcessing || gameState?.phase === 'finished') return;
      isProcessing = true;
      socket.emit('yahtzee_action', { action: 'submit_score', category: selectedCategory });
      setTimeout(() => {
        isProcessing = false;
        selectedCategory = null;
      }, 500);
    }

    // ========== 页面加载后立即先渲染一次界面 ==========
    updateUI();

    // ========== 测试者开发者工具：直接结算（仅测试账号显示） ==========
    const devIsTest = sessionStorage.getItem('isTest') === 'true';
    let devRows = [];

    function devToggle(show) {
      document.getElementById('devPanel').style.display = show ? 'block' : 'none';
      document.getElementById('devMsg').textContent = '';
      if (show) devRefreshDicePlayer(); // 打开面板时刷新"自定义骰子"的玩家下拉
    }
    function devAddRow(name, total) {
      devRows.push({ name: name || '', total: Number(total) || 0 });
      devRenderRows();
    }
    function devRemoveRow(i) {
      devRows.splice(i, 1);
      devRenderRows();
    }
    function devRenderRows() {
      document.getElementById('devRows').innerHTML = devRows.map((r, i) => `
        <div class="dev-row">
          <input value="${r.name}" placeholder="玩家名" onchange="devRows[${i}].name = this.value">
          <input type="number" value="${r.total}" min="0" max="2000" onchange="devRows[${i}].total = Number(this.value)">
          <span class="dev-del" onclick="devRemoveRow(${i})">✖</span>
        </div>`).join('');
    }
    function devFinish() {
      const players = devRows
        .map(r => ({ name: String(r.name || '').trim(), total: Number(r.total) || 0 }))
        .filter(p => p.name);
      if (!players.length) {
        document.getElementById('devMsg').textContent = '⚠️ 请至少填写一个玩家名';
        return;
      }
      document.getElementById('devMsg').textContent = '提交中...';
      socket.emit('dev_finish_yahtzee', { players }, (res) => {
        const msg = document.getElementById('devMsg');
        if (res && res.success) {
          msg.textContent = '✅ 已生成结算：' + (res.names || []).join('、');
        } else {
          msg.textContent = '❌ ' + ((res && res.msg) || '调用失败');
        }
      });
    }
    // ========== 自定义本轮骰子（测试即时成就） ==========
    function devRefreshDicePlayer() {
      const sel = document.getElementById('devDicePlayer');
      if (!sel) return;
      const prev = sel.value;
      const order = (gameState && gameState.playerOrder) || [];
      sel.innerHTML = '<option value="">🎯 当前行动玩家</option>' +
        order.map(n => `<option value="${n}">${n}</option>`).join('');
      if (prev && order.includes(prev)) sel.value = prev;
    }
    function devPreset(arr) {
      (arr || []).slice(0, 5).forEach((v, i) => {
        const el = document.getElementById('devDie' + (i + 1));
        if (el) el.value = v;
      });
    }
    function devSetDice() {
      const msg = document.getElementById('devMsg');
      const dice = [1, 2, 3, 4, 5].map(i => Number(document.getElementById('devDie' + i).value));
      if (dice.some(n => !Number.isInteger(n) || n < 1 || n > 6)) {
        msg.textContent = '⚠️ 骰子点数必须是 1~6';
        return;
      }
      msg.textContent = '掷骰中...';
      const target = document.getElementById('devDicePlayer').value;
      socket.emit('dev_set_dice', { name: target, dice }, (res) => {
        msg.textContent = (res && res.success)
          ? `✅ ${res.name} 已掷出 ${dice.join(',')}（第 ${res.rollCount} 掷）`
          : '❌ ' + ((res && res.msg) || '调用失败');
      });
    }

    // 仅测试账号初始化：显示按钮，并按当前对局玩家预填名单（游客一律不显示）
    if (devIsTest && sessionStorage.getItem('isGuest') !== 'true') {
      document.getElementById('devFab').style.display = 'block';
      const names = (gameState && gameState.playerOrder) ? gameState.playerOrder : ['玩家1', '玩家2', '玩家3', '玩家4'];
      names.forEach(n => devAddRow(n, 0));
    }
  </script>
</body>
</html>
