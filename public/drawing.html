<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画猜接龙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 640px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 14px 4px 60px; }
    .lab { font-size: .76rem; color: #9aa5b1; letter-spacing: 1px; margin: 16px 0 6px; border-bottom: 1px solid #e8ecf1; padding: 0 2px 6px; }
    .stage-line { font-size: .95rem; font-weight: 700; margin: 8px 0; }
    .who { color: #6b7a90; font-size: .84rem; margin-bottom: 10px; }
    .role-hint { color: #4a90d9; font-weight: 700; font-size: .92rem; margin-bottom: 6px; }
    .line-input { width: 100%; padding: 10px 12px; border: 1px solid #d7dde3; border-radius: 10px; font-size: .95rem; outline: none; background: #fff; color: #2c3e50; }
    .btn-ok { padding: 9px 26px; border: none; border-radius: 8px; background: #4a90d9; color: #fff; font-size: .9rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-ok.gray { background: #6b7a90; }
    .vbtn { border-radius: 10px; padding: 10px 26px; font-size: .92rem; font-weight: 700; cursor: pointer; border: 1px solid transparent; margin: 4px 8px 4px 0; }
    .vbtn.ok { color: #2f6fb2; background: rgba(74,144,217,.13); border-color: rgba(74,144,217,.55); }
    .vbtn.no { color: #c62828; background: rgba(231,76,60,.1); border-color: rgba(231,76,60,.4); }
    .vbtn.pick { color: #2f6fb2; background: rgba(74,144,217,.12); border-color: rgba(74,144,217,.45); }
    body.dyn-pink .vbtn.ok, body.dyn-pink .vbtn.pick { color: #d8567f; background: rgba(240,98,146,.13); border-color: rgba(240,98,146,.5); }
    body.dyn-green .vbtn.ok, body.dyn-green .vbtn.pick { color: #4f8a45; background: rgba(111,158,99,.15); border-color: rgba(111,158,99,.5); }
    body.dyn-pink .vbtn.no { color: #d8567f; background: rgba(240,98,146,.1); border-color: rgba(240,98,146,.35); }
    body.dyn-green .vbtn.no { color: #c0392b; background: rgba(231,76,60,.1); border-color: rgba(231,76,60,.35); }
    .glass-mask { position: fixed; inset: 0; background: rgba(30,40,60,.2); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 99; display: flex; align-items: center; justify-content: center; }
    .glass-box { background: rgba(255,255,255,.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(74,144,217,.4); border-radius: 16px; padding: 20px 22px; max-width: 330px; width: 86%; text-align: center; box-shadow: 0 8px 30px rgba(31,45,61,.18); }
    body.dyn-pink .glass-box { border-color: rgba(240,98,146,.45); }
    body.dyn-green .glass-box { border-color: rgba(111,158,99,.45); }
    .paint-canvas-box { border: 1px solid #e2e6eb; border-radius: 12px; background: #fff; padding: 6px; margin: 8px 0; }
    .paint-canvas { width: 100%; height: auto; display: block; touch-action: none; background: #fff; border-radius: 8px; cursor: crosshair; }
    .ptools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 6px 0; }
    .pcolor { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .pcolor.on { border-color: #2c3e50; }
    .pbtn { border: 1px solid #dfe3e8; background: #fff; color: #2c3e50; border-radius: 8px; padding: 4px 10px; font-size: .8rem; cursor: pointer; }
    .pbtn.on { background: rgba(74,144,217,.15); border-color: #4a90d9; font-weight: 700; }
    .secret { color: #e08a2d; font-size: 1rem; font-weight: 700; margin: 6px 0; }
    .guess-box { display: flex; gap: 8px; margin: 10px 0 6px; }
    .guess-box input { flex: 1; padding: 10px 12px; border: 1px solid #d7dde3; border-radius: 10px; font-size: .95rem; outline: none; }
    .guess-box button { padding: 0 20px; border: none; border-radius: 10px; background: #2c3e50; color: #fff; font-size: .9rem; cursor: pointer; }
    .mini-canvas { border: 1px solid #eef0f4; border-radius: 8px; background: #fff; width: 100%; height: auto; margin: 4px 0; }
    .reveal-grid { padding: 4px 0; }
    .rv-step { padding: 10px 2px; border-bottom: 1px dashed #eef0f4; }
    .rv-step .rv-label { font-size: .76rem; color: #9aa5b1; margin-bottom: 4px; }
    .ok-text { color: #27ae60; font-weight: 700; }
    .no-text { color: #e74c3c; font-weight: 700; }
    .empty { text-align: center; color: #adb5bd; padding: 40px 0; font-size: .88rem; }
    .err { text-align: center; color: #e74c3c; padding: 30px 0; font-size: .9rem; }
    .msg-line { color: #e67e22; font-size: .85rem; min-height: 18px; margin-top: 6px; }
    /* “已提交”状态徽章：主题色半透明（默认蓝 / dyn-pink / dyn-green） */
    .chip.done { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 11px; color: #1f6fae; background: rgba(74,144,217,.16); border: 1px solid rgba(74,144,217,.45); font-size: .82rem; }
    body.dyn-pink .chip.done { color: #c73e79; background: rgba(240,98,146,.16); border-color: rgba(240,98,146,.5); }
    body.dyn-green .chip.done { color: #4f8a45; background: rgba(111,158,99,.17); border-color: rgba(111,158,99,.5); }
  </style>
</head>
<body>
  <div class="headbar">
    <span class="title">画猜接龙</span>
    <span style="display:none;" id="dgCancelLink"><span class="go" style="margin-right:14px;color:#e74c3c;" onclick="openCancel()">取消本局</span></span>
    <a class="back" href="#" onclick="backRoom();return false;" id="topBack">返回房间</a>
  </div>
  <div class="wrap" id="wrap"><div class="empty">加载中…</div></div>

  <!-- 取消本局确认（磨砂半透明主题弹窗） -->
  <div class="glass-mask" id="cancelMask" style="display:none;" onclick="if(event.target===this)closeCancel()">
    <div class="glass-box" id="cancelBox"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.role-hint';
      const pink = scoped('body.dyn-pink', col) + '{color:#f06292!important}';
      const green = scoped('body.dyn-green', col) + '{color:#6f9e63!important}';
      s.textContent = pink + '\n' + green;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green');
      if (id && id !== 'initial') {
        b.classList.add((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink');
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', true);
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    const socket = io();
    function applyTheme() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    socket.on('connect', () => {
      paintTheme(); sendHeartbeat();
      // 通知服务器“我已真正打开画猜游戏页”（先心跳登记身份，再上报在场）
      socket.emit('dg_enter');
    });
    setTimeout(() => { if (socket.connected) applyTheme(); }, 600);
    window.addEventListener('pageshow', () => { if (socket.connected) applyTheme(); });
    setInterval(sendHeartbeat, 10000);

    // ===== 显示名 =====
    let _dm = {};
    function dn(n) { return _dm[n] || n; }

    // ===== 画布（本地 strokes）=====
    let dStrokes = [];
    let penMode = true, penColIdx = 0, penSizeIdx = 1, erSizeIdx = 1;
    const PALETTE = ['#1a1a2e', '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e84393', '#8d6e63'];
    const PW = [3, 7, 12], EW = [12, 28, 52];
    function dPos(e, c) { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 900, (e.clientY - r.top) / r.height * 540]; }
    function drawReplay(canvas, strokes) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 900, 540);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 900, 540);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const st of strokes || []) {
        const pts = st.p || []; if (!pts.length) continue;
        ctx.globalCompositeOperation = st.t === 'e' ? 'destination-out' : 'source-over';
        ctx.strokeStyle = st.t === 'e' ? '#000' : (st.c || '#1a1a2e');
        ctx.lineWidth = st.w || 7;
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    function toolsHtml() {
      const colorBtns = PALETTE.map((c, i) => `<span class="pcolor ${i === penColIdx ? 'on' : ''}" style="background:${c};" onclick="pickColor(${i})"></span>`).join('');
      const sizes = (penMode ? PW : EW).map((w, i) => `<button class="pbtn ${(penMode ? penSizeIdx : erSizeIdx) === i ? 'on' : ''}" onclick="pickSize(${i})">${w}px</button>`).join('');
      return `<div class="ptools">
        <button class="pbtn ${penMode ? 'on' : ''}" onclick="pickMode(true)">画笔</button>
        <button class="pbtn ${!penMode ? 'on' : ''}" onclick="pickMode(false)">橡皮</button>
        ${colorBtns}<span>粗细</span>${sizes}
        <button class="pbtn" onclick="undoStroke()">上一步</button>
        <button class="pbtn" onclick="clearCanvas()">清空</button>
      </div>`;
    }
    function pickColor(i) { penColIdx = i; penMode = true; drawBoxReset(); }
    function pickMode(m) { penMode = m; drawBoxReset(); }
    function pickSize(i) { if (penMode) penSizeIdx = i; else erSizeIdx = i; drawBoxReset(); }
    function undoStroke() { dStrokes.pop(); drawBoxReset(); }
    function clearCanvas() { dStrokes = []; drawBoxReset(); }
    function drawBoxHtml() {
      return `<div class="paint-canvas-box"><canvas class="paint-canvas" id="drawCanvas" width="900" height="540"></canvas></div>${toolsHtml()}`;
    }
    function initDrawCanvas() {
      const c = document.getElementById('drawCanvas');
      if (!c) return;
      drawReplay(c, dStrokes);
      let cur = null;
      c.onpointerdown = (e) => { e.preventDefault(); c.setPointerCapture(e.pointerId); cur = { t: penMode ? 'p' : 'e', c: PALETTE[penColIdx], w: penMode ? PW[penSizeIdx] : EW[erSizeIdx], p: [dPos(e, c)] }; dStrokes.push(cur); drawReplay(c, dStrokes); };
      c.onpointermove = (e) => { if (cur) cur.p.push(dPos(e, c)); drawReplay(c, dStrokes); };
      const end = () => { cur = null; };
      c.onpointerup = end; c.onpointercancel = end;
    }
    function drawBoxReset() {
      const box = document.getElementById('drawBox');
      if (!box) return;
      box.innerHTML = drawBoxHtml();
      initDrawCanvas();
    }

    // ===== 画猜接龙 v2 前端（四链并行/判定/投票）=====
    let dV = null;
    let dLastStage = null;
    function dDash(n) {
      const c = Math.max(1, Number(n) || 0);
      return `<span style="letter-spacing:5px;font-weight:800;">${'＿'.repeat(c)}</span> <span style="color:#9aa5b1;font-size:.78rem;">${c} 个字</span>`;
    }
    function dSend(type, value) {
      socket.emit('dg_act', { type, value }, (res) => {
        if (res && res.msg && !res.success) dToast(res.msg);
      });
    }
    function dToast(t) {
      const el = document.createElement('div');
      el.className = 'msg-line';
      el.textContent = t;
      document.getElementById('wrap').appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }
    function dProgHtml(v) {
      const chips = (v.order || []).map((n, i) => {
        const done = !!(v.done || [])[i];
        const on = (v.online && v.online[n]) !== false;
        const me = n === v.you;
        const label = done ? '已提交' : (on ? '未提交' : '离线');
        if (done) {
          return `<span class="chip done">${esc(dn(n))}${me ? '（你）' : ''} 已提交</span>`;
        }
        const style = on ? 'color:#6b7a90;background:#e9edf2;' : 'color:#e67e22;background:#fdeede;';
        return `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:11px;${style}">${esc(dn(n))}${me ? '（你）' : ''} ${label}</span>`;
      }).join('');
      return `<div style="margin:2px 0 8px;display:flex;flex-wrap:wrap;gap:6px;">${chips}</div>`;
    }
    function dgChainHtml(v) {
      const c = v.chainData || {};
      const r = v.chainRoles || {};
      return `<div class="rv-step"><div class="rv-label">第 1 棒（${esc(dn(r.writer))}）写的词</div><b>${esc(c.word || '')}</b></div>
        <div class="rv-step"><div class="rv-label">第 1 棒（${esc(dn(r.writer))}）画的画</div><canvas class="mini-canvas" id="dR1" width="900" height="540"></canvas></div>
        <div class="rv-step"><div class="rv-label">第 2 棒（${esc(dn(r.guessA))}）猜的词</div>${esc(c.guessA || '')}</div>
        <div class="rv-step"><div class="rv-label">第 3 棒（${esc(dn(r.drawer))}）画的画</div><canvas class="mini-canvas" id="dR2" width="900" height="540"></canvas></div>
        <div class="rv-step"><div class="rv-label">第 4 棒（${esc(dn(r.guessB))}）最终猜的词</div><b>${esc(c.guessF || '')}</b></div>`;
    }
    function dgChainReplay() {
      const v = dV;
      if (!v) return;
      const c = (v && v.chainData) || {};
      drawReplay(document.getElementById('dR1'), c.picW || []);
      drawReplay(document.getElementById('dR2'), c.picG || []);
    }
    function dgRender() {
      if (!dV) return;
      const v = dV;
      const w = document.getElementById('wrap');
      const drawGuess = ['writeDraw', 'guessA', 'picG', 'guessF'].includes(v.stage);
      const scoreLine = drawGuess ? '' : `<div class="score-line">积分：${(v.order || []).map(n => `${esc(dn(n))} ${v.points[n] || 0}`).join('　')}</div>`;
      const head = `<div class="stage-line">第 ${v.round} 轮 · ${esc(v.stageText)}</div>${dProgHtml(v)}${scoreLine}`;
      const topHtml = `<div class="dyn-top">${head}</div>`;
      // 仍在同一行动阶段且自己还没提交时，别人提交导致的刷新只更新顶部进度，不清空画布/输入
      if (v.stage === dLastStage && !v.youReady) {
        const hasActive = document.querySelector('#drawCanvas') || document.querySelector('#dGuess') || document.querySelector('#dWord');
        if (hasActive && document.querySelector('.dyn-top')) {
          document.querySelector('.dyn-top').innerHTML = head;
          return;
        }
      }
      dLastStage = v.stage;
      if (v.stage === 'writeDraw') {
        if (v.youReady) { w.innerHTML = topHtml + '<div class="empty">已提交 ✓，等待其他人完成…</div>'; return; }
        w.innerHTML = topHtml + `<div class="role-hint">第 1 棒：填一个词（1~12 字），把它画出来，一次性提交</div>
          <input class="line-input" id="dWord" maxlength="12" placeholder="写一个 1~12 字的词（只有你能看到）" autocomplete="off" style="margin-bottom:8px;">
          <div id="drawBox">${drawBoxHtml()}</div>
          <button class="btn-ok" onclick="dBothGo()">写词并画好，提交</button>`;
        dStrokes = [];
        initDrawCanvas();
        return;
      }
      if (v.stage === 'guessA' || v.stage === 'guessF') {
        const kind = v.stage === 'guessA' ? '猜他写的词' : '做最后猜词';
        w.innerHTML = topHtml + `<div class="role-hint">看这张画，${kind}：${dDash(v.hintLen)}</div>
          <canvas class="mini-canvas" id="dGCanvas" width="900" height="540"></canvas>
          ${v.youReady ? '<div class="who">已提交 ✓，等待其他人完成…</div>' : `<div class="guess-box"><input id="dGuess" maxlength="12" placeholder="输入你的答案" autocomplete="off" onkeydown="if(event.key==='Enter')dGuessGo()"><button onclick="dGuessGo()">猜</button></div>`}`;
        drawReplay(document.getElementById('dGCanvas'), v.myPic || []);
        return;
      }
      if (v.stage === 'picG') {
        if (v.youReady) { w.innerHTML = topHtml + '<div class="empty">已提交 ✓，等待其他人完成…</div>'; return; }
        w.innerHTML = topHtml + `<div class="role-hint">画出第 2 棒猜到的词：${esc(v.myGuessText || '')}</div>
          <div id="drawBox">${drawBoxHtml()}</div>
          <button class="btn-ok" onclick="dPicGo()">画好了，提交</button>`;
        dStrokes = [];
        initDrawCanvas();
        return;
      }
      if (v.stage === 'judge') {
        const c = v.chainData || {};
        w.innerHTML = topHtml + `<div class="role-hint">第 ${(v.chainIndex || 0) + 1} 条链判定</div>${dgChainHtml(v)}
          <div class="rv-step" style="background:#fff8f0;"><div class="rv-label">判定：原词 vs 最终猜词</div>
            <b>${esc(c.word || '')}</b>　＝？＝　<b>${esc(c.guessF || '')}</b></div>
          ${v.youReady ? '<div class="who">已投票 ✓，等待其他人…</div>' : `
          <div style="margin-top:8px;">
            <button class="vbtn ok" onclick="dSend('match',true)">匹配</button>
            <button class="vbtn no" onclick="dSend('match',false)">不匹配</button>
          </div>`}`;
        dgChainReplay();
        return;
      }
      if (v.stage === 'reward') {
        const ok = v.matched === true;
        const label = ok ? '这条链匹配成功：投一名 MVP（该玩家 +1）' : '这条链未匹配：投一名罪魁祸首（该玩家 -1）';
        const btns = (v.others || []).map(n => `<button class="vbtn pick" onclick="dSend('pick','${n}')">${esc(dn(n))}</button>`).join('');
        w.innerHTML = topHtml + `<div class="role-hint">第 ${(v.chainIndex || 0) + 1} 条链 ${ok ? '匹配成功' : '未匹配'}</div>${dgChainHtml(v)}
          <div class="role-hint" style="margin-top:8px;">${label}</div>
          <div class="who">${v.youReady ? '已投票 ✓，等待其他人…' : '投给除自己以外的一位玩家：'}</div>
          ${v.youReady ? '' : `<div>${btns}</div>`}`;
        dgChainReplay();
        return;
      }
      if (v.stage === 'result') {
        const list = (v.finalOrder || []).map((n, i) => `<div class="rv-step"><b>第 ${i + 1} 名</b>　${esc(dn(n))}　<span style="color:#4a90d9;">${v.points[n] || 0} 分</span></div>`).join('');
        const chainRes = (v.chainVotes || []).map((cv, i) => `<span style="margin-right:12px;">链${i + 1}：${cv && cv.match ? '匹配✓' : '未匹配'}</span>`).join('');
        w.innerHTML = topHtml + `<div class="role-hint">本轮结算</div>${list}
          <div class="who">${chainRes}</div>
          <div style="margin-top:10px;"><span class="go" onclick="backRoom()">返回房间</span></div>`;
        return;
      }
      w.innerHTML = topHtml + '<div class="empty">等待服务器…</div>';
    }
    function dBothGo() {
      const inp = document.getElementById('dWord');
      const val = (inp && inp.value) ? inp.value.trim() : '';
      if (!val || [...val].length > 12) { dToast('词需为 1~12 字'); return; }
      if (!dStrokes.length) { dToast('画一点内容再提交'); return; }
      socket.emit('dg_act', { type: 'both', value: { word: val, pic: dStrokes.slice() } }, (res) => {
        if (res && res.success) dToast('已提交 ✓');
        else if (res && res.msg) dToast(res.msg);
      });
    }
    function dPicGo() {
      if (!dStrokes.length) { dToast('先画点内容再提交'); return; }
      socket.emit('dg_act', { type: 'pic', value: dStrokes.slice() }, (res) => {
        if (res && res.success) dToast('已提交 ✓');
        else if (res && res.msg) dToast(res.msg);
      });
    }
    function dGuessGo() {
      const inp = document.getElementById('dGuess');
      const val = (inp && inp.value) ? inp.value.trim() : '';
      if (!val || [...val].length > 12) { dToast('请输入 1~12 字的词'); return; }
      socket.emit('dg_act', { type: 'guess', value: val }, (res) => {
        if (res && res.success) dToast('已提交 ✓');
        else if (res && res.msg) dToast(res.msg);
      });
    }
    function dRestart() {
      socket.emit('dg_restart', () => {});
    }
    // 返回房间：先通知服务器清理本局（避免回到房间仍显示“对局进行中”）
    function backRoom() {
      socket.emit('return_room', () => {
        window.location.href = '/room.html?game=drawing';
      });
    }
    // —— 取消本局（磨砂半透明弹窗，全员在线同意后终止）——
    function openCancel() { document.getElementById('cancelMask').style.display = 'flex'; refreshCancel(); }
    function closeCancel() { document.getElementById('cancelMask').style.display = 'none'; }
    function refreshCancel() {
      if (!dV) return;
      const votes = dV.cancelVotes || [];
      const total = dV.cancelOnline || (dV.order || []).length;
      const voted = votes.includes(dV.you);
      const agreeNames = (votes || []).map(n => esc(dn(n))).join('、') || '暂无';
      const stat = `<div style="color:#6b7a90;font-size:.88rem;margin-bottom:8px;">已同意 ${votes.length}/${total}：${agreeNames}</div>`;
      const box = document.getElementById('cancelBox');
      if (!box) return;
      box.innerHTML = `<div style="font-weight:700;margin-bottom:6px;">${voted ? '取消投票中' : '确定取消本局吗？'}</div>`
        + `<div style="color:#6b7a90;font-size:.85rem;margin-bottom:10px;line-height:1.5;">全员（在线玩家）同意后本局终止并返回房间，不计战绩。<br>离线玩家不计入票数。</div>`
        + stat
        + (voted
            ? `<button class="vbtn ok" style="margin-top:4px;" onclick="closeCancel()">知道了</button>`
            : `<button class="vbtn ok" style="margin-top:4px;" onclick="dgCancelGo()">同意取消</button>
               <button class="vbtn no" style="margin-top:4px;" onclick="closeCancel()">暂不取消</button>`);
    }
    function dgCancelGo() {
      socket.emit('dg_cancel_vote', () => {});
    }
    socket.on('dg_state', (v) => {
      dV = v;
      dgRender();
      const cl = document.getElementById('dgCancelLink');
      if (cl) cl.style.display = (v && v.stage && v.stage !== 'result') ? 'inline' : 'none';
      if (document.getElementById('cancelMask').style.display === 'flex') refreshCancel();
    });
    socket.on('dg_cancel', () => { window.location.href = '/room.html?game=drawing'; });
    // ===== 状态渲染 =====
    let V = null;
    function roleHead() {
      if (!V) return '';
      const actorDisp = V.actor ? dn(V.actor) : '';
      return `<div class="stage-line">第 ${V.round} 轮 · ${esc(V.stageText)}</div>
        ${V.isActor ? '' : `<div class="who">等待 ${actorDisp || '对方'} 完成…</div>`}`;
    }
    function render() {
      if (!V) return;
      const w = document.getElementById('wrap');
      const head = roleHead();
      if (V.stage === 'reveal') {
        const rv = V.reveal || {};
        const r = rv.roles || {};
        const ok = !!rv.success;
        w.innerHTML = topHtml + `
          <div class="rv-step"><div class="rv-label">第 1 棒 ${esc(dn(r.writer))} 写的词</div><b>${esc(rv.word || '')}</b></div>
          <div class="rv-step"><div class="rv-label">第 1 棒画的画</div><canvas class="mini-canvas" id="revPic1" width="900" height="540"></canvas></div>
          <div class="rv-step"><div class="rv-label">第 2 棒 ${esc(dn(r.guessA))} 猜的词</div>${rv.firstLink ? '<span class="ok-text">和第 1 棒一致✓</span>' : ''} <b>${esc(rv.guessA || '')}</b></div>
          <div class="rv-step"><div class="rv-label">第 3 棒 ${esc(dn(r.drawer))} 画的画（画上面猜到的词）</div><canvas class="mini-canvas" id="revPic2" width="900" height="540"></canvas></div>
          <div class="rv-step"><div class="rv-label">第 4 棒 ${esc(dn(r.guessB))} 最终猜的词</div><b>${esc(rv.guessB || '')}</b></div>
          <div class="rv-step"><div class="rv-label">接龙结果</div>${ok ? '<span class="ok-text">接通成功，首尾一致！</span>' : '<span class="no-text">接龙歪了，没接通</span>'}</div>
          ${V.isHost ? '<button class="btn-ok" onclick="nextRound()">开始下一轮</button>' : ''}`;
        drawReplay(document.getElementById('revPic1'), rv.pic1 || []);
        drawReplay(document.getElementById('revPic2'), rv.pic2 || []);
        return;
      }
      if (V.isActor && V.stage === 'word') {
        w.innerHTML = topHtml + `<div class="role-hint">你是第 1 棒：写一个词（1~12 字）</div>
          <input class="line-input" id="wd" maxlength="12" placeholder="只有你能看到" autocomplete="off">
          <button class="btn-ok" onclick="submitWord()">写好了，来画它</button>`;
        return;
      }
      if (V.isActor && V.stage === 'draw1') {
        w.innerHTML = topHtml + `<div class="role-hint">你是第 1 棒：画出这个词 →「${esc(V.myWord || '')}」</div>
          <div id="drawBox">${drawBoxHtml()}</div>
          <button class="btn-ok" onclick="submitPic()">画好了，传给第 2 棒</button>`;
        initDrawCanvas();
        return;
      }
      if (V.isActor && V.stage === 'guessA') {
        w.innerHTML = topHtml + `<div class="role-hint">你是第 2 棒：看第 1 棒的画，猜他写的词</div>
          <canvas class="mini-canvas" id="guessCanvas" width="900" height="540"></canvas>
          <div class="guess-box"><input id="gd" maxlength="12" placeholder="猜一个词" autocomplete="off" onkeydown="if(event.key==='Enter')submitGuess()"><button onclick="submitGuess()">猜</button></div>`;
        drawReplay(document.getElementById('guessCanvas'), V.pic1 || []);
        return;
      }
      if (V.isActor && V.stage === 'draw2') {
        w.innerHTML = topHtml + `<div class="role-hint">你是第 3 棒：把第 2 棒猜到的词画出来 →「${esc(V.guessA || '')}」</div>
          <div id="drawBox">${drawBoxHtml()}</div>
          <button class="btn-ok" onclick="submitPic()">画好了，传给第 4 棒</button>`;
        initDrawCanvas();
        return;
      }
      if (V.isActor && V.stage === 'guessB') {
        w.innerHTML = topHtml + `<div class="role-hint">你是第 4 棒：看第 3 棒的画，猜它是什么</div>
          <canvas class="mini-canvas" id="guessCanvas" width="900" height="540"></canvas>
          <div class="guess-box"><input id="gd" maxlength="12" placeholder="最后猜一次" autocomplete="off" onkeydown="if(event.key==='Enter')submitGuess()"><button onclick="submitGuess()">猜</button></div>`;
        drawReplay(document.getElementById('guessCanvas'), V.pic2 || []);
        return;
      }
      w.innerHTML = topHtml + '<div class="empty">轮到你的环节时会自动出现</div>';
    }
    function submitWord() {
      const inp = document.getElementById('wd');
      const v = (inp && inp.value) ? inp.value.trim() : '';
      if (!v || [...v].length > 12) { toast('词需为 1~12 字'); return; }
      socket.emit('drawing_word', { room: 'drawing', word: v }, (res) => { if (res && res.msg && !res.success) toast(res.msg); });
    }
    function submitPic() {
      if (!dStrokes.length) { toast('先画一点内容再提交'); return; }
      socket.emit('drawing_pic', { room: 'drawing', strokes: dStrokes }, (res) => { if (res && res.msg && !res.success) toast(res.msg); });
    }
    function submitGuess() {
      const inp = document.getElementById('gd');
      const v = (inp && inp.value) ? inp.value.trim() : '';
      if (!v || [...v].length > 12) { toast('请输入 1~12 字的词'); return; }
      socket.emit('drawing_guess', { room: 'drawing', word: v }, (res) => { if (res && res.msg && !res.success) toast(res.msg); });
    }
    function nextRound() {
      socket.emit('drawing_next', { room: 'drawing' }, (res) => { if (res && res.msg && !res.success) toast(res.msg); });
    }
    function toast(t) {
      const el = document.createElement('div');
      el.className = 'msg-line';
      el.textContent = t;
      document.getElementById('wrap').appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    socket.on('drawing_update', (v) => { V = v; render(); });
    socket.on('connect', () => {
      socket.emit('get_display_names', (r) => { if (r && r.success) _dm = r.map; });
      socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', true);
      setTimeout(() => socket.emit('drawing_pull', (res) => {
        if (res && !res.success) { document.getElementById('wrap').innerHTML = '<div class="err">未在对局中，请返回房间</div>'; }
      }), 400);
    });
  </script>
</body>
</html>
