<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炸飞机</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; color:#2c3e50; font-family:'Segoe UI','PingFang SC',sans-serif; padding:12px; }
  .head { max-width:820px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
  .wrap { max-width:820px; margin:0 auto; padding-top:10px; }
  .stage { text-align:center; color:#6b7a90; font-size:.9rem; margin:4px 0 10px; }
  .gridwrap { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .panel { text-align:center; }
  .ptitle { font-size:.82rem; color:#9aa5b1; margin-bottom:6px; }
  table.g { border-collapse:collapse; margin:0 auto; }
  table.g td { width:20px; height:20px; border:1px solid #dfe4ea; font-size:9px; text-align:center; background:#fff; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; }
  table.g td.clickable { cursor:pointer; }
  table.g td.mine { background:#cfe9d8; }
  table.g td.mine.head { background:#ffb3b3; }
  table.g td.pv { background:rgba(74,144,217,.3); border-color:rgba(74,144,217,.8); }
  table.g td.pvbad { background:rgba(240,147,43,.72); border-color:#e67e22; box-shadow:inset 0 0 0 2px rgba(230,126,34,.9); }
  table.g td.hit { background:#ff6b6b; color:#fff; }
  table.g td.miss { background:#eceff3; }
  table.g td.wound { background:#cfe9d8; }
  table.g td.ownhit { position:relative; }
  table.g td.ownhit::after { content:'✕'; position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px; color:#2a3644; text-shadow:0 0 3px #fff,0 0 3px #fff; }
  .barrage { position:fixed; left:50%; bottom:56px; transform:translateX(-50%); z-index:98; font-size:.9rem; color:#c62828; background:rgba(255,255,255,.9); border:1px solid rgba(198,40,40,.5); padding:7px 18px; border-radius:12px; pointer-events:none; opacity:0; transition:opacity .2s; font-weight:600; }
  .bar { text-align:center; margin:12px 0; }
  .go { color:#4a90d9; cursor:pointer; font-weight:600; }
  .tip { font-size:.8rem; color:#6b7a90; min-height:18px; }
  .cfgline { font-size:.82rem; color:#9aa5b1; margin-top:6px; }
  button { border-radius:8px; border:1px solid #dfe4ea; background:#fff; padding:6px 14px; cursor:pointer; }
  .pile { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:8px 0; }
  .pl { border:2px solid #dfe4ea; padding:4px 8px; border-radius:8px; font-size:.8rem; cursor:pointer; background:#fff; }
  .pl.sel { border-color:#4a90d9; font-weight:700; }
  .legend { font-size:.76rem; color:#9aa5b1; margin-top:4px; line-height:1.7; }
  .pill { display:inline-block; padding:2px 10px; border-radius:12px; font-size:.76rem; margin:0 4px 2px 0; }
  .pill.ready { color:#fff; background:#6f9e63; }
  .pill.wait { color:#2f6fb2; background:rgba(74,144,217,.15); }
  .pill.off { color:#e67e22; background:#fdeede; }
  .barrage { color:#2f6fb2; background:rgba(255,255,255,.62); border-color:rgba(74,144,217,.5); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); font-weight:600; }
  body.dyn-pink .barrage { color:#c73e79; background:rgba(255,255,255,.6); border-color:rgba(240,98,146,.55); }
  body.dyn-green .barrage { color:#4f8a45; background:rgba(255,255,255,.6); border-color:rgba(111,158,99,.55); }
  body.dyn-gold .barrage { color:#a8791b; background:rgba(255,255,255,.6); border-color:rgba(214,168,67,.55); }
  body.dyn-red .barrage { color:#8c332d; background:rgba(255,255,255,.6); border-color:rgba(166,64,58,.55); }
  table.g td.miss:hover, table.g td.hit:hover, table.g td.wound:hover, table.g td.ownhit:hover { background: inherit; }
  body.dyn-pink table.g td.ownhit::after { color:#e0507f; }
  body.dyn-green table.g td.ownhit::after { color:#4f8a45; }
  body.dyn-gold table.g td.ownhit::after { color:#a8791b; }
  body.dyn-red table.g td.ownhit::after { color:#8c332d; }
  .overcard { max-width:560px; margin:6px auto; background:rgba(255,255,255,.62); border:1px solid rgba(74,144,217,.35); border-radius:18px; padding:18px 14px 14px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 8px 26px rgba(31,45,61,.1); }
  .overcard .wline { text-align:center; font-size:1.05rem; font-weight:800; margin-bottom:12px; }
  .ovrow { display:flex; flex-direction:column; gap:6px; }
  .ovplayer { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:12px; background:rgba(255,255,255,.55); border:1px solid rgba(74,144,217,.18); }
  .ovplayer.win { border-color:rgba(207,120,50,.5); background:rgba(255,245,230,.65); box-shadow:0 0 0 1px rgba(230,126,34,.25) inset; }
  body.dyn-pink .ovplayer.win { border-color:rgba(240,98,146,.5); background:rgba(255,239,245,.65); }
  body.dyn-green .ovplayer.win { border-color:rgba(111,158,99,.55); background:rgba(237,246,233,.65); }
  body.dyn-gold .ovplayer.win { border-color:rgba(214,168,67,.55); background:rgba(253,246,222,.7); }
  body.dyn-red .ovplayer.win { border-color:rgba(166,64,58,.55); background:rgba(250,234,233,.7); }
  .ovrank { width:30px; text-align:center; font-size:1.15rem; flex:none; }
  .ovname { min-width:70px; font-weight:700; flex:none; }
  .ovstat { display:flex; flex-wrap:wrap; gap:2px 14px; margin-left:auto; color:#7f8fa6; font-size:.78rem; text-align:right; }
  body.dyn-pink .overcard { border-color:rgba(240,98,146,.4); }
  body.dyn-green .overcard { border-color:rgba(111,158,99,.42); }
  body.dyn-gold .overcard { border-color:rgba(214,168,67,.42); }
  body.dyn-red .overcard { border-color:rgba(166,64,58,.42); }
  .ach-pop { position:fixed; left:50%; top:22%; transform:translate(-50%,0); z-index:6000; background:rgba(255,255,255,.8); border:1px solid rgba(74,144,217,.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:16px; padding:12px 22px; text-align:center; font-weight:700; font-size:.95rem; color:#2c3e50; box-shadow:0 10px 30px rgba(31,45,61,.2); pointer-events:none; opacity:0; transition:opacity .25s; }
  .ach-pop small { display:block; color:#9aa5b1; font-weight:400; font-size:.75rem; margin-top:3px; }
  .ovach { margin-top:12px; border-top:1px dashed rgba(74,144,217,.35); padding-top:8px; font-size:.8rem; }
  .ovach .ach-row2 { display:flex; justify-content:space-between; align-items:center; padding:3px 2px; color:#6b7a90; }
  body.dyn-pink .ach-pop { border-color: rgba(240,98,146,.6); background: rgba(255,242,247,.8); }
  body.dyn-green .ach-pop { border-color: rgba(111,158,99,.6); background: rgba(241,248,238,.8); }
  body.dyn-gold .ach-pop { border-color: rgba(214,168,67,.6); background: rgba(255,250,238,.82); }
  body.dyn-red .ach-pop { border-color: rgba(166,64,58,.6); background: rgba(253,243,241,.82); }
  table.g td.armed { background:rgba(240,147,43,.55); box-shadow:inset 0 0 0 2px rgba(230,126,34,.95); }
  * { -webkit-tap-highlight-color: transparent !important; outline: none !important; }
  .planebar { max-width:820px; margin:4px auto 2px; text-align:center; font-size:.8rem; }
  .guide-box { max-width:820px; margin:0 auto 8px; padding:8px 10px; background:rgba(255,255,255,.6); border:1px solid rgba(74,144,217,.3); border-radius:12px; display:flex; gap:16px; flex-wrap:wrap; justify-content:center; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .guide-type { text-align:center; font-size:.72rem; color:#6b7a90; }
  table.pmini { border-collapse:collapse; margin:4px auto 2px; }
  table.pmini td { width:12px; height:12px; border:1px solid #e6eaef; }
  table.pmini td.b { background:#cfe9d8; }
  table.pmini td.h { background:#ff9c9c; }
  .tt-pop { background:rgba(255,255,255,.72); border:1px solid rgba(74,144,217,.5); color:#2c3e50; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  body.dyn-pink .tt-pop { background:rgba(255,244,248,.78); border-color:rgba(240,98,146,.55); }
  body.dyn-green .tt-pop { background:rgba(241,248,238,.8); border-color:rgba(111,158,99,.55); }
  body.dyn-gold .tt-pop { background:rgba(255,250,238,.82); border-color:rgba(214,168,67,.55); }
  body.dyn-red .tt-pop { background:rgba(253,243,241,.82); border-color:rgba(166,64,58,.55); }
  body.dyn-pink .guide-box { border-color:rgba(240,98,146,.5); background:rgba(255,244,248,.66); }
  body.dyn-green .guide-box { border-color:rgba(111,158,99,.52); background:rgba(241,248,238,.68); }
  body.dyn-gold .guide-box { border-color:rgba(214,168,67,.52); background:rgba(255,250,238,.7); }
  body.dyn-red .guide-box { border-color:rgba(166,64,58,.52); background:rgba(253,243,241,.7); }
  table.g td:active, table.g td:focus { background: inherit !important; outline:none; }
  table.g td.pending { background: rgba(74,144,217,.45); animation: bmbpending 1s ease infinite; }
  body.dyn-pink table.g td.pending { background: rgba(240,98,146,.5); }
  body.dyn-green table.g td.pending { background: rgba(111,158,99,.55); }
  body.dyn-gold table.g td.pending { background: rgba(214,168,67,.55); }
  body.dyn-red table.g td.pending { background: rgba(166,64,58,.5); }
  @keyframes bmbpending { 0%,100%{opacity:.9} 50%{opacity:.45} }
  table.g td.armed { background: rgba(74,144,217,.45); box-shadow: inset 0 0 0 2px rgba(74,144,217,.9); }
  body.dyn-pink table.g td.armed { background: rgba(240,98,146,.5); box-shadow: inset 0 0 0 2px rgba(240,98,146,.9); }
  body.dyn-green table.g td.armed { background: rgba(111,158,99,.55); box-shadow: inset 0 0 0 2px rgba(111,158,99,.9); }
  body.dyn-gold table.g td.armed { background: rgba(214,168,67,.55); box-shadow: inset 0 0 0 2px rgba(214,168,67,.9); }
  body.dyn-red table.g td.armed { background: rgba(166,64,58,.5); box-shadow: inset 0 0 0 2px rgba(166,64,58,.9); }
  .bmb-mode { margin:2px 0 6px; font-size:.76rem; color:#9aa5b1; }
  .bm-opt { cursor:pointer; color:#7f8fa6; text-decoration:none; margin:0 8px; }
  .bm-opt.on { color:#4a90d9; text-decoration:underline; font-weight:700; }
  body.dyn-pink .bm-opt.on { color:#f06292; }
  body.dyn-green .bm-opt.on { color:#6f9e63; }
  body.dyn-gold .bm-opt.on { color:#a8791b; }
  body.dyn-red .bm-opt.on { color:#a6403a; }
  </style>
</head>
<body>
  <div class="head">
    <b>💣 炸飞机</b>
    <a class="go" style="color:#c62828;margin-right:14px;" onclick="bmbCancelVote()" id="cancelLb">取消对局</a>
    <a class="go" href="/lobby.html">返回大厅</a>
  </div>
  <div class="wrap">
    <div class="planebar"><a class="go" onclick="togglePlaneGuide()">✈️ 查看本局飞机机型 <span id="pgTri">▸</span></a></div>
    <div id="planeGuide" style="display:none;"></div>
    <div class="stage" id="stage">连接中…</div>
    <div id="body"></div>
  </div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) location.href = '/index.html';
    const socket = io();
    const IS_T = sessionStorage.getItem('isTest') === 'true';
    socket.on('connect', () => socket.emit('heartbeat', myName, IS_T, true));
    setInterval(() => socket.emit('heartbeat', myName, IS_T, true), 10000);
    const CELLS = { 1: [[0,0],[1,-2],[1,-1],[1,0],[1,1],[1,2],[2,0],[3,-1],[3,0],[3,1]],
      2: [[0,0],[1,0],[2,-2],[2,-1],[2,0],[2,1],[2,2],[3,0],[4,-1],[4,1]],
      3: [[0,0],[1,-1],[1,0],[1,1],[2,-2],[2,0],[2,2],[3,0],[4,-1],[4,0],[4,1]] };
    function rot(type, rot) { return CELLS[type].map(([dr, dc]) => rot===1?[dc,-dr]:rot===2?[-dr,-dc]:rot===3?[-dc,dr]:[dr,dc]); }
    function cellsOf(p) { return rot(p.type, p.rotation||0).map(([dr,dc]) => ({ r: p.headR+dr, c: p.headC+dc, head: dr===0&&dc===0 })); }
    let S=null, placed=[], selType=null, selRot=0, preview=null, target=null, toastEl=null, achSummary={};
    let confirmMode=localStorage.getItem('bmbConfirm')==='1', armed=null;
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function dn(n){ return (S&&S.disp&&S.disp[n])?S.disp[n]:n; }
    function tip(t){ const el=document.getElementById('stage'); if(el) el.textContent=t||''; }
    function toast(m){ if(!toastEl){ toastEl=document.createElement('div'); toastEl.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;padding:8px 18px;border-radius:10px;font-size:.86rem;'; toastEl.className='tt-pop'; document.body.appendChild(toastEl);} toastEl.textContent=m; clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.textContent='';},1800); }
    function gridTable(cells, clickFn, hits, missMap, ownMarks, armedKey) {
      let h='<table class="g">';
      for (let r=1;r<=15;r++){ h+='<tr>'; for(let c=1;c<=15;c++){
        const key=r+','+c;
        const cell=(cells||[]).find(x=>x.r===r&&x.c===c);
        let cls='',txt='',extra='';
        if(cell && cell.pv){
          const bad=cell.pvbad || cell.bad;
          cls=bad?'pvbad':'pv';
          if(bad && cell.under){ // 与已摆飞机重叠：半透明橙盖在机身颜色之上
            const under=cell.under===2?'#ffb3b3':'#cfe9d8';
            extra=' style="background:linear-gradient(rgba(240,147,43,.72),rgba(240,147,43,.72)),'+under+'"';
          }
        } else if(ownMarks && ownMarks[key]) {
          const base=cell?(cell.head?'mine head':'mine'):'';
          cls='ownhit'+(base?' '+base:'');
        } else if(armedKey && armedKey===key) {
          cls='armed';
        } else if(cell){ cls=cell.head?'mine head':'mine'; }
        else if(missMap && missMap[key]) cls='miss';
        else if(hits){ const ht=hits.find(h=>h.y===r&&h.x===c); if(ht){ if(ht.res==='pending'){ cls='pending'; } else { cls = ht.res==='沉'?'hit':(ht.res==='伤'?'wound':'miss'); txt = ht.res==='沉'?'✕':''; } } }
        h+='<td class="'+cls+(clickFn?' clickable':'')+'"'+extra+(clickFn?' onclick="'+clickFn+'('+r+','+c+')"':'')+'>'+txt+'</td>';
      } h+='</tr>'; }
      return h+'</table>';
    }
    function pendingList(){ const need=(S&&S.config?S.config.slice():[]); for(const t of placed.map(p=>p.type)){ const i=need.indexOf(t); if(i>=0) need.splice(i,1);} return need; }
  </script>
<script>

    function remCount(t){ const need=S?S.config.slice():[]; for(const p of placed){ const i=need.indexOf(p.type); if(i>=0) need.splice(i,1);} let c=0; for(const v of need) if(v===t)c++; return c; }
    function occupiedSet(){ const own=new Set(); placed.forEach(p=>p.cells.forEach(x=>own.add(x.r+','+x.c))); return own; }
    function underType(x){ for(const p of placed){ const cc=p.cells.find(z=>z.r===x.r&&z.c===x.c); if(cc) return cc.head?2:1; } return 0; }
    function boardCellClick(r,c){ // 首次点击生成预览，再次点其它格 = 移动预览
      if(!selType) return toast('先选一架待摆飞机');
      const cells=cellsOf({type:selType,rotation:selRot,headR:r,headC:c});
      const out=cells.some(x=>x.r<1||x.r>15||x.c<1||x.c>15);
      const own=occupiedSet();
      const overlap=cells.some(x=>own.has(x.r+','+x.c));
      const bad=!!overlap||out;
      preview={ type:selType, rotation:selRot, headR:r, headC:c, cells:cells.map(x=>({r:x.r,c:x.c,pv:1,bad,under:own.has(x.r+','+x.c)?underType(x):0})), valid:!overlap&&!out };
      render();
    }
    function rotPreview(){ if(!preview) return; selRot=(selRot+1)%4; const cells=cellsOf({type:preview.type,rotation:selRot,headR:preview.headR,headC:preview.headC}); const out=cells.some(x=>x.r<1||x.r>15||x.c<1||x.c>15); const own=occupiedSet(); const overlap=cells.some(x=>own.has(x.r+','+x.c)); const bad=!!overlap||out; preview.rotation=selRot; preview.cells=cells.map(x=>({r:x.r,c:x.c,pv:1,bad,under:own.has(x.r+','+x.c)?underType(x):0})); preview.valid=!overlap&&!out; render(); }
    function confirmPreview(){ if(!preview) return; if(!preview.valid) return toast('重叠或越界，不能确认'); placed.push({type:preview.type,rotation:preview.rotation,headR:preview.headR,headC:preview.headC,cells:preview.cells.map(x=>({r:x.r,c:x.c,head:x.r===preview.headR&&x.c===preview.headC}))}); preview=null; selType=null; render(); }
    function cancelPreview(){ preview=null; render(); }
    function removeAt(r,c){ if(preview) return; const i=placed.findIndex(p=>p.cells.some(x=>x.r===r&&x.c===c)); if(i>=0){ placed.splice(i,1); render(); } }
    function undoLast(){ if(preview) return; if(placed.length){ placed.pop(); selType=null; preview=null; render(); } }
    function rotLabel(){ return ['上','右','下','左'][selRot]||'上'; }
    function submit(){ const payload=placed.map(p=>({type:p.type,rotation:p.rotation||0,headR:p.headR,headC:p.headC})); socket.emit('bomber_place',{planes:payload},(res)=>{ if(res&&!res.success) toast(res.msg||'摆放无效'); }); }
    function targetCellTap(r,c){
      if(!target||target===me()) return;
      if(confirmMode){
        if(armed && armed.target===target && armed.r===r && armed.c===c){ armed=null; doFire(r,c); return; }
        armed={target:target,r:r,c:c}; render(); return;
      }
      doFire(r,c);
    }
    function doFire(r,c){
      const t=target; const x=c,y=r; armed=null;
        if(S){S.shotsByTarget=S.shotsByTarget||{}; const arr=S.shotsByTarget[t]=S.shotsByTarget[t]||[]; if(!arr.some(function(h){return h.x===x&&h.y===y;})){arr.push({x:x,y:y,res:'pending',by:me()}); render();}}
              // 开火后快速拉一次状态：即使广播偶发迟到也能立刻显示命中颜色
        setTimeout(function(){ if(socket.connected) socket.emit('bomber_pull',function(r){ if(r&&r.success){ S=r; render(); } }); }, 450);
        socket.emit('bomber_fire',{target:t,x:c,y:r},function(res){
        if(res&&!res.success){ toast(res.msg||'无法轰炸'); if(S){const arr=(S.shotsByTarget&&S.shotsByTarget[t])||[]; S.shotsByTarget[t]=arr.filter(function(h){return !(h.x===x&&h.y===y&&h.res==='pending');}); render();} return; }
        // 本地立即上色：以服务器返回结果直接画上，不等下一次广播/轮询
        if(res&&res.res&&S){
          const rr=res.res;
          if(rr&&rr.x!=null&&rr.y!=null&&rr.res){
            S.shotsByTarget=S.shotsByTarget||{};
            const arr=S.shotsByTarget[t]=S.shotsByTarget[t]||[];
            var hIdx=arr.findIndex(function(h){return h.x===rr.x&&h.y===rr.y;}); if(hIdx>=0){arr[hIdx]={x:rr.x,y:rr.y,res:rr.res,by:me()};} else {arr.push({x:rr.x,y:rr.y,res:rr.res,by:me()});}
            render();
          }
        }
      });
    }
    function setBombMode(on){
      confirmMode=!!on;
      localStorage.setItem('bmbConfirm', confirmMode?'1':'0');
      armed=null;
      if(S&&S.phase==='battle') render();
      toast(confirmMode?'已开启两步确认：先点一格，再点同一格确认轰炸':'已切换为直接轰炸：点一下就发射');
    }
    function toggleBombMode(){ setBombMode(!confirmMode); }
    function pickTarget(n){ target=n; armed=null; render(); }
    function patternRows(type){
      const pts=rot(type,0); let minR=0,maxR=0,minC=0,maxC=0;
      pts.forEach(function(p){ minR=Math.min(minR,p[0]); maxR=Math.max(maxR,p[0]); minC=Math.min(minC,p[1]); maxC=Math.max(maxC,p[1]); });
      let out=''; for(let rr=minR;rr<=maxR;rr++){ out+='<tr>'; for(let cc=minC;cc<=maxC;cc++){ const hit=pts.find(function(p){return p[0]===rr&&p[1]===cc;}); const hd=hit&&hit[0]===0&&hit[1]===0; out+='<td class="'+(hd?'h':(hit?'b':''))+'"></td>'; } out+='</tr>'; }
      return out;
    }
    function renderPlaneGuide(){
      const g=document.getElementById('planeGuide'); if(!g) return;
      const types=[1,2,3];
      g.innerHTML='<div class="guide-box">'+types.map(function(t){
        const need=(S&&S.config?S.config.filter(function(v){return v===t;}).length:0);
        return '<div class="guide-type">机型'+t+' × '+need+'<table class="pmini">'+patternRows(t)+'</table></div>';
      }).join('')+'</div>';
    }
    function togglePlaneGuide(){
      const g=document.getElementById('planeGuide'); const tri=document.getElementById('pgTri');
      const show=g.style.display!=='none';
      g.style.display=show?'none':'';
      if(tri) tri.textContent=show?'▸':'▾';
      if(!show) renderPlaneGuide();
    }
    function bmbCancelVote(){ if(!S) return; const voted=(S.cancelVotes||[]).includes(S.you); const revoke=!!voted; socket.emit('bomber_cancel_vote', { revoke }, function(res){ if(res&&res.success){ if(res.cancelled) return; const v=(res.votes||[]).length; const total=(S&&S.online?Object.keys(S.online).filter(function(n){return S.online[n];}).length:0); toast(revoke?('已撤回取消票（'+v+'/'+total+'）'):('已投票取消（'+v+'/'+total+'）等待其他在线玩家…')); } }); }
    function bmbReturnLobby(){
      socket.emit('return_room', function(){});
      setTimeout(function(){ location.href='/lobby.html'; }, 200);
    }
    function statusPills(){
      const names=S&&S.order?S.order.slice():[];
      let out=names.map(function(n){
        const on=S.online&&S.online[n];
        let cls='off',lab='离线';
        if(on){ if(S.ready&&S.ready[n]){cls='ready';lab='已就位';} else {cls='wait';lab='等待中';} }
        return '<span class="pill '+cls+'">'+esc(dn(n))+' · '+lab+'</span>';
      }).join('');
      if(S && S.cancelVotes && S.cancelVotes.length){
        const onlineTotal=(S.online?Object.keys(S.online).filter(function(n){return S.online[n];}).length:0);
        out+=' <span class="pill wait">取消投票 '+S.cancelVotes.length+'/'+onlineTotal+'</span>';
      }
      return out;
    }
    function me(){ return S&&S.you; }
    function updateCancel(){ const el=document.getElementById('cancelLb'); if(!el) return; if(!S){ el.textContent='取消对局'; return; } const v=(S.cancelVotes||[]).length; const voted=(S.cancelVotes||[]).includes(S.you); const total=(S.online?Object.keys(S.online).filter(function(n){return S.online[n];}).length:0); el.textContent = v>0 ? ('取消对局（'+v+'/'+total+(voted?'，再点撤回':'')+'）') : '取消对局'; }
    function render(){
      updateCancel();
      const body=document.getElementById('body'); if(!S||!body) return;
      if(S.phase==='deploy'){
        const types=[1,2,3]; const remSum=types.reduce((a,t)=>a+remCount(t),0);
        if((!selType||remCount(selType)<=0)&&remSum>0) selType=types.find(t=>remCount(t)>0);
        const merged=(preview?preview.cells.concat(placed.flatMap(p=>p.cells)):placed.flatMap(p=>p.cells));
        body.innerHTML = '<div class="panel"><div class="ptitle">你的棋盘（选飞机→转方向→点格子预览，可点其它格移动）</div>'+gridTable(merged,'boardCellClick')
          +'<div class="cfgline">本轮构成：机型1 ×'+remCount(1)+'（已放'+placed.filter(p=>p.type===1).length+'）　机型2 ×'+remCount(2)+'（已放'+placed.filter(p=>p.type===2).length+'）　机型3 ×'+remCount(3)+'（已放'+placed.filter(p=>p.type===3).length+'）</div>'
          +'<div class="pile">'+types.map(function(t){ var c=remCount(t); return '<span class="pl '+(selType===t?'sel':'')+'" style="'+(c<=0?'opacity:.35;pointer-events:none;':'')+'" onclick="preview=null;selType='+t+';render()">机型'+t+'（剩'+c+'）</span>'; }).join('')+'</div>'
          +(preview
            ? '<div class="bar"><button onclick="rotPreview()">转向：'+rotLabel()+'</button> <button onclick="confirmPreview()">✓ 确认</button> <button onclick="cancelPreview()">✕ 取消预览</button></div><div class="tip" style="color:'+(preview.valid?'#2f8f46':'#e67e22')+';">'+(preview.valid?'点击其它格子可移动预览':'半透明橙色=重叠或越界，不能确认')+'</div>'
            : '<div class="bar"><button onclick="selRot=(selRot+1)%4;render()">朝向：'+rotLabel()+'（点我旋转）</button> <button onclick="undoLast()">撤销上一架</button> <button onclick="submit()" '+(placed.length===5&&!S.ready[S.you]?'':'disabled')+'>'+(S.ready[S.you]?'已提交，等待其他人…':'确认摆放（'+placed.length+'/5）')+'</button></div>')
          +'<div class="legend">'+placed.length+'/5 已放 · '+remSum+' 待摆</div>'
          +'<div class="tip">'+statusPills()+'</div></div>';
        return;
      }
      if(S.phase==='battle'){
        const yourCells=(S.board||[]).flat();
        const ownMarks={}; (S.meHits||[]).forEach(function(h){ ownMarks[h.y+','+h.x]=1; });
        const aliveOpts=(S.alive||[]).filter(function(n){return n!==me();});
        if(!target||aliveOpts.indexOf(target)<0) target=aliveOpts[0];
        const targetHits=((S.shotsByTarget||{})[target]||[]).slice();
        const missMap={}; targetHits.filter(function(h){return h.res==='空';}).forEach(function(h){missMap[h.y+','+h.x]=1;});
        const myTurn=S.turn===me();
        body.innerHTML = '<div class="gridwrap"><div class="panel"><div class="ptitle">我的布防（✕=被炸过）</div>'+gridTable(yourCells,null,null,null,ownMarks)+'</div>'
          +'<div class="panel"><div class="ptitle">轰炸 '+(target||'')+' 的棋盘'+(myTurn?'（轮到你）':'（等待对方…）')+'</div>'
          +'<div class="bmb-mode">模式：<a class="bm-opt'+(confirmMode?' on':'')+'" onclick="setBombMode(true)">确认</a><a class="bm-opt'+(confirmMode?'':' on')+'" onclick="setBombMode(false)">直接</a></div>'
          +'<div style="margin:4px 0;">目标：'+aliveOpts.map(function(n){return '<span class="go tgt" style="margin:0 6px;'+(n===target?'color:#c62828;':'')+'" data-t="'+n+'">'+esc(dn(n))+'</span>';}).join('')+'</div>'
          +gridTable(null, myTurn?'targetCellTap':null, targetHits, missMap, null, (confirmMode&&armed&&armed.target===target&&myTurn)?(armed.r+','+armed.c):null)
          +'<div class="cfgline">'+targetHits.filter(function(h){return h.res==='沉';}).length+' 沉 / '+targetHits.filter(function(h){return h.res==='伤';}).length+' 伤 / '+targetHits.filter(function(h){return h.res==='空';}).length+' 空</div></div></div>'
          +'<div class="tip" style="text-align:center;">'+statusPills()+'</div>'
          +'<div class="stage" style="margin-top:8px;">存活：'+S.alive.map(function(n){return dn(n);}).join('、')+'　·　当前行动：'+esc(dn(S.turn))+'</div>';
        return;
      }
      if(S.phase==='over'){
        const winName=S.over&&S.over.winner||'';
        const plist=(S.over&&S.over.players||[]).slice().sort(function(a,b){return a.rank-b.rank;});
        const icons=['🥇','🥈','🥉','4','5','6','7','8'];
        const ov=plist.map(function(p){
          const st=p.stats||{};
          const icon=icons[p.rank-1]||p.rank;
          const win=p.name===winName;
          return '<div class="ovplayer'+(win?' win':'')+'">'
            +'<div class="ovrank">'+icon+'</div>'
            +'<div class="ovname">'+esc(dn(p.name))+(win?' <span class="pill ready">胜者</span>':'')+'</div>'
            +'<div class="ovstat"><span>机身 '+ (st.bodyHits||0) +'</span><span>机头 '+(st.shipsDown||0)+'</span><span>首中 '+(st.firstHit||'—')+'</span><span>首沉 '+(st.firstDown||'—')+'</span></div>'
            +'</div>';
        }).join('');
        const qC={common:'#9aa5b1',rare:'#4caf50',epic:'#9c27b0',legend:'#ff9800',hidden:'#d32f2f'};
        const achRows=plist.map(function(p){
          const arr=achSummary[p.name]||[];
          if(!arr.length) return '';
          return '<div class="ach-row2"><span>'+esc(dn(p.name))+'</span><span>'
            +arr.map(function(a){ return '<span style="color:'+(qC[a.quality]||'#2c3e50')+';font-weight:600;">🏅 '+esc(a.name)+'</span>'; }).join('　')
            +'</span></div>';
        }).filter(Boolean).join('');
        const achHtml=achRows?'<div class="ovach"><div style="font-weight:700;color:#2c3e50;margin-bottom:2px;">🎖 本局成就</div>'+achRows+'</div>':'';
        body.innerHTML='<div class="overcard"><div class="wline">🏆 '+esc(dn(winName))+' 获胜！</div>'
          +'<div class="ovrow">'+ov+'</div>'+achHtml+'</div>'
          +'<div class="bar"><a class="go" onclick="bmbReturnLobby()">返回大厅</a></div>';
        return;
      }
    }
    socket.on('bomber_state', function(s){ S=s; if(s.phase==='battle'||s.phase==='over') placed=[]; render(); });
    document.addEventListener('click',function(e){ var el=e.target&&e.target.closest?e.target.closest('.tgt'):null; if(el) pickTarget(el.getAttribute('data-t')); });
    var barEl=document.createElement('div'); barEl.className='barrage'; document.body.appendChild(barEl); var barTimer=null;
    socket.on('bomber_boom', function(d){ if(!d||!d.text) return; barEl.textContent=d.text; barEl.style.opacity='1'; clearTimeout(barTimer); barTimer=setTimeout(function(){ barEl.style.opacity='0'; },2600); });
    var achEl=document.createElement('div'); achEl.className='ach-pop'; document.body.appendChild(achEl); var achTimer=null;
    socket.on('achievement_unlocked', function(d){
      if(!d||!d.name) return;
      const qLab={common:'普通',rare:'稀有',epic:'史诗',legend:'传说',hidden:'隐藏'};
      achEl.innerHTML='🏅 解锁成就「'+esc(d.name)+'」<small>'+((d.quality&&(qLab[d.quality]||d.quality))||'')+(d.playerName?' · '+esc(dn(d.playerName)):'')+'</small>';
      achEl.style.opacity='1'; clearTimeout(achTimer); achTimer=setTimeout(function(){ achEl.style.opacity='0'; },2600);
    });
    socket.on('achievement_summary', function(d){
      if(!d||!d.players) return;
      achSummary=d.players;
      if(S&&S.phase==='over') render();
    });
    socket.on('bomber_cancel', function(){ location.href='/room.html?game=bomber'; });
    socket.on('connect', function(){ setTimeout(function(){ socket.emit('bomber_enter'); socket.emit('bomber_pull',function(res){ if(res&&res.success){ S=res; render(); } }); },400); });
    // 兜底轮询：事件偶发收不到也能同步；对局已结束/被取消时自动回房间
    setInterval(function(){ if(!socket.connected) return; socket.emit('bomber_pull', function(res){ if(res&&!res.success){ location.href='/room.html?game=bomber'; return; } if(res&&res.success){ S=res; render(); } }); }, 2500);
  
</script>
  <script>
const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6, agly: 0.82, lyff: 0.8 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.g-hall,.save,.mini-link,.l-link,.l-link:hover,.gear,.gear:hover,.guest-toggle:hover,.f-link:hover,.theme-opt.active,.p-tri:hover,.player-card.online .status-text';
      const btn = '.controls #btnStart,.btn-roll';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        scoped('body.dyn-pink', '.g-tab.active') + '{color:#f06292!important;border-bottom-color:#ffb3c6!important}' +
        scoped('body.dyn-pink', '.g-tab:hover') + '{color:#f06292!important}' +
        scoped('body.dyn-pink', btn) + '{background:#f06292!important;border-color:#f06292!important}' +
        'body.dyn-pink .controls #btnStart:hover,body.dyn-pink .btn-roll:hover{background:#e0507f!important}' +
        'body.dyn-pink .game-link{border-bottom-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.occupied{border-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.ready{border-color:#f9b7ca!important;background:#fff4f7!important}' +
        'body.dyn-pink .me-tag{background:#ffe3ec!important;color:#e0507f!important}' +
        'body.dyn-pink .toast,body.dyn-pink .home-toast{background:#a0345c!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', '.g-tab.active') + '{color:#6f9e63!important;border-bottom-color:#a9c79e!important}' +
        scoped('body.dyn-green', '.g-tab:hover') + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', btn) + '{background:#6f9e63!important;border-color:#6f9e63!important}' +
        'body.dyn-green .controls #btnStart:hover,body.dyn-green .btn-roll:hover{background:#5b8a50!important}' +
        'body.dyn-green .game-link{border-bottom-color:#a9c79e!important}' +
        'body.dyn-green .seat.occupied{border-color:#a9c79e!important}' +
        'body.dyn-green .seat.ready{border-color:#b9d6af!important;background:#f2f8f0!important}' +
        'body.dyn-green .me-tag{background:#e6f1e2!important;color:#5b8a50!important}' +
        'body.dyn-green .toast,body.dyn-green .home-toast{background:#48673f!important}';
          const gold = pink
      .replace(/dyn-pink/g, 'dyn-gold')
      .replace(/#f06292/g, '#d6a843')
      .replace(/#e0507f/g, '#b98a2e')
      .replace(/#a0345c/g, '#b98a2e')
      .replace(/#c73e79/g, '#a8791b')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(214, 168, 67,')
      .replace(/#ffb3c6/g, '#eeddb3')
      .replace(/#f9b7ca/g, '#f0e3bd')
      .replace(/#fff4f7/g, '#fff8ea')
      .replace(/#ffe3ec/g, '#fdf3dd');
    const red = pink
      .replace(/dyn-pink/g, 'dyn-red')
      .replace(/#f06292/g, '#a6403a')
      .replace(/#e0507f/g, '#8c332d')
      .replace(/#a0345c/g, '#8c332d')
      .replace(/#c73e79/g, '#8c332d')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(166, 64, 58,')
      .replace(/#ffb3c6/g, '#ddb5b2')
      .replace(/#f9b7ca/g, '#ddb5b2')
      .replace(/#fff4f7/g, '#fcf1f0')
      .replace(/#ffe3ec/g, '#faeae8');
    s.textContent = pink + '\n' + green + '\n' + gold + '\n' + red;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green', 'dyn-gold', 'dyn-red');
      if (id && id !== 'initial') {
        b.classList.add((id === 'agly') ? 'dyn-gold' : ((id === 'lyff') ? 'dyn-red' : ((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink')));
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = IS_MOBILE ? 'scroll' : 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function applyTheme() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    socket.on('connect', applyTheme);
    setTimeout(applyTheme, 600);
  </script>
