<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>登录测试3</title>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <h3>登录测试3 - 最简版</h3>
  <input id="keyInput" type="text" placeholder="输入密钥">
  <button id="loginBtn">登录</button>
  <pre id="log" style="background:#111;color:#0f0;padding:10px;min-height:150px;"></pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += msg + '\n'; }

    log('连接中...');
    const socket = io();

    socket.on('connect', () => {
      log('✅ 已连接，ID: ' + socket.id);
    });

    socket.on('connect_error', (err) => {
      log('❌ 连接失败: ' + err.message);
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const key = document.getElementById('keyInput').value.trim().toLowerCase();
      if (!key) { log('密钥为空'); return; }
      log('发送 login: ' + key);
      socket.emit('login', key, (res) => {
        log('收到回复: ' + JSON.stringify(res));
        if (res && res.success) {
          log('✅ 登录成功，角色: ' + res.name);
          sessionStorage.setItem('playerName', res.name);
          log('1秒后跳转大厅...');
          setTimeout(() => { window.location.href = '/lobby.html'; }, 1000);
        } else {
          log('❌ 登录失败: ' + (res ? res.message : '无回复'));
        }
      });
    });
  </script>
</body>
</html>
