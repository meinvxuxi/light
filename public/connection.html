<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>连接测试</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #f0f2f5; }
    .card { background: white; padding: 20px; border-radius: 12px; margin: 10px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    button { padding: 12px 24px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    .online { color: #27ae60; font-weight: bold; }
    .offline { color: #e74c3c; }
  </style>
</head>
<body>
  <h2>🔌 在线状态测试</h2>
  <div class="card">
    <input type="password" id="keyInput" placeholder="输入密钥" maxlength="4">
    <button id="loginBtn">登录</button>
    <button id="guestBtn">游客</button>
    <p>状态：<span id="status">未登录</span></p>
    <p>服务器连接：<span id="connStatus">连接中...</span></p>
  </div>

  <script>
    const socket = io();

    socket.on('connect', () => {
      document.getElementById('connStatus').innerHTML = '<span class="online">✅ 已连接 (ID: ' + socket.id + ')</span>';
    });

    socket.on('disconnect', () => {
      document.getElementById('connStatus').innerHTML = '<span class="offline">❌ 已断开</span>';
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const key = document.getElementById('keyInput').value.trim().toLowerCase();
      if (!key) return;
      socket.emit('login', key, (res) => {
        document.getElementById('status').textContent = res.success 
          ? '✅ ' + res.name + ' 登录成功' 
          : '❌ ' + res.message;
      });
    });

    document.getElementById('guestBtn').addEventListener('click', () => {
      const gkey = prompt('请输入游客口令');
      if (!gkey) return;
      socket.emit('guest_login', '游客' + Math.floor(Math.random() * 1000), gkey, (res) => {
        document.getElementById('status').textContent = res.success 
          ? '✅ ' + res.name + ' 登录成功' 
          : '❌ ' + ((res && res.message) || '登录失败');
      });
    });
  </script>
</body>
</html>
