<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>魔法气泡</title>
<style>
/* 主题色变量：开关 / 按钮 / 选中态跟随个人空间主题 */
:root{--acc:#4a90d9;--accB:rgba(74,144,217,.35);--accBg:rgba(74,144,217,.14);--accTx:#2f6fb2;}
body.dyn-pink{--acc:#f06292;--accB:rgba(240,98,146,.42);--accBg:rgba(240,98,146,.14);--accTx:#c2185b;}
body.dyn-green{--acc:#6f9e63;--accB:rgba(111,158,99,.42);--accBg:rgba(111,158,99,.14);--accTx:#4c7042;}
body.dyn-gold{--acc:#d6a843;--accB:rgba(214,168,67,.46);--accBg:rgba(214,168,67,.15);--accTx:#9a7620;}
body.dyn-red{--acc:#a6403a;--accB:rgba(166,64,58,.42);--accBg:rgba(166,64,58,.14);--accTx:#8c322c;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#f0f2f5;color:#2c3e50;font-family:'Segoe UI','PingFang SC',sans-serif;padding:10px;}
.head{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;}
.head a{color:var(--acc);cursor:pointer;font-weight:600;margin-left:10px;}
.wrap{max-width:720px;margin:0 auto;}
.info{display:flex;justify-content:space-between;gap:8px;margin:8px 0 4px;font-size:.85rem;color:#6b7a90;flex-wrap:wrap;}
.remind{max-width:720px;margin:4px auto;text-align:center;font-size:.8rem;color:var(--accTx);background:var(--accBg);border:1px solid var(--accB);border-radius:10px;padding:5px 10px;height:2.9em;line-height:1.45em;overflow-y:auto;}
.remind.hide{display:none;}
.mainrow{display:flex;justify-content:center;align-items:flex-start;gap:12px;margin:6px 0;flex-wrap:wrap;}
.boardwrap{display:flex;justify-content:center;overflow-x:auto;}
/* 棋盘：技能五子棋同款（米色底 + 细线格） */
.board{display:grid;grid-template-columns:repeat(6,1fr);background:#f6efe2;border:2px solid #b7a184;border-radius:8px;}
.cell{width:min(9.4vw,34px);height:min(9.4vw,34px);min-width:22px;min-height:22px;border:1px solid #e2d7bf;position:relative;background:transparent;}
/* 气泡：半透明填充 + 外面一圈细细的淡色描边（与五子棋棋子同款） */
.cell::after{content:'';position:absolute;inset:8%;border-radius:50%;opacity:0;}
.cell.b1::after{opacity:1;background-color:rgba(206,86,78,.42);border:1px solid rgba(206,86,78,.62);}
.cell.b2::after{opacity:1;background-color:rgba(222,180,62,.45);border:1px solid rgba(222,180,62,.66);}
.cell.b3::after{opacity:1;background-color:rgba(92,166,92,.42);border:1px solid rgba(92,166,92,.62);}
.cell.b4::after{opacity:1;background-color:rgba(84,138,204,.42);border:1px solid rgba(84,138,204,.62);}
.cell.b5::after{opacity:1;background-color:rgba(156,110,204,.42);border:1px solid rgba(156,110,204,.62);}
.cell.b9::after{opacity:1;background-color:rgba(138,148,160,.42);border:1px solid rgba(138,148,160,.62);}
/* 当前掉落中的气泡对：橙色细圈；即将消除：白圈脉冲（让连锁“看得见”） */
.cell.fall::before{content:'';position:absolute;inset:3%;border-radius:50%;box-shadow:0 0 0 2px rgba(230,126,34,.85);}
.cell.clear::before{content:'';position:absolute;inset:2%;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 8px 2px rgba(255,255,255,.85);animation:ppoFlash .24s ease-in-out infinite alternate;}
@keyframes ppoFlash{from{transform:scale(1);opacity:.85;}to{transform:scale(1.12);opacity:1;}}
.side{min-width:120px;display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:#4a5b6d;}
/* 手机端：分数/下一个 等面板挪到页面上方（棋盘占满下方），对手卡片两行两列 */
body.mobile .mainrow{flex-direction:column;align-items:center;gap:6px;}
body.mobile .side{order:-1;width:100%;max-width:420px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:.76rem;}
body.mobile .side .panel{padding:6px 8px;text-align:center;}
body.mobile .opps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start;}
body.mobile .opp .ob .cell{width:100%;height:auto;aspect-ratio:1;}
body.mobile .gcols{max-width:100%;height:auto;}
body.mobile .gcols .gt{position:static;grid-column:1/-1;text-align:center;margin-top:2px;}
.panel{background:rgba(255,255,255,.72);border:1px solid var(--accB);border-radius:12px;padding:8px 10px;}
.panel b{color:var(--accTx);}
.nextgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;justify-content:center;width:68px;margin:4px auto 0;background:#f6efe2;border:1px solid #b7a184;border-radius:6px;padding:2px;}
.nextgrid .cell{width:28px;height:28px;border:none;background:transparent;}
.nextgrid .cell::after{inset:10%;}
/* 控制按钮：五子棋同款主题色小胶囊（桌面用） */
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.mode-opt{padding:6px 12px;border-radius:10px;border:1px solid #dfe3e8;background:#fff;cursor:pointer;font-size:.82rem;user-select:none;text-align:center;}
.mode-opt:active,.mode-opt.on{border-color:var(--acc);background:var(--accBg);color:var(--accTx);font-weight:700;}
/* ===== 手机端专用操作层：左侧（左移/逆时针/加速），右侧（右移/顺时针/落底） ===== */
.pad{display:none;}
body.mobile .pad{display:block;}
.pad-col{position:fixed;top:50%;display:flex;flex-direction:column;gap:10px;z-index:1200;}
.pad-col.left{left:8px;}
.pad-col.right{right:8px;}
.pad-btn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;font-weight:800;line-height:1;color:var(--accTx);background:var(--accBg);border:2px solid var(--accB);
  box-shadow:0 4px 12px rgba(31,45,61,.16);user-select:none;touch-action:none;}
.pad-btn.big{width:70px;height:70px;font-size:1.9rem;}
.pad-btn:active{background:var(--acc);color:#fff;transform:scale(.93);}
body.mobile .wrap{padding:0 84px 12px;}
body.mobile .side .keys{display:none;}
.opps{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0;}
.opp{background:rgba(255,255,255,.7);border:1px solid var(--accB);border-radius:10px;padding:4px 6px;font-size:.7rem;color:#4a5b6d;text-align:center;}
.opp.out{opacity:.5;}
.opp.attack{border-color:rgba(198,78,78,.55);box-shadow:0 0 0 2px rgba(198,78,78,.18);}
.opp .ob{display:grid;grid-template-columns:repeat(6,1fr);background:#f6efe2;border:1px solid #b7a184;border-radius:4px;margin:3px 0;}
.opp .ob .cell{width:min(3vw,11px);height:min(3vw,11px);border:none;}
.opp .ob .cell::after{inset:9%;}
.opp .nm{font-weight:700;}
.opp .tag{display:inline-block;margin-top:2px;padding:1px 6px;border-radius:8px;background:var(--acc);color:#fff;font-size:.66rem;font-weight:700;}
/* 连锁提示条：贴在棋盘上方，不挡棋盘（高度固定，避免文字长短导致棋盘上下浮动） */
.chainbar{text-align:center;height:22px;line-height:22px;overflow:hidden;font-size:.92rem;font-weight:800;color:var(--accTx);opacity:0;transition:opacity .2s;}
.chainbar.show{opacity:1;}
.chainbar.big{font-size:1.18rem;}
/* 干扰落点预告：棋盘正上方按列对齐的 ▼（高度固定） */
.gcols{display:grid;grid-template-columns:repeat(6,1fr);align-items:center;gap:0;height:18px;margin:0 auto;width:max-content;position:relative;}
.gcols .colmark{width:min(9.4vw,34px);min-width:22px;text-align:center;font-size:.62rem;color:#b3bcc7;line-height:18px;}
.gcols .colmark.on{color:#a5443f;font-weight:800;}
.gcols .gt{position:absolute;left:calc(100% + 8px);white-space:nowrap;font-size:.72rem;color:#a5443f;font-weight:700;line-height:18px;}
.msg{text-align:center;font-size:.84rem;color:#6b7a90;margin:6px 0;min-height:20px;}
.res{max-width:480px;margin:8px auto;background:rgba(255,255,255,.86);border:1px solid var(--accB);border-radius:14px;padding:14px;text-align:center;box-shadow:0 6px 18px rgba(31,45,61,.12);}
.res-title{font-size:1.02rem;font-weight:800;margin-bottom:8px;}
.res-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.6);border:1px solid var(--accB);margin-bottom:5px;font-size:.86rem;}
.res-row.me{border-color:rgba(230,126,34,.6);background:rgba(255,247,230,.8);}
.res-ach{margin-top:10px;border-top:1px dashed var(--accB);padding-top:8px;text-align:left;font-size:.8rem;}
.res-ach .ra-title{font-weight:700;color:#2c3e50;margin-bottom:4px;}
.res-ach .ra-row{display:flex;justify-content:space-between;gap:8px;padding:3px 2px;color:#6b7a90;flex-wrap:wrap;}
.res-btns{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.res-btn{display:inline-block;padding:7px 16px;border-radius:10px;background:var(--acc);color:#fff;font-size:.84rem;cursor:pointer;border:none;}
.res-btn.ghost{background:var(--accBg);color:var(--accTx);}
/* 提示不挡视野：顶部细条 + 短时消失 */
.toast{position:fixed;left:50%;top:6px;transform:translate(-50%,-6px);background:rgba(255,255,255,.92);border:1px solid var(--accB);color:#2c3e50;border-radius:10px;padding:5px 12px;font-size:.78rem;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3000;max-width:72vw;text-align:center;}
.ach-pop{position:fixed;left:50%;top:6px;transform:translate(-50%,-6px);z-index:6000;background:rgba(255,255,255,.92);border:1px solid var(--accB);border-radius:10px;padding:5px 14px;text-align:center;font-weight:700;font-size:.8rem;color:#2c3e50;pointer-events:none;opacity:0;transition:opacity .2s;max-width:72vw;}
.ach-pop small{display:none;}
body.dyn-pink .ach-pop{border-color:rgba(240,98,146,.6);background:rgba(255,242,247,.84);}
body.dyn-green .ach-pop{border-color:rgba(111,158,99,.6);background:rgba(241,248,238,.84);}
body.dyn-gold .ach-pop{border-color:rgba(214,168,67,.6);background:rgba(255,250,238,.86);}
body.dyn-red .ach-pop{border-color:rgba(166,64,58,.6);background:rgba(253,243,241,.86);}
</style>
</head>
<body>
  <div class="head"><b>🫧 魔法气泡</b><span><a id="ppoCancelLb" onclick="ppoCancelVote()">取消对局</a><a onclick="ppoExit()">返回房间</a></span></div>
  <div class="wrap">
    <div class="info"><span id="ppoStage">连接中…</span><span id="ppoLevel"></span></div>
    <div class="remind hide" id="ppoNotice"></div>
    <div class="chainbar" id="ppoChain"></div>
    <div class="gcols" id="ppoGcols"></div>
    <div class="mainrow">
      <div class="boardwrap">
        <div class="board" id="ppoBoard"></div>
      </div>
      <div class="side">
        <div class="panel"><b>分数</b> <span id="ppoScore">0</span><br><b>最高连锁</b> <span id="ppoMaxChain">0</span><br><b>待落干扰</b> <span id="ppoPending">0</span></div>
        <div class="panel" style="text-align:center;"><b>下一个</b><div class="nextgrid" id="ppoNext"></div></div>
        <div class="panel"><div class="keys">
          <span class="mode-opt" onclick="ppoKey('left')">←</span>
          <span class="mode-opt" onclick="ppoKey('ccw')">↺</span>
          <span class="mode-opt" ontouchstart="ppoSoft(true)" ontouchend="ppoSoft(false)" onmousedown="ppoSoft(true)" onmouseup="ppoSoft(false)" onmouseleave="ppoSoft(false)">↓</span>
          <span class="mode-opt" onclick="ppoKey('right')">→</span>
          <span class="mode-opt" onclick="ppoKey('cw')">↻</span>
          <span class="mode-opt" onclick="ppoKey('hard')">⤓</span>
        </div></div>
      </div>
    </div>
    <div class="opps" id="ppoOpps"></div>
    <div class="msg" id="ppoMsg"></div>
  </div>
  <!-- 手机端操作层：左侧（左移/逆时针/加速） · 右侧（右移/顺时针/落底），长按连发 -->
  <div class="pad" id="ppoPad">
    <div class="pad-col left">
      <div class="pad-btn big" data-act="left">‹</div>
      <div class="pad-btn" data-act="ccw">↺</div>
      <div class="pad-btn" data-act="soft">↓</div>
    </div>
    <div class="pad-col right">
      <div class="pad-btn big" data-act="right">›</div>
      <div class="pad-btn" data-act="cw">↻</div>
      <div class="pad-btn" data-act="hard">⤓</div>
    </div>
  </div>
  <div class="toast" id="ppoToast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
  const myName = sessionStorage.getItem('playerName');
  if (!myName) location.href = '/index.html';
  // 主题：与其它游戏页同一套身份 → 主题映射
  const P_IMG = { p1:'/assets/avatars/p1/beijing.png.jpg', p2:'/assets/avatars/p2/zuixin2.jpg', p3:'/assets/avatars/p3/zuixin3.jpg', p4:'/assets/avatars/p4/beijing4.jpg', pomelo:'/assets/avatars/p3/nene.jpg', agly:'/assets/avatars/p1/agly/aglybj.jpg', lyff:'/assets/avatars/p4/lyff/lyffbj.jpg' };
  const P_MOB = { p4:'/assets/avatars/p4/zuixin4.jpg', pomelo:'/assets/avatars/p3/nene2.jpg', agly:'/assets/avatars/p1/agly/aglybj.jpg', lyff:'/assets/avatars/p4/lyff/lyffbj.jpg' };
  const P_ALPHA = { p1:.82, p2:.75, p3:.75, p4:.82, pomelo:.6, agly:.82, lyff:.8 };
  function applyPTheme(t){
    const mobile = window.matchMedia('(max-width: 768px)').matches;
    document.body.classList.remove('dyn-pink','dyn-green','dyn-gold','dyn-red');
    if (!t || t === 'initial') { document.body.style.backgroundImage=''; document.body.style.backgroundSize=''; document.body.style.backgroundAttachment=''; document.body.style.backgroundPosition=''; return; }
    const cls = (t==='agly')?'dyn-gold':((t==='lyff')?'dyn-red':((t==='p3'||t==='pomelo')?'dyn-green':'dyn-pink'));
    document.body.classList.add(cls);
    const img = (mobile && P_MOB[t]) ? P_MOB[t] : (P_IMG[t] || '');
    if (img) { const a = P_ALPHA[t] || .82; document.body.style.backgroundImage = "linear-gradient(rgba(255,255,255,"+a+"),rgba(255,255,255,"+a+")),url('"+img+"')"; document.body.style.backgroundSize='cover'; document.body.style.backgroundAttachment = mobile?'scroll':'fixed'; document.body.style.backgroundPosition='center'; }
  }
  applyPTheme(localStorage.getItem('myTheme'));
  const socket = io();
  const IS_T = sessionStorage.getItem('isTest') === 'true';
  let S = null, _dm = {}, piece = null, boardStr = '', nextPair = [0, 0], achSum = {};
  let pieceSeq = -1, lastInputAt = 0, oppBoards = {}, renderQueued = false, lastBoardHtml = '', lastOppHtml = '';
  let lastNoticeSeq = 0, lastChainTs = 0, chainTimer = null, toastTimer = null;
  // 渲染节流：一帧最多画一次（对手棋盘还会做字符串比对，没变就不重建 DOM）
  function scheduleRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
  function dn(n){ return _dm[n] || n; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toast(m){ const e=document.getElementById('ppoToast'); if(!e) return; e.textContent=m; e.style.opacity='1'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{e.style.opacity='0';},1700); }
  socket.on('connect', () => {
    socket.emit('heartbeat', myName, IS_T, true);
    setTimeout(() => { socket.emit('get_profile', r => { if (r && r.success && r.theme) { localStorage.setItem('myTheme', r.theme); applyPTheme(r.theme); } }); }, 200);
    socket.emit('get_display_names', res => { if (res && res.success) { _dm = res.map; render(); } });
    setTimeout(() => {
      socket.emit('puyopuyo_enter');
      socket.emit('puyopuyo_pull', res => { if (res && res.success) adopt(res); });
    }, 400);
  });
  setInterval(() => socket.emit('heartbeat', myName, IS_T, true), 10000);
  socket.on('puyopuyo_state', s => adopt(s));
  socket.on('puyopuyo_cancel', () => { location.href = '/room.html?game=puyopuyo'; });
  socket.on('achievement_summary', d => { if (d && d.players) { achSum = d.players; render(); } });
  setInterval(() => {
    if (!socket.connected) return;
    socket.emit('puyopuyo_pull', res => {
      if (res && res.success) { adopt(res); return; }
      if (!(S && S.over)) location.href = '/room.html?game=puyopuyo';
    });
  }, 2000);
  function adopt(s){
    S = s;
    const prevPiece = piece;
    if (s.me) {
      if (s.me.board) boardStr = s.me.board;
      nextPair = (s.me.next && s.me.next.colors) ? s.me.next.colors.slice() : nextPair;
      const sv = s.me.piece;
      if (!sv) { piece = null; pieceSeq = -1; }
      else if (sv.seq !== pieceSeq) {           // 新的一对：直接用服务端的
        piece = clonePiece(sv); pieceSeq = sv.seq; lastInputAt = 0;
      } else if (!piece) {                      // 本地没有（刚进房）→ 用服务端的
        piece = clonePiece(sv);
      } else {
        // 同一对：以服务端为准，但保留本地刚做过的输入与本地已经下落到的位置（避免“回弹”）
        const fresh = Date.now() - lastInputAt < 420;     // 刚刚本地操作过
        const c = fresh ? piece.c : sv.c;
        const o = fresh ? piece.orient : sv.orient;
        const r = Math.max(sv.r, piece.r);                // 本地预测不会比服务端“更靠上”
        piece = { r: Math.min(11, r), c, orient: o, colors: (sv.colors || piece.colors).slice(), soft: piece.soft };
      }
    }
    if (s.players) s.players.forEach(p => { if (p.board) oppBoards[p.name] = p.board; });
    scheduleRender();
  }
  function clonePiece(p){ return { r: p.r, c: p.c, orient: p.orient, colors: (p.colors || [0,0]).slice(), soft: false, acc: 0 }; }
  // ===== 本地预测：按关卡速度自己往下掉，服务端到了会更正（网络卡顿时也不粘手） =====
  function localFallStep(){
    if (!piece || !S || S.phase !== 'play' || S.over) { return; }
    const fallMs = piece.soft ? 190 : Math.max(140, 820 - ((S.level || 1) - 1) * 70);
    piece.acc = (piece.acc || 0) + 60;
    let moved = false;
    while (piece.acc >= fallMs) {
      piece.acc -= fallMs;
      if (canFallLocal()) { piece.r = Math.min(11, piece.r + 1); moved = true; }
      else break;
    }
    if (moved) scheduleRender();
  }
  function canFallLocal(){
    const b = boardStr || '';
    const at = (r, c) => (r < 0 || r > 11 || c < 0 || c > 5) ? 9 : Number(b[r * 6 + c] || 0);
    const O = [[-1, 0], [0, 1], [1, 0], [0, -1]][piece.orient];
    const r2 = piece.r + 1, c2 = piece.c + O[1], r2b = piece.r + 1 + O[0];
    if (r2 > 11) return false;
    if (at(r2, piece.c) !== 0) return false;
    if (r2b > 11) return false;
    if (c2 < 0 || c2 > 5) return false;
    if (at(r2b, c2) !== 0) return false;
    return true;
  }
  setInterval(localFallStep, 60);
  // ===== 操作 =====
  function ppoKey(a){
    socket.emit('puyopuyo_input', { action: a }, res => { if (res && !res.success && res.msg) toast(res.msg); });
    lastInputAt = Date.now();
    if (!piece) { return; }
    if (a === 'left') piece.c = Math.max(0, piece.c - 1);
    else if (a === 'right') piece.c = Math.min(5, piece.c + 1);
    else if (a === 'cw') piece.orient = (piece.orient + 1) % 4;
    else if (a === 'ccw') piece.orient = (piece.orient + 3) % 4;
    else if (a === 'softStep') { piece.soft = true; if (canFallLocal()) piece.r = Math.min(11, piece.r + 1); }
    else if (a === 'hard') piece = null;
    scheduleRender();
  }
  function ppoSoft(on){ socket.emit('puyopuyo_input', { action: 'soft', on: !!on }); if (piece) piece.soft = !!on; }
  // 手机端识别 + 操作层（长按连发：左右移动 140ms/次、旋转 180ms/次、加速 120ms/格）
  (function bindPad(){
    const isTouch = (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);
    if (isTouch || window.innerWidth < 760) document.body.classList.add('mobile');
    const pad = document.getElementById('ppoPad');
    if (!pad) return;
    let timer = null, act = null;
    const step = a => {
      if (a === 'soft') { socket.emit('puyopuyo_input', { action: 'softStep' }); if (piece) piece.r = Math.min(11, piece.r + 1); render(); return; }
      ppoKey(a);
    };
    const start = a => {
      if (a === 'hard') { ppoKey('hard'); return; }
      stop();
      act = a; step(a);
      const ms = (a === 'soft') ? 120 : (a === 'left' || a === 'right' ? 150 : 190);
      timer = setInterval(() => step(a), ms);
    };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } act = null; };
    pad.querySelectorAll('[data-act]').forEach(el => {
      const a = el.getAttribute('data-act');
      el.addEventListener('touchstart', e => { e.preventDefault(); start(a); }, { passive: false });
      el.addEventListener('touchend', e => { e.preventDefault(); stop(); }, { passive: false });
      el.addEventListener('touchcancel', () => stop());
      el.addEventListener('mousedown', e => { e.preventDefault(); start(a); });
      el.addEventListener('mouseup', () => stop());
      el.addEventListener('mouseleave', () => stop());
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
    window.addEventListener('touchend', () => stop(), { passive: true });
  })();
  function ppoCancelVote(){ socket.emit('puyopuyo_cancel_vote', {}); }
  function ppoExit(){ location.href = '/room.html?game=puyopuyo'; }
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft') { ppoKey('left'); e.preventDefault(); }
    else if (k === 'ArrowRight') { ppoKey('right'); e.preventDefault(); }
    else if (k === 'ArrowUp' || k === 'x' || k === 'X') { ppoKey('cw'); e.preventDefault(); }
    else if (k === 'z' || k === 'Z') { ppoKey('ccw'); e.preventDefault(); }
    else if (k === 'ArrowDown') { if (!e.repeat) ppoSoft(true); e.preventDefault(); }
    else if (k === ' ') { ppoKey('hard'); e.preventDefault(); }
  });
  document.addEventListener('keyup', e => { if (e.key === 'ArrowDown') ppoSoft(false); });
  // ===== 渲染 =====
  const ORI = [[-1, 0], [0, 1], [1, 0], [0, -1]];
  function me(){ return S && S.me ? S.me : null; }
  function render(){
    if (!S) return;
    document.getElementById('ppoStage').textContent = S.over ? '对局结束' : '对局进行中';
    document.getElementById('ppoLevel').textContent = '关卡 ' + (S.level || 1) + '　·　' + (S.colors === 5 ? '5 色' : '4 色') + '　·　干扰发给' + (S.garbageMode === 'random' ? '随机一人' : '所有对手');
    const cl = document.getElementById('ppoCancelLb');
    const total = (S.players || []).length, votes = (S.cancelVotes || []).length;
    if (cl) cl.textContent = '取消对局' + (votes ? ('（' + votes + '/' + total + '）') : '');
    renderNotice(); renderSide(); renderBoard(); renderOpps(); renderChain(); renderGcols(); renderMsg();
  }
  // 连锁进行中的实时提示（动画期间逐步显示 1→2→3 连锁）
  function renderChainLive(){
    const mc = S && S.me && S.me.chain;
    if (!mc || !mc.n) return null;
    return '⚡ ' + mc.n + ' 连锁进行中…';
  }
  function renderNotice(){
    const el = document.getElementById('ppoNotice');
    if (!S || !S.notice) { el.className = 'remind hide'; el.innerHTML = ''; return; }
    if (S.notice.seq !== lastNoticeSeq) { lastNoticeSeq = S.notice.seq; if (S.notice.text) toast(S.notice.text); }
    el.className = 'remind';
    el.style.background = S.notice.kind === 'chain' ? 'rgba(214,168,67,.16)' : '';
    el.style.borderColor = S.notice.kind === 'chain' ? 'rgba(214,168,67,.5)' : '';
    el.innerHTML = '📣 ' + esc(S.notice.text);
  }
  function renderSide(){
    const m = me();
    document.getElementById('ppoScore').textContent = m ? m.score : 0;
    document.getElementById('ppoMaxChain').textContent = m ? m.maxChain : 0;
    document.getElementById('ppoPending').textContent = m ? m.pending : 0;
    document.getElementById('ppoNext').innerHTML = (nextPair || []).map(v => '<div class="cell' + (v ? ' b' + v : '') + '"></div>').join('');
  }
  function renderBoard(){
    const el = document.getElementById('ppoBoard');
    const fallMap = {};
    const clearSet = new Set();
    const mc = S && S.me && S.me.chain;
    if (mc && mc.cells) mc.cells.forEach(i => clearSet.add(i));
    if (piece && S && S.phase === 'play' && !S.over) {
      const [dr, dc] = ORI[piece.orient];
      fallMap[piece.r * 6 + piece.c] = piece.colors[0];
      const cr = piece.r + dr, cc = piece.c + dc;
      if (cr >= 0 && cr < 12 && cc >= 0 && cc < 6) fallMap[cr * 6 + cc] = piece.colors[1];
    }
    let html = '';
    for (let i = 0; i < 72; i++) {
      const v = Number(boardStr[i] || 0);
      const cls = ['cell'];
      if (v) cls.push('b' + v);
      else if (fallMap[i]) cls.push('b' + fallMap[i], 'fall');
      if (clearSet.has(i)) cls.push('clear');       // 即将消除：白圈脉冲，让连锁看得见
      html += '<div class="' + cls.join(' ') + '"></div>';
    }
    if (html !== lastBoardHtml) { el.innerHTML = html; lastBoardHtml = html; }
  }
  // 干扰落点预告：把“即将落下”的干扰按列统计，在棋盘上方对应列标出来
  function renderGcols(){
    const el = document.getElementById('ppoGcols');
    if (!el) return;
    const m = S && S.me;
    const list = (m && m.gcols) ? m.gcols : [];
    const n = m ? (m.pending || 0) : 0;
    if (!n) { if (el.innerHTML !== '') el.innerHTML = ''; return; }
    const per = [0, 0, 0, 0, 0, 0];
    list.forEach(c => { if (c >= 0 && c < 6) per[c]++; });
    let html = '';
    for (let c = 0; c < 6; c++) {
      const k = per[c];
      html += '<span class="colmark' + (k ? ' on' : '') + '">' + (k ? ('▼' + (k > 3 ? k : '')) : '') + '</span>';
    }
    html += '<span class="gt">' + n + ' 颗干扰待落（按列预告，可连锁相杀抵消）</span>';
    if (html !== el.innerHTML) el.innerHTML = html;
  }
  function renderOpps(){
    const el = document.getElementById('ppoOpps');
    if (!S || !S.players) { if (lastOppHtml !== '') { el.innerHTML = ''; lastOppHtml = ''; } return; }
    const lc = S.lastChain;
    const out = S.players.filter(p => p.name !== myName).map(p => {
      const bd = p.board || oppBoards[p.name] || '';
      let html = '';
      for (let i = 0; i < 72; i++) {
        const v = Number(bd[i] || 0);
        html += '<div class="cell' + (v ? ' b' + v : '') + '"></div>';
      }
      const rank = p.rank ? ('第 ' + p.rank + ' 名') : '';
      const chainTag = (lc && lc.name === p.name) ? ('<span class="tag">' + lc.chain + ' 连锁</span>') : '';
      return '<div class="opp' + (p.alive ? '' : ' out') + (p.pending > 0 ? ' attack' : '') + '">'
        + '<span class="nm">' + esc(dn(p.name)) + '</span>' + (p.ai ? '<span style="color:var(--accTx);font-size:.62rem;">（AI）</span>' : (p.offline ? '（离线）' : ''))
        + '<div class="ob">' + html + '</div>'
        + '<span>' + p.score + ' 分' + (p.maxChain > 1 ? (' · 最高 ' + p.maxChain + ' 连锁') : '') + (rank ? (' · ' + rank) : '') + '</span>'
        + (p.pending > 0 ? ('<br><span style="color:#a5443f;">待落干扰 ' + p.pending + '</span>') : '')
        + chainTag
        + '</div>';
    }).join('');
    if (out !== lastOppHtml) { el.innerHTML = out; lastOppHtml = out; }
  }
  function renderChain(){
    const el = document.getElementById('ppoChain');
    // 动画进行中：实时显示“N 连锁进行中”
    const live = renderChainLive();
    if (live) {
      if (el.textContent !== live) el.textContent = live;
      el.classList.add('show', 'big');
      return;
    }
    const lc = S && S.lastChain;
    // 只在自己达成连锁时提示；对手的连锁在对手小棋盘上以小标签显示（仿原版）
    if (lc && lc.name === myName && lc.ts !== lastChainTs) {
      lastChainTs = lc.ts;
      el.textContent = '✨ ' + lc.chain + ' 连锁！';
      el.classList.add('show');
      if (lc.chain >= 4) el.classList.add('big'); else el.classList.remove('big');
      clearTimeout(chainTimer);
      chainTimer = setTimeout(() => el.classList.remove('show'), 1400);
    }
  }
  function renderMsg(){
    const el = document.getElementById('ppoMsg');
    if (!S) { el.innerHTML = ''; return; }
    if (S.over) {
      const qC = { common:'#9aa5b1', rare:'#4caf50', epic:'#9c27b0', legend:'#ff9800', hidden:'#d32f2f' };
      const rows = (S.over.ranking || []).map(r => {
        const mine = r.name === myName;
        return '<div class="res-row' + (mine ? ' me' : '') + '"><span>第 ' + r.rank + ' 名　' + esc(dn(r.name)) + '</span>'
          + '<span style="font-size:.8rem;color:#6b7a90;">' + r.score + ' 分 · 最高 ' + r.maxChain + ' 连锁</span></div>';
      }).join('');
      const achRows = Object.keys(achSum || {}).map(n => {
        const arr = achSum[n] || [];
        if (!arr.length) return '';
        return '<div class="ra-row"><b>' + esc(dn(n)) + '</b><span>'
          + arr.map(a => '<span style="color:' + (qC[a.quality] || '#2c3e50') + ';font-weight:600;">' + esc(a.name) + '</span>').join('　')
          + '</span></div>';
      }).filter(Boolean).join('');
      el.innerHTML = '<div class="res"><div class="res-title">' + (S.over.winner ? (esc(dn(S.over.winner)) + ' 存活到最后 · 获胜') : '对局结束') + '</div>'
        + rows
        + (achRows ? '<div class="res-ach"><div class="ra-title">本局成就</div>' + achRows + '</div>' : '')
        + '<div class="res-btns"><button class="res-btn ghost" onclick="ppoExit()">返回房间</button></div></div>';
      return;
    }
    const m = me();
    if (!m) { el.innerHTML = ''; return; }
    if (!m.alive) { el.innerHTML = '<span>你已被淘汰，本局名次：第 ' + m.rank + ' 名（等待其他玩家结束）</span>'; return; }
    let txt = '键盘：←→ 移动　↑/X 顺时针　Z 逆时针　↓ 加速　空格 落底<br>手机：屏幕两侧大按钮（‹ › 移动，下面 ↺ ↻ 旋转、↓ 加速、⤓ 落底），长按可连发';
    if (m.pending > 0) txt += '<br><span style="color:#a5443f;font-weight:700;">注意：有 ' + m.pending + ' 颗干扰即将落下，达成连锁可相杀抵消！</span>';
    el.innerHTML = '<span>' + txt + '</span>';
  }
  const ppoAchEl = document.createElement('div'); ppoAchEl.className = 'ach-pop'; document.body.appendChild(ppoAchEl); let ppoAchTimer = null;
  socket.on('achievement_unlocked', function(d){
    if (!d || !d.name) return;
    const qLab = { common:'普通', rare:'稀有', epic:'史诗', legend:'传说', hidden:'隐藏' };
    ppoAchEl.innerHTML = '🏅 解锁成就「' + esc(d.name) + '」<small>' + ((d.quality && (qLab[d.quality] || d.quality)) || '') + (d.playerName ? ' · ' + esc(dn(d.playerName)) : '') + '</small>';
    ppoAchEl.style.opacity = '1'; clearTimeout(ppoAchTimer); ppoAchTimer = setTimeout(function(){ ppoAchEl.style.opacity = '0'; }, 1900);
  });
  </script>
  <script src="/emoji-widget.js"></script>
</body>
</html>
