<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 训练室 · 登录</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f0f2f5;
  color: #2c3e50;
  font-family: 'Segoe UI', 'PingFang SC', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.login-box {

  text-align: center;
  width: 320px;
  max-width: 90vw;
}

.login-box h1 {
  font-size: 1.8rem;
  margin-bottom: 30px;
  color: #2c3e50;
}

.login-box input {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  font-size: 1rem;
  outline: none;
  transition: border 0.2s;
}

.login-box input:focus {
  border-color: #4a90d9;
}

.login-box button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  cursor: pointer;
  margin-bottom: 10px;
  font-weight: 600;
  transition: all 0.2s;
}

.btn-primary {
  background: #4a90d9;
  color: white;
}

.btn-primary:hover {
  background: #357abd;
}

.btn-guest {
  background: none;
  color: #4a90d9;
  border: none;
  width: auto;
  padding: 0;
  font-size: .8rem;
  text-decoration: underline;
  display: block;
  margin: 8px auto 0;
}

.btn-guest:hover {
  background: none;
  color: #2b7cc0;
}

.error {
  color: #e74c3c;
  font-size: 0.9rem;
  margin-top: 8px;
  min-height: 20px;
}

.guest-key-row {
  margin-top: 6px;
}

.guest-key-row input {
  width: 62%;
  background: transparent;
  border: none;
  border-bottom: 1px solid #9db4cc;
  color: #2c3e50;
  font-size: .82rem;
  text-align: center;
  outline: none;
  padding: 2px 4px;
}

.guest-key-row input::placeholder {
  color: #b3bfcb;
  font-size: .76rem;
}
  </style>
</head>
<body>
  <div class="login-box">
    <h1>JBG训练室</h1>
    <input type="password" id="keyInput" placeholder="输入你的密钥" >
    <br>
    <button id="loginBtn">开始训练</button>
    <button id="guestBtn" class="btn-guest">偷赛训！（游客登录）</button>
    <div class="guest-key-row" id="guestKeyRow" style="display:none;">
      <input type="password" id="guestKeyInput" placeholder="输入游客口令，回车进入" autocomplete="off">
    </div>
    <div id="errorMsg" class="error"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const input = document.getElementById('keyInput');
    const btn = document.getElementById('loginBtn');
    const error = document.getElementById('errorMsg');

   btn.addEventListener('click', () => {
  const key = input.value.trim().toLowerCase();
  if (!key) return;
  socket.emit('login', key, (res) => {
    if (res.success) {
      sessionStorage.setItem('playerName', res.name);
      // 🔥 必须加这一行！！！
       sessionStorage.setItem('isTest', res.isTest ? 'true' : 'false'); 
      sessionStorage.setItem('isGuest', 'false');
      window.location.href = '/lobby.html';
    } else {
      error.textContent = res.message || '密钥错误';
    }
  });
});

    // 回车键直接登录
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btn.click();
    });
    // ===== 游客登录（需口令） =====
    const guestKeyRow = document.getElementById('guestKeyRow');
    const guestKeyInput = document.getElementById('guestKeyInput');
    document.getElementById('guestBtn').addEventListener('click', () => {
      guestKeyRow.style.display = 'block';
      guestKeyInput.focus();
    });

    function confirmGuest() {
      const key = guestKeyInput.value.trim();
      error.textContent = '';
      if (!key) { error.textContent = '请输入游客口令'; return; }
      const guestName = '游客' + Math.floor(Math.random() * 900 + 100);
      socket.emit('guest_login', guestName, key, (res) => {
        if (!res || !res.success) { error.textContent = (res && res.message) || '游客口令错误'; return; }
        sessionStorage.setItem('playerName', res.name);
        sessionStorage.setItem('isGuest', 'true');
        sessionStorage.setItem('isTest', 'false');   // 防止继承上一个"测试账号"的标记
        window.location.href = '/lobby.html';
      });
    }
    guestKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmGuest(); });
  </script>
</body>
</html>
