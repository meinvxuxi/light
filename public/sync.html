<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>默契空间</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 620px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 620px; margin: 0 auto; padding: 14px 4px 60px; }
    .lab { font-size: .76rem; color: #9aa5b1; letter-spacing: 1px; margin: 18px 0 4px; border-bottom: 1px solid #e8ecf1; padding: 0 2px 6px; }
    .sc-row { display: block; padding: 10px 4px; border-bottom: 1px dashed #eef0f4; cursor: pointer; user-select: none; }
    .sc-row:last-of-type { border-bottom: none; }
    .sc-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .sc-row:hover .who { color: #4a90d9; }
    .sc-row .who { font-weight: 700; color: #4a90d9; }
    .asub { font-size: .76rem; color: #9aa5b1; margin-top: 2px; }
    .sc-row .me-tag { font-size: .7rem; color: #9aa5b1; }
    .sc-row .sc { margin-left: auto; color: #6b7a90; font-size: .84rem; white-space: nowrap; }
    .sc-row .tl { color: #e08a2d; font-size: .74rem; white-space: nowrap; }
    .empty { text-align: center; color: #adb5bd; padding: 46px 0; font-size: .88rem; }
    .err { text-align: center; color: #e74c3c; padding: 34px 0; font-size: .9rem; }
    @media (max-width: 480px) { .sc-row { flex-wrap: wrap; } .sc-row .sc { margin-left: auto; } }
  </style>
</head>
<body>
  <div class="headbar">
    <span class="title">默契空间</span>
    <a class="back" href="/lobby.html">返回大厅</a>
  </div>
  <div class="wrap" id="wrap"><div class="empty">加载中…</div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    if (sessionStorage.getItem('isGuest') === 'true') { window.location.href = '/lobby.html'; }
    let _dm = {};
    function dn(n) { return _dm[n] || n; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    // ===== 主题引擎（五套：初始/粉/绿 + 各角色背景） =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6, agly: 0.82 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.sc-row .who,.tl';
      const pink = scoped('body.dyn-pink', col) + '{color:#f06292!important}';
      const green = scoped('body.dyn-green', col) + '{color:#6f9e63!important}';
          const gold = pink
      .replace(/dyn-pink/g, 'dyn-gold')
      .replace(/#f06292/g, '#d6a843')
      .replace(/#e0507f/g, '#b98a2e')
      .replace(/#a0345c/g, '#b98a2e')
      .replace(/#ffb3c6/g, '#eeddb3')
      .replace(/#f9b7ca/g, '#f0e3bd')
      .replace(/#fff4f7/g, '#fff8ea')
      .replace(/#ffe3ec/g, '#fdf3dd');
    s.textContent = pink + '\n' + green + '\n' + gold;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green', 'dyn-gold');
      if (id && id !== 'initial') {
        b.classList.add((id === 'agly') ? 'dyn-gold' : ((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink'));
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function paintSaved() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
    }
    function applyTheme() {
      if (!socket.connected) return;
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', false);
    }
    const socket = io();
    socket.on('connect', () => { paintSaved(); sendHeartbeat(); applyTheme(); });
    setTimeout(() => { paintSaved(); if (socket.connected) applyTheme(); }, 600);
    window.addEventListener('pageshow', () => { paintSaved(); if (socket.connected) applyTheme(); });
    setInterval(sendHeartbeat, 10000);

    function openPair(key) {
      const [a, b] = key.split('|');
      window.location.href = '/pair.html?pair=' + encodeURIComponent(key);
    }
    function rowHtml(c, isMe) {
      const inRow = c.a === myName || c.b === myName;
      const title = c.alias || (dn(c.a) + ' × ' + dn(c.b));
      const sub = c.alias ? (dn(c.a) + ' × ' + dn(c.b)) : '';
      const tls = (c.titles && c.titles.length) ? '　<span class="tl">' + c.titles.map(esc).join(' / ') + '</span>' : '';
      const tag = isMe || inRow ? '<span class="me-tag">我</span>' : '';
      return `<div class="sc-row" ondblclick="openPair('${c.key}')">
        <div class="sc-top">
          <span class="who">${esc(title)}${tag}</span>
          ${tls}
          <span class="sc">默契 ${c.score} 分</span>
        </div>
        ${sub ? `<div class="asub">${esc(sub)}</div>` : ''}
      </div>`;
    }
    function render(res) {
      const w = document.getElementById('wrap');
      if (!res || !res.success) {
        w.innerHTML = `<div class="err">${esc((res && res.msg) || '加载失败，请刷新重试')}</div>`;
        return;
      }
      w.innerHTML = `
        <div class="lab">我与他们（双击进入该组合的默契空间）</div>
        ${res.first.map(c => rowHtml(c, true)).join('') || '<div class="empty">暂无组合</div>'}
        <div class="lab">其他玩家之间</div>
        ${res.second.map(c => rowHtml(c, false)).join('') || '<div class="empty">暂无组合</div>'}`;
    }
    socket.on('connect', () => {
      socket.emit('get_display_names', (r) => { if (r && r.success) _dm = r.map; });
      socket.emit('get_sync_home', render);
    });
  </script>
</body>
</html>
