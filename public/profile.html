<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人空间</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 620px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 620px; margin: 0 auto; padding: 18px 4px 60px; }
    .pl-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
    .pl-name { font-size: 1.4rem; font-weight: 700; }
    .pl-title { font-size: .78rem; color: #7f8fa6; background: #eef1f5; border-radius: 20px; padding: 3px 12px; }
    .pl-status { font-size: .82rem; color: #9aa5b1; margin-top: 8px; }
    .pl-hl { color: #4a90d9; font-weight: 600; }
    .lab { font-size: .76rem; color: #9aa5b1; letter-spacing: 1px; margin: 24px 0 4px; border-bottom: 1px solid #e8ecf1; padding: 0 2px 6px; }
    .st-grid { display: flex; flex-wrap: wrap; padding-top: 2px; }
    .st-cell { width: 33.33%; padding: 8px 2px; font-size: .84rem; color: #7f8fa6; }
    .st-cell b { display: block; color: #2c3e50; font-size: 1.1rem; margin-top: 2px; }
    .st-fold { display: flex; align-items: baseline; gap: 10px; padding: 11px 2px; cursor: pointer; user-select: none; font-size: .95rem; border-bottom: 1px solid #f0f2f6; }
    .st-fold:hover .st-gname { color: #4a90d9; }
    .st-fold.open { border-bottom: none; }
    .st-tri { color: #9aa5b1; font-size: .72rem; width: 10px; flex: none; }
    .st-gname { color: #2c3e50; font-weight: 700; }
    .st-gsum { margin-left: auto; color: #7f8fa6; font-size: .84rem; white-space: nowrap; }
    .st-detail { display: none; padding: 2px 0 10px; }
    .st-detail.open { display: block; }
    .st-detail .st-grid { border-bottom: 1px dashed #eef0f4; padding-bottom: 6px; }
    .st-mode { display: flex; flex-wrap: wrap; gap: 3px 0; padding: 8px 2px 8px 18px; font-size: .82rem; color: #6b7a90; border-bottom: 1px solid #f4f6f9; }
    .st-mode:last-child { border-bottom: none; }
    .st-mode .mk { width: 54px; flex: none; font-size: .76rem; }
    .st-mode .mv { font-weight: 600; color: #2c3e50; margin: 0 2px; }
    .st-sep { color: #c3cad3; margin: 0 4px; }
    .ptabs { display: flex; flex-wrap: wrap; gap: 4px 20px; border-bottom: 1px solid #e8ecf1; padding: 2px 2px 8px; }
    .ptab { color: #6b7a90; font-size: .9rem; cursor: pointer; padding: 2px 2px 4px; border-bottom: 2px solid transparent; user-select: none; }
    .ptab:hover { color: #4a90d9; }
    .ptab.active { color: #4a90d9; border-bottom-color: #4a90d9; font-weight: 600; }
    .st-grid.two .st-cell { width: 50%; }
    .ach-row { padding: 9px 2px; border-bottom: 1px dashed #eef0f4; font-size: .9rem; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .ach-row:last-child { border-bottom: none; }
    .ach-count { color: #9aa5b1; font-size: .78rem; white-space: nowrap; }
    .ach-q-common { color: #7f8fa6; } .ach-q-rare { color: #4caf50; } .ach-q-epic { color: #9c27b0; } .ach-q-legend { color: #ff9800; } .ach-q-hidden { color: #d32f2f; }
    .ach-common .ach-q { color: #7f8fa6; } .ach-rare .ach-q { color: #4caf50; } .ach-epic .ach-q { color: #9c27b0; } .ach-legend .ach-q { color: #ff9800; } .ach-hidden .ach-q { color: #d32f2f; }
    .ach-first { color: #b6bec9; font-size: .72rem; }
    .ach-grid { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding-top: 8px; }
    .ach-chip { font-size: .94rem; color: #6b7a90; }
    .ach-chip.q-common { color: #6b7a90; }
    .ach-chip.q-rare { color: #4caf50; }
    .ach-chip.q-epic { color: #9c27b0; }
    .ach-chip.q-legend { color: #ff9800; }
    .ach-chip.q-hidden { color: #d32f2f; }
    .lab2 { font-size: .74rem; color: #9aa5b1; margin: 14px 0 2px; letter-spacing: 1px; }
    .empty { text-align: center; color: #adb5bd; padding: 46px 0; font-size: .88rem; }
    .err { text-align: center; color: #e74c3c; padding: 34px 0; font-size: .9rem; }
    .backlink { text-align: center; margin-top: 12px; }
    @media (max-width: 480px) { .st-cell { width: 50%; } .pl-name { font-size: 1.2rem; } }
  </style>
</head>
<body>
  <div class="headbar">
    <span class="title">个人空间</span>
    <a class="back" href="/lobby.html">返回大厅</a>
  </div>
  <div class="wrap" id="wrap"><div class="empty">加载中…</div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    if (sessionStorage.getItem('isGuest') === 'true') { window.location.href = '/lobby.html'; }
    const target = new URLSearchParams(location.search).get('name') || myName;

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmtDate(ts) {
      if (!ts) return '';
      const d = new Date(ts), p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function fmtShort(ts) {
      if (!ts) return '';
      const d = new Date(ts), p = n => String(n).padStart(2, '0');
      return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    // ===== 主题引擎（五套：初始/粉/绿 + 各角色背景） =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6, agly: 0.82 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.pl-hl,.st-mode .mk,.ptab.active';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        'body.dyn-pink .ptab.active{border-bottom-color:#ffb3c6!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        'body.dyn-green .ptab.active{border-bottom-color:#a9c79e!important}';
          const gold = pink
      .replace(/dyn-pink/g, 'dyn-gold')
      .replace(/#f06292/g, '#d6a843')
      .replace(/#e0507f/g, '#b98a2e')
      .replace(/#a0345c/g, '#b98a2e')
      .replace(/#ffb3c6/g, '#eeddb3')
      .replace(/#f9b7ca/g, '#f0e3bd')
      .replace(/#fff4f7/g, '#fff8ea')
      .replace(/#ffe3ec/g, '#fdf3dd');
    s.textContent = pink + '\n' + green + '\n' + gold;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green', 'dyn-gold');
      if (id && id !== 'initial') {
        b.classList.add((id === 'agly') ? 'dyn-gold' : ((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink'));
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function paintSaved() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
    }
    function applyTheme() {
      if (!socket.connected) return;
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', false);
    }
    const socket = io();
    socket.on('connect', () => { paintSaved(); sendHeartbeat(); applyTheme(); });
    setTimeout(() => { paintSaved(); if (socket.connected) applyTheme(); }, 600);
    window.addEventListener('pageshow', () => { paintSaved(); if (socket.connected) applyTheme(); });
    setInterval(sendHeartbeat, 10000);

    const GAME_LABEL = { yahtzee: '快艇骰子', light: '拍灯大作战', drawing: '画猜接龙' };
    function gameLabel(k) { return GAME_LABEL[k] || k; }
    function statCell(lab, val) {
      return `<div class="st-cell">${lab}<b>${val}</b></div>`;
    }
    let stTotals = { games: 0, wins: 0, winRate: 0, totalScore: 0, best: 0 };
    let stByGame = [];
    let stAch = [];
    let stCareer = null;
    let curGame = 'all';
    function setAchVisible() {
      const lab = document.getElementById('achLab');
      const list = document.getElementById('achList');
      const on = curGame === 'all';
      if (lab) lab.style.display = on ? 'block' : 'none';
      if (list) list.style.display = on ? 'block' : 'none';
    }
    function sumByGame(g) {
      const s = { games: 0, wins: 0, winRate: 0, totalScore: 0, best: 0 };
      (g.modes || []).forEach(m => {
        s.games += m.games; s.wins += m.wins; s.totalScore += m.totalScore;
        if (m.best > s.best) s.best = m.best;
      });
      s.winRate = s.games ? Math.round(s.wins / s.games * 100) : 0;
      return s;
    }
    function metricStr(m) {
      const ps = ['场次', '冠军', '胜率', '累计总分', '单局最高'];
      const vs = [m.games, m.wins, m.winRate + '%', m.totalScore, m.best];
      return ps.map((p, i) => (i ? '<span class="st-sep">·</span>' : '') + p + ' <span class="mv">' + vs[i] + '</span>').join('');
    }
    function renderStatsBox() {
      const box = document.getElementById('stBox');
      if (!box) return;
      if (curGame === 'all') {
        box.innerHTML = `<div class="st-grid two">
          ${statCell('游玩场次', stTotals.games)}
          ${statCell('冠军次数', stTotals.wins)}
        </div>`;
        setAchVisible();
        return;
      }
      const g = stByGame.find(x => x.game === curGame);
      if (!g || !(g.modes || []).length) {
        box.innerHTML = '<div class="empty">该游戏还没有对局记录</div>';
        setAchVisible();
        return;
      }
      const s = sumByGame(g);
      let html;
      if (curGame === 'drawing' && stCareer) {
        const c = stCareer;
        html = `
        <div class="st-grid two">
          ${statCell('游玩场次', c.games)}
          ${statCell('冠军次数', c.wins)}
          ${statCell('胜率', c.games ? c.winRate + '%' : '—')}
          ${statCell('累计总分', c.totalScore)}
          ${statCell('单局最高', c.best)}
          ${statCell('被投 MVP 次数', c.mvp)}
          ${statCell('被投罪魁次数', c.culprit)}
        </div>
        <div style="font-size:.8rem;color:#9aa5b1;margin:2px 0 6px;">花菜专属战绩</div>
        ${(g.modes || []).map(m => `<div class="st-mode"><span class="mk">${esc(m.mode)}</span>${metricStr(m)}</div>`).join('')}`;
      } else {
        html = `
        <div class="st-grid">
          ${statCell('游玩场次', s.games)}${statCell('冠军次数', s.wins)}${statCell('胜率', s.winRate + '%')}${statCell('累计总分', s.totalScore)}${statCell('单局最高', s.best)}
        </div>
        ${(g.modes || []).map(m => `<div class="st-mode"><span class="mk">${esc(m.mode)}</span>${metricStr(m)}</div>`).join('')}`;
      }
      const gAch = stAch.filter(a => a.game === curGame);
      if (gAch.length) {
        html += `<div class="lab2">成就</div>` + gAch.map(a => `
          <div class="ach-row">
            <span class="ach-${esc(a.quality)}"><span class="ach-q">${esc(a.name)}</span>　<span class="ach-first">${fmtDate(a.firstTime)} 首次</span></span>
            <span class="ach-count">${a.count} 次</span>
          </div>`).join('');
      }
      box.innerHTML = html;
      setAchVisible();
    }
    function switchGame(k) {
      curGame = k;
      document.querySelectorAll('#statsTabs .ptab').forEach(t => t.classList.toggle('active', t.getAttribute('data-g') === k));
      renderStatsBox();
    }
    function render(res) {
      const w = document.getElementById('wrap');
      if (!res || !res.success) {
        w.innerHTML = `<div class="err">${esc((res && res.msg) || '加载失败，请刷新重试')}</div><div class="backlink"><a class="back" href="/lobby.html">返回大厅</a></div>`;
        return;
      }
      const st = res.stats || {};
      stTotals = st.totals || stTotals;
      stByGame = st.byGame || [];
      stCareer = res.drawingCareer || null;
      const status = res.online
        ? '在线'
        : (res.lastSeen ? `离线 · 上次在线 ${fmtShort(res.lastSeen)}` : '离线');
      const ach = res.achievements || [];
      stAch = ach;
      const achHtml = ach.length
        ? `<div class="ach-grid">${ach.map(a => `<span class="ach-chip q-${esc(a.quality)}">${esc(a.name)}</span>`).join('')}</div>`
        : '<div class="empty">还没有成就记录，去玩一局快艇骰子吧～</div>';
      w.innerHTML = `
        <div class="pl-head">
          <span class="pl-name">${esc(res.displayName)}</span>
          ${res.title ? `<span class="pl-title">${esc(res.title)}</span>` : ''}
        </div>
        <div class="pl-status">${status}</div>

        <div class="lab">对局战绩</div>
        <div class="ptabs" id="statsTabs">
          <span class="ptab active" data-g="all" onclick="switchGame('all')">总览</span>
          ${stByGame.map(g => `<span class="ptab" data-g="${esc(g.game)}" onclick="switchGame('${esc(g.game)}')">${esc(gameLabel(g.game))}</span>`).join('')}
        </div>
        <div id="stBox"></div>

        <div class="lab" id="achLab">成就（已解锁 ${ach.length} / ${res.totalAch || 12}）</div>
        <div id="achList">${achHtml}</div>`;
      renderStatsBox();
    }
    socket.on('connect', () => {
      socket.emit('get_profile_page', target, render);
    });
  </script>
</body>
</html>
