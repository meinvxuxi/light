<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .filter { max-width: 680px; margin: 14px auto 8px; display: flex; gap: 6px; }
    .g-tab { background: none; border: none; padding: 5px 14px; font-size: .88rem; cursor: pointer; color: #6b7a90; border-radius: 8px; }
    .g-tab:hover { color: #4a90d9; background: none; }
    .g-tab.active { color: #4a90d9; font-weight: 700; border-bottom: 2px solid #4a90d9; border-radius: 0; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 4px 6px 40px; }
    .list { background: rgba(74,144,217,.06); border: 1px solid rgba(237,240,244,.9); border-radius: 12px; padding: 10px 14px; min-height: 220px; max-height: 52vh; overflow-y: auto; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    body.dyn-pink .list { background: rgba(240,98,146,.06); border-color: rgba(240,98,146,.16); }
    body.dyn-green .list { background: rgba(111,158,99,.08); border-color: rgba(111,158,99,.18); }
    .msg { padding: 8px 2px; border-bottom: 1px solid rgba(233,238,244,.8); }
    .msg:last-child { border-bottom: none; }
    .msg .mhead { font-size: .76rem; color: #9aa5b1; margin-bottom: 2px; }
    .msg .mhead.sys { color: #4a90d9; font-weight: 600; }
    .msg .mhead .g { margin-left: 4px; color: #f0a020; }
    .msg .mtext { font-size: .92rem; line-height: 1.5; word-break: break-word; }
    body.dyn-pink .msg .mhead.sys { color: #f06292; }
    body.dyn-green .msg .mhead.sys { color: #6f9e63; }
    .compose { display: flex; gap: 8px; margin-top: 12px; }
    .compose input { flex: 1; padding: 10px 12px; border: 1px solid rgba(74,144,217,.38); border-radius: 10px; font-size: .9rem; outline: none; color: #2c3e50; background: rgba(255,255,255,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    body.dyn-pink .compose input { border-color: rgba(240,98,146,.45); background: rgba(255,255,255,.7); }
    body.dyn-green .compose input { border-color: rgba(111,158,99,.5); background: rgba(255,255,255,.7); }
    .compose button { padding: 0 18px; border: 1px solid rgba(74,144,217,.55); border-radius: 10px; background: rgba(74,144,217,.16); color: #2f6fb2; font-size: .88rem; font-weight: 600; cursor: pointer; }
    .compose button:hover { background: rgba(74,144,217,.26); }
    .compose button:disabled { background: rgba(155,170,180,.16); color: #98a2ad; border-color: rgba(155,170,180,.4); cursor: not-allowed; }
    body.dyn-pink .compose button { background: rgba(240,98,146,.16); color: #c73e79; border-color: rgba(240,98,146,.5); }
    body.dyn-pink .compose button:hover { background: rgba(240,98,146,.28); }
    body.dyn-pink .compose button:disabled { background: rgba(155,170,180,.16); color: #c0a2ae; border-color: rgba(155,170,180,.4); }
    body.dyn-green .compose button { background: rgba(111,158,99,.17); color: #4f8a45; border-color: rgba(111,158,99,.55); }
    body.dyn-green .compose button:hover { background: rgba(111,158,99,.28); }
    body.dyn-green .compose button:disabled { background: rgba(155,170,180,.16); color: #7f9a76; border-color: rgba(155,170,180,.4); }
    .guest-hint { text-align: center; margin-top: 10px; font-size: .8rem; color: #adb5bd; }
    .empty { text-align: center; color: #adb5bd; font-size: .85rem; padding: 40px 0; }
    .err { max-width: 680px; margin: 6px auto 0; font-size: .8rem; color: #e74c3c; min-height: 16px; text-align: center; }
    /* ===== p1 专属主题：素材背景 + 粉色点缀 ===== */
    body.theme-p1 { background-image: linear-gradient(rgba(255,255,255,.82), rgba(255,255,255,.82)), url('/assets/avatars/p1/beijing.png.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
    body.theme-p1 .back, body.theme-p1 .back:hover { color: #f06292; }
    body.theme-p1 .g-tab.active { color: #f06292; border-bottom-color: #ffb3c6; }
    body.theme-p1 .g-tab:hover { color: #f06292; }
  
    body.dyn-gold .list{background:rgba(214,168,67,.07);border-color:rgba(214,168,67,.2);}
    body.dyn-gold .compose input{border-color:rgba(214,168,67,.45);background:rgba(255,255,255,.72);}
    body.dyn-gold .compose button{background:rgba(214,168,67,.16);color:#a8791b;border-color:rgba(214,168,67,.55);}
    body.dyn-gold .compose button:hover{background:rgba(214,168,67,.28);}
    body.dyn-gold .compose button:disabled{background:rgba(155,170,180,.16);color:#b29a63;border-color:rgba(155,170,180,.4);}
    body.dyn-gold .msg .mhead.sys{color:#c9982f;}
  
    body.dyn-red .list{background:rgba(166,64,58,.07);border-color:rgba(166,64,58,.2);}
    body.dyn-red .compose input{border-color:rgba(166,64,58,.45);background:rgba(255,255,255,.72);}
    body.dyn-red .compose button{background:rgba(166,64,58,.15);color:#8c332d;border-color:rgba(166,64,58,.55);}
    body.dyn-red .compose button:hover{background:rgba(166,64,58,.27);}
    body.dyn-red .compose button:disabled{background:rgba(155,170,180,.16);color:#a9807c;border-color:rgba(155,170,180,.4);}
    body.dyn-red .msg .mhead.sys{color:#a6403a;}
  </style>
</head>
<body>
  <div class="headbar">
    <span class="title">留言板</span>
    <a class="back" href="/lobby.html">返回大厅</a>
  </div>

  <div class="filter" id="tabs">
    <button class="g-tab" data-tab="official" onclick="setTab('official')">玩家留言</button>
    <button class="g-tab" data-tab="guest" onclick="setTab('guest')">游客留言</button>
  </div>

  <div class="wrap">
    <div class="list" id="msgList"><div class="empty">加载中…</div></div>
    <div class="compose" id="composeRow">
      <input id="msgInput" maxlength="100" placeholder="说点什么…（最多 100 字）" onkeydown="if(event.key==='Enter')sendMsg()">
      <button id="sendBtn" onclick="sendMsg()">发送</button>
    </div>
    <div class="guest-hint" id="guestHint" style="display:none;">仅游客可以在「游客留言」区留言</div>
    <div class="err" id="err"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    const isGuest = sessionStorage.getItem('isGuest') === 'true';

    const data = { official: [], guest: [] };   // 本地两块留言缓存（新在上）
    let curTab = isGuest ? 'guest' : 'official';

    // 游客只显示游客留言区（隐藏玩家留言 tab）
    if (isGuest) {
      document.querySelector('[data-tab="official"]').style.display = 'none';
    }

    // 默认按身份选中对应留言板：正式玩家=玩家留言，游客=游客留言
    setTab(curTab);

    function setTab(t) {
      curTab = t;
      document.querySelectorAll('#tabs .g-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === t));
      // 输入框可见性：只有"当前板块允许你发言"才显示
      // （正式玩家在游客区不能发言 → 隐藏输入框并显示提示；游客只能发游客区）
      const canPost = isGuest ? (curTab === 'guest') : (curTab === 'official');
      document.getElementById('composeRow').style.display = canPost ? 'flex' : 'none';
      document.getElementById('guestHint').style.display = (!canPost && curTab === 'guest') ? 'block' : 'none';
      render();
    }

    function fmtTime(ts) {
      const d = new Date(ts);
      const p = n => String(n).padStart(2, '0');
      return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function render() {
      const list = data[curTab];
      const el = document.getElementById('msgList');
      if (!list.length) { el.innerHTML = '<div class="empty">还没有留言，来说第一句吧～</div>'; return; }
      el.innerHTML = '';
      // 最新在最上面：从新到旧 自上而下排列
      const newest = list.slice().reverse();
      for (const m of newest) {
        const row = document.createElement('div');
        row.className = 'msg';
        const head = document.createElement('div');
        head.className = 'mhead';
        if (m.name === '系统') head.classList.add('sys');
        head.textContent = dn(m.name) + ' · ' + fmtTime(m.ts);
        if (m.name.startsWith('游客')) {
          const g = document.createElement('span');
          g.className = 'g';
          g.textContent = '游客';
          head.appendChild(g);
        }
        const body = document.createElement('div');
        body.className = 'mtext';
        body.textContent = m.text;
        row.appendChild(head);
        row.appendChild(body);
        el.appendChild(row);
      }
      el.scrollTop = 0; // 停在最上面（最新）
    }

    const socket = io();

    // ===== p1 主题应用 =====
    // ===== 主题引擎 =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg', pomelo: '/assets/avatars/p3/nene.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg', pomelo: '/assets/avatars/p3/nene2.jpg', agly: '/assets/avatars/p1/agly/aglybj.jpg', lyff: '/assets/avatars/p4/lyff/lyffbj.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82, pomelo: 0.6, agly: 0.82, lyff: 0.8 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.g-hall,.save,.mini-link,.l-link,.l-link:hover,.gear,.gear:hover,.guest-toggle:hover,.f-link:hover,.theme-opt.active,.p-tri:hover,.player-card.online .status-text';
      const btn = '.controls #btnStart,.btn-roll';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        scoped('body.dyn-pink', '.g-tab.active') + '{color:#f06292!important;border-bottom-color:#ffb3c6!important}' +
        scoped('body.dyn-pink', '.g-tab:hover') + '{color:#f06292!important}' +
        scoped('body.dyn-pink', btn) + '{background:#f06292!important;border-color:#f06292!important}' +
        'body.dyn-pink .controls #btnStart:hover,body.dyn-pink .btn-roll:hover{background:#e0507f!important}' +
        'body.dyn-pink .game-link{border-bottom-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.occupied{border-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.ready{border-color:#f9b7ca!important;background:#fff4f7!important}' +
        'body.dyn-pink .me-tag{background:#ffe3ec!important;color:#e0507f!important}' +
        'body.dyn-pink .toast,body.dyn-pink .home-toast{background:#a0345c!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', '.g-tab.active') + '{color:#6f9e63!important;border-bottom-color:#a9c79e!important}' +
        scoped('body.dyn-green', '.g-tab:hover') + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', btn) + '{background:#6f9e63!important;border-color:#6f9e63!important}' +
        'body.dyn-green .controls #btnStart:hover,body.dyn-green .btn-roll:hover{background:#5b8a50!important}' +
        'body.dyn-green .game-link{border-bottom-color:#a9c79e!important}' +
        'body.dyn-green .seat.occupied{border-color:#a9c79e!important}' +
        'body.dyn-green .seat.ready{border-color:#b9d6af!important;background:#f2f8f0!important}' +
        'body.dyn-green .me-tag{background:#e6f1e2!important;color:#5b8a50!important}' +
        'body.dyn-green .toast,body.dyn-green .home-toast{background:#48673f!important}';
          const gold = pink
      .replace(/dyn-pink/g, 'dyn-gold')
      .replace(/#f06292/g, '#d6a843')
      .replace(/#e0507f/g, '#b98a2e')
      .replace(/#a0345c/g, '#b98a2e')
      .replace(/#c73e79/g, '#a8791b')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(214, 168, 67,')
      .replace(/#ffb3c6/g, '#eeddb3')
      .replace(/#f9b7ca/g, '#f0e3bd')
      .replace(/#fff4f7/g, '#fff8ea')
      .replace(/#ffe3ec/g, '#fdf3dd');
    const red = pink
      .replace(/dyn-pink/g, 'dyn-red')
      .replace(/#f06292/g, '#a6403a')
      .replace(/#e0507f/g, '#8c332d')
      .replace(/#a0345c/g, '#8c332d')
      .replace(/#c73e79/g, '#8c332d')
      .replace(/rgba\(240\s*,\s*98\s*,\s*146\s*,/g, 'rgba(166, 64, 58,')
      .replace(/#ffb3c6/g, '#ddb5b2')
      .replace(/#f9b7ca/g, '#ddb5b2')
      .replace(/#fff4f7/g, '#fcf1f0')
      .replace(/#ffe3ec/g, '#faeae8');
    s.textContent = pink + '\n' + green + '\n' + gold + '\n' + red;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green', 'dyn-gold', 'dyn-red');
      if (id && id !== 'initial') {
        b.classList.add((id === 'agly') ? 'dyn-gold' : ((id === 'lyff') ? 'dyn-red' : ((id === 'p3' || id === 'pomelo') ? 'dyn-green' : 'dyn-pink')));
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.82;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function applyTheme() {
      const saved = localStorage.getItem('myTheme');
      if (saved) paintTheme(saved);
      socket.emit('get_profile', (r) => {
        if (!r || !r.success) return;
        const t = r.theme || 'initial';
        localStorage.setItem('myTheme', t);
        paintTheme(t);
      });
    }
    socket.on('connect', applyTheme);
    setTimeout(applyTheme, 600);

    // ===== 显示名映射（服务器内部用真名，展示统一翻译成昵称）=====
    let _dispMap = {};
    function dn(n) { return _dispMap[n] || n; }
    socket.on('connect', () => {
      socket.emit('get_display_names', (res) => { if (res && res.success) { _dispMap = res.map; render(); } });
    });

    // 心跳：让服务器识别当前身份（留言页是新打开的页面/新连接，必须续接身份才能发留言）
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', false);
    }
    socket.on('connect', sendHeartbeat);
    setInterval(sendHeartbeat, 10000);

    socket.on('connect', () => {
      socket.emit('get_board', (res) => {
        if (res && res.success) {
          data.official = (res.official || []).slice();
          data.guest = (res.guest || []).slice();
          render();
        }
      });
    });

    // 实时收到新留言
    socket.on('board_new', ({ type, msg }) => {
      if (!msg) return;
      data[type].push(msg);
      const cap = 120;
      if (data[type].length > cap) data[type].shift();
      if (curTab === type) render();
    });

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const err = document.getElementById('err');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('post_board_message', { text }, (res) => {
        if (res && res.success) {
          input.value = '';
          err.textContent = '';
        } else {
          err.textContent = (res && res.msg) || '发送失败';
        }
      });
    }
  </script>
</body>
</html>
