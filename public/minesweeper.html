<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>扫雷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#f0f2f5;color:#2c3e50;font-family:'Segoe UI','PingFang SC',sans-serif;padding:10px;}
.head{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;}
.head a{color:#4a90d9;cursor:pointer;font-weight:600;margin-left:10px;}
.wrap{max-width:560px;margin:0 auto;}
.info{display:flex;justify-content:space-between;gap:8px;margin:8px 0 6px;font-size:.85rem;color:#6b7a90;flex-wrap:wrap;}
table.g{border-collapse:collapse;margin:0 auto;}
table.g td{width:10vw;max-width:50px;height:10vw;max-height:50px;min-width:32px;min-height:32px;border:1px solid #c7ced6;text-align:center;vertical-align:middle;font-size:.9rem;position:relative;}
td.un{background:#cdd5de;cursor:pointer;}
td.rev{background:#fff;cursor:default;}
td.flag{background:#fff3d9;color:#b8860b;}
td.mine{background:#f3b6b6;cursor:default;}
.mine-x{color:#c62828;font-weight:800;}
.num1{color:#4a90d9}.num2{color:#2e8b57}.num3{color:#c62828}.num4{color:#6a3fbf}.num5{color:#8c332d}.num6{color:#0097a7}.num7{color:#2c3e50}.num8{color:#7f8fa6}
.emjrow{position:absolute;left:0;right:0;bottom:0;top:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;pointer-events:none;}
.c1 .emj{width:92%;height:auto;aspect-ratio:1/1;}
.c2 .emj{width:44%;height:auto;aspect-ratio:1/1;}
.c3 .emj{width:46%;height:auto;aspect-ratio:1/1;}
.c4 .emj{width:48%;height:auto;aspect-ratio:1/1;}
.emj{border-radius:50%;width:34%;min-width:11px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.72);backdrop-filter:blur(3px);border:1px solid rgba(74,144,217,.55);position:relative;overflow:visible;}
.emj img{width:92%;height:92%;object-fit:contain;border-radius:50%;}
.emj.open{border-color:rgba(74,144,217,.75);}
.emj.flagc{border-color:rgba(192,57,43,.75);}
.emj img{width:92%;height:92%;object-fit:contain;}
.emjrow.one .emj{width:96%;height:96%;}
.emjrow.one .emj img{width:98%;height:98%;}
.emj.arm{opacity:.62;box-shadow:0 0 0 3px rgba(255,255,255,.55);}
table.g{background:#fff;border:2px solid #7f8ea0;border-radius:6px;}
table.g td{border:1px solid #8d9bab;}
.emj .no{font-size:8px;font-weight:800;color:#2c3e50;}
.float{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;z-index:5;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff;animation:msfloat 1s ease forwards;}
@keyframes msfloat{0%{opacity:0;transform:translateX(-50%) translateY(4px);}20%{opacity:1;}100%{opacity:1;transform:translateX(-50%) translateY(-2px);}}
.scoreline{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 10px;margin:8px 0 4px;}
.p{font-size:.82rem;padding:3px 10px;border-radius:14px;background:rgba(255,255,255,.72);border:1px solid rgba(74,144,217,.25);position:relative;}
.p.me{border-color:#4a90d9;font-weight:800;}
.p .dft{position:absolute;top:-12px;right:4px;font-size:11px;font-weight:800;}
.p .odot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;background:#d7dde3;vertical-align:middle;}
.p .odot.on{background:#6f9e63;}
.modebar{display:flex;justify-content:center;gap:10px;margin:8px 0;}
.mode-opt{padding:5px 14px;border-radius:10px;border:1px solid #dfe3e8;background:#fff;cursor:pointer;font-size:.82rem;}
.mode-opt.on{border-color:#4a90d9;background:rgba(74,144,217,.14);color:#2f6fb2;font-weight:700;}
.stage{text-align:center;color:#6b7a90;font-size:.88rem;margin:4px 0;min-height:20px;}
.go{color:#4a90d9;cursor:pointer;font-weight:600;}
.reset{color:#9aa5b1;font-size:.78rem;cursor:pointer;margin-left:8px;}
body.dyn-pink .mode-opt.on{border-color:#f06292;background:rgba(240,98,146,.14);color:#c73e79;}
body.dyn-green .mode-opt.on{border-color:#6f9e63;background:rgba(111,158,99,.15);color:#4f8a45;}
body.dyn-gold .mode-opt.on{border-color:#d6a843;background:rgba(214,168,67,.15);color:#a8791b;}
body.dyn-red .mode-opt.on{border-color:#a6403a;background:rgba(166,64,58,.13);color:#8c332d;}
.players{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0 6px;}
.tbox{display:flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid rgba(74,144,217,.35);border-radius:16px;background:rgba(255,255,255,.65);backdrop-filter:blur(8px);}
.tsum{font-weight:800;font-size:1rem;margin:0 4px;color:#2c3e50;text-align:center;}
.pcard{display:flex;flex-direction:column;align-items:center;min-width:58px;}
.pface{width:54px;height:54px;border-radius:50%;overflow:hidden;border:2px solid rgba(74,144,217,.5);background:#fff;position:relative;}
.pface img{width:100%;height:100%;object-fit:contain;}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c0c8d1;font-size:1.5rem;font-weight:700;}
.pname{margin-top:2px;font-weight:700;font-size:.78rem;white-space:nowrap;}
.pscore{color:#7f8fa6;font-size:.78rem;}
.pstatus{font-size:.65rem;color:#9aa5b1;}
.pstatus.sel{color:#2e8b57;}
.pstatus.off{color:#c0392b;}
.pdrift{position:absolute;top:-7px;right:-4px;font-weight:800;font-size:.8rem;}
.res{max-width:420px;margin:8px auto;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border:1px solid rgba(74,144,217,.4);border-radius:18px;padding:16px 14px;text-align:center;box-shadow:0 10px 28px rgba(31,45,61,.12);}
.res-title{font-size:1rem;font-weight:800;color:#2c3e50;margin-bottom:10px;}
.res-rows{display:flex;flex-direction:column;gap:6px;text-align:left;}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.6);border:1px solid rgba(74,144,217,.2);}
.rrow.win{background:rgba(255,240,205,.8);border-color:rgba(230,126,34,.45);}
.rrow b{color:#2c3e50;} .rrow .rs{color:#7f8fa6;font-size:.8rem;}
.res-btn{margin-top:12px;display:inline-block;padding:7px 18px;border-radius:10px;background:#4a90d9;color:#fff;font-size:.85rem;cursor:pointer;}
body.dyn-pink .res{border-color:rgba(240,98,146,.45);background:rgba(255,244,248,.8);}
body.dyn-green .res{border-color:rgba(111,158,99,.5);background:rgba(241,248,238,.8);}
body.dyn-gold .res{border-color:rgba(214,168,67,.5);background:rgba(255,250,238,.82);}
body.dyn-red .res{border-color:rgba(166,64,58,.5);background:rgba(253,243,241,.82);}
body.dyn-pink .res-btn{background:#f06292;} body.dyn-green .res-btn{background:#6f9e63;} body.dyn-gold .res-btn{background:#d6a843;} body.dyn-red .res-btn{background:#a6403a;}
body.dyn-pink .rrow.win{background:rgba(255,229,238,.85);} body.dyn-green .rrow.win{background:rgba(237,246,233,.85);} body.dyn-gold .rrow.win{background:rgba(253,246,222,.9);} body.dyn-red .rrow.win{background:rgba(250,234,233,.9);}
body.dyn-pink table.g{border-color:#f5a9c0;} body.dyn-pink .mode-opt.on{color:#c73e79;border-color:#f06292;background:rgba(240,98,146,.14);}
body.dyn-green table.g{border-color:#a9c79e;} body.dyn-green .mode-opt.on{color:#4f8a45;border-color:#6f9e63;background:rgba(111,158,99,.15);}
body.dyn-gold table.g{border-color:#ecd7a2;} body.dyn-gold .mode-opt.on{color:#a8791b;border-color:#d6a843;background:rgba(214,168,67,.15);}
body.dyn-red table.g{border-color:#ddb5b2;} body.dyn-red .mode-opt.on{color:#8c332d;border-color:#a6403a;background:rgba(166,64,58,.13);}
body.dyn-pink .pface{border-color:rgba(240,98,146,.5);}
body.dyn-green .pface{border-color:rgba(111,158,99,.55);}
body.dyn-gold .pface{border-color:rgba(214,168,67,.55);}
body.dyn-red .pface{border-color:rgba(166,64,58,.55);}
.ach-pop{position:fixed;left:50%;top:22%;transform:translate(-50%,0);z-index:6000;background:rgba(255,255,255,.82);border:1px solid rgba(74,144,217,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;padding:12px 22px;text-align:center;font-weight:700;font-size:.95rem;color:#2c3e50;box-shadow:0 10px 30px rgba(31,45,61,.2);pointer-events:none;opacity:0;transition:opacity .25s;max-width:86vw;}
.ach-pop small{display:block;color:#9aa5b1;font-weight:400;font-size:.75rem;margin-top:3px;}
body.dyn-pink .ach-pop{border-color:rgba(240,98,146,.6);background:rgba(255,242,247,.82);}
body.dyn-green .ach-pop{border-color:rgba(111,158,99,.6);background:rgba(241,248,238,.82);}
body.dyn-gold .ach-pop{border-color:rgba(214,168,67,.6);background:rgba(255,250,238,.84);}
body.dyn-red .ach-pop{border-color:rgba(166,64,58,.6);background:rgba(253,243,241,.84);}
.res-ach{margin-top:12px;border-top:1px dashed rgba(74,144,217,.35);padding-top:8px;text-align:left;font-size:.8rem;}
.res-ach .ra-title{font-weight:700;color:#2c3e50;margin-bottom:4px;}
.res-ach .ra-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 2px;color:#6b7a90;flex-wrap:wrap;}
</style>
</head>
<body>
  <div class="head"><b>🧨 扫雷</b><span><a id="msCancelLb" onclick="msCancel()">取消对局</a><a onclick="msExit()">返回房间</a></span></div>
  <div class="wrap">
    <div class="info"><span id="msStage">连接中…</span><span id="msMines">雷 26</span><span id="msRound"></span></div>
    <div id="gridWrap"></div>
    <div id="scoreLine"></div>
    <div class="modebar" id="modeBar"></div>
    <div class="modebar" id="modeBar2"></div>
    <div class="stage" id="msMsg"></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
  const myName = sessionStorage.getItem('playerName');
  if (!myName) location.href='/index.html';
  const MS_IMG = { p1:'/assets/avatars/p1/beijing.png.jpg', p2:'/assets/avatars/p2/zuixin2.jpg', p3:'/assets/avatars/p3/zuixin3.jpg', p4:'/assets/avatars/p4/beijing4.jpg', pomelo:'/assets/avatars/p3/nene.jpg', agly:'/assets/avatars/p1/agly/aglybj.jpg', lyff:'/assets/avatars/p4/lyff/lyffbj.jpg' };
  const MS_MOB = { p4:'/assets/avatars/p4/zuixin4.jpg', pomelo:'/assets/avatars/p3/nene2.jpg', agly:'/assets/avatars/p1/agly/aglybj.jpg', lyff:'/assets/avatars/p4/lyff/lyffbj.jpg' };
  const MS_ALPHA = { p1:.82, p2:.75, p3:.75, p4:.82, pomelo:.6, agly:.82, lyff:.8 };
  function applyMsTheme(t){
    const mobile = window.matchMedia('(max-width: 768px)').matches;
    document.body.classList.remove('dyn-pink','dyn-green','dyn-gold','dyn-red');
    if(!t||t==='initial'){ document.body.style.backgroundImage=''; document.body.style.backgroundSize=''; document.body.style.backgroundAttachment=''; document.body.style.backgroundPosition=''; return; }
    const c=(t==='agly')?'dyn-gold':((t==='lyff')?'dyn-red':((t==='p3'||t==='pomelo')?'dyn-green':'dyn-pink'));
    document.body.classList.add(c);
    const img=(mobile&&MS_MOB[t])?MS_MOB[t]:(MS_IMG[t]||'');
    if(img){ const a=MS_ALPHA[t]||0.82; document.body.style.backgroundImage='linear-gradient(rgba(255,255,255,'+a+'),rgba(255,255,255,'+a+')),url(\''+img+'\')'; document.body.style.backgroundSize='cover'; document.body.style.backgroundAttachment=mobile?'scroll':'fixed'; document.body.style.backgroundPosition='center'; }
  }
  applyMsTheme(localStorage.getItem('myTheme'));
  const socket = io();
  const IS_T = sessionStorage.getItem('isTest') === 'true';
  socket.on('connect', () => {
    socket.emit('heartbeat', myName, IS_T, true);
    setTimeout(() => { socket.emit('get_profile', r => { if (r && r.success && r.theme) { localStorage.setItem('myTheme', r.theme); applyMsTheme(r.theme); } }); }, 200);
  });
  setInterval(() => socket.emit('heartbeat', myName, IS_T, true), 10000);
  const E = {
    '玩家1': { A:'/assets/avatars/p1/bqb1/'+encodeURIComponent('绯绯狐-不要小瞧我和小浣熊的羁绊啊！.png'), B:'/assets/avatars/p1/bqb1/'+encodeURIComponent('绯绯狐-对的对的.png'), C:'/assets/avatars/p1/bqb1/'+encodeURIComponent('绯绯狐-不对不对.png') },
    '玩家2': { A:'/assets/avatars/p2/dan2.png', B:'/assets/avatars/p2/dan3.png', C:'/assets/avatars/p2/dan5.png' },
    '玩家3': { A:'/assets/avatars/p3/bqb3/'+encodeURIComponent('千夏-烧烤.png'), B:'/assets/avatars/p3/bqb3/'+encodeURIComponent('千夏-好耶！.png'), C:'/assets/avatars/p3/bqb3/'+encodeURIComponent('千夏-TAT！.png') },
    '玩家4': { A:'/assets/avatars/p4/bqb4/'+encodeURIComponent('塔神-阅读.png'), B:'/assets/avatars/p4/bqb4/'+encodeURIComponent('塔神-完美之神.png'), C:'/assets/avatars/p4/bqb4/'+encodeURIComponent('塔神-感叹.png') }
  };
  function emo(n,t){ const e=E[n]; return e?e[t]:''; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  let S=null, flagMode=false, _dm={}, lockRound=-1, confirmMode=localStorage.getItem('msConfirm')==='1', armed=null;
  let overBoardHidden=false, msOverTimer=null, msAchSummary={};
  function dn(n){ return _dm[n]||n; }
  function lab(n){ return String(dn(n)||'').replace(/^游客/,''); }
  function phaseText(){
    if(!S) return '等待对局…';
    const done=Object.keys(S.picks||{}).length;
    if(S.phase==='over') return '游戏结束';
    return S.phase==='result' ? '本轮揭晓，即将进入下一轮…' : (done?('第'+S.round+'轮：已提交 '+done+'/'+(S.playerOrder||[]).length):('第'+S.round+'轮：请选择格子'));
  }
  function cellHtml(r,c,size){
    const revealed={},flagged={},exploded={};
    (S.revealed||[]).forEach(x=>revealed[x.r+','+x.c]=x.num);
    (S.flagged||[]).forEach(x=>flagged[x.r+','+x.c]=1);
    (S.exploded||[]).forEach(x=>exploded[x.r+','+x.c]=1);
    const k=r+','+c; let cls='un', inner='', em='';
    if(exploded[k]){ cls='mine'; inner='<span class="mine-x">✕</span>'; }
    else if(flagged[k]){ cls='flag'; inner='🚩'; }
    else if(revealed[k]!=null){ cls='rev'; inner='<span class="num'+revealed[k]+'">'+revealed[k]+'</span>'; }
    const stack=[];
    (S.picks||{}); Object.keys(S.picks||{}).forEach(nm=>{ const p=S.picks[nm]; if(p.r===r&&p.c===c) stack.push({name:nm,op:p.op,img:emo(nm,'A'),last:false,delta:null}); });
    (S.last||[]).forEach(a=>{ if(a.r===r&&a.c===c) stack.push({name:a.name,op:a.op,img:emo(a.name,a.ok?'B':'C'),last:true,delta:a.delta}); });
    if(stack.length){
      const chips=stack.map(x=>{
        const ring=x.op==='open'?'open':'flagc';
        const fl=x.last&&x.delta!=null?'<span class="float" style="color:'+(x.delta>0?'#2e8b57':'#c62828')+';">'+(x.delta>0?'+':'')+x.delta+'</span>':'';
        return '<span class="emj '+ring+'">'+(x.img?'<img src="'+x.img+'">':'<span class="no">'+esc(lab(x.name))+'</span>')+fl+'</span>';
      }).join('');
      const lay=(cls==='un'||S.phase!=='pick')?('c'+Math.min(stack.length,4)):'';
      em='<span class="emjrow '+lay+'">'+chips+'</span>';
    }
    if(confirmMode&&armed&&armed.r===r&&armed.c===c&&cls==='un'&&!((S.picks||{})[myName])){
      const u=emo(myName,'A');
      em+='<span class="emjrow c1"><span class="emj '+(armed.op==='open'?'open':'flagc')+' arm">'+(u?'<img src="'+u+'">':'')+'</span></span>';
    }
    return '<td class="'+cls+'"'+(cls==='un'?' onclick="tapCell('+r+','+c+')"':'')+'>'+inner+em+'</td>';
  }
  function cardHtml(n){
    const last=(S.last||[]).find(a=>a.name===n);
    let kind=null;
    if(S.phase==='result'||S.phase==='over'){
      if(last) kind=last.ok?'B':'C';
    } else if((S.submitted||[]).includes(n)||(S.picks&&S.picks[n])) kind='A';
    const url=kind?emo(n,kind):'';
    const face=url?'<img src="'+url+'">':'<span class="ph">?</span>';
    const on=S.online&&S.online[n];
    const st=on?(kind?(kind==='A'?'已选':'已结算'):'选择中'):'离线';
    const dft=(last&&last.delta!=null)?'<span class="pdrift" style="color:'+(last.delta>0?'#2e8b57':'#c62828')+';">'+(last.delta>0?'+':'')+last.delta+'</span>':'';
    return '<div class="pcard"><div class="pface" style="'+(n===S.you?'border-color:#e67e22;':'')+'">'+face+dft+'</div><div class="pname">'+lab(n)+'</div><div class="pscore">'+(S.scores[n]||0)+'分</div><div class="pstatus'+(on?'':' off')+'">'+st+'</div></div>';
  }
  function renderPlayers(){
    const order=S.playerOrder||Object.keys(S.scores||{});
    let html='<div class="players">';
    if(S.mode==='team'&&S.teams){
      ['A','B'].forEach(t=>{
        const mem=order.filter(n=>S.teams[n]===t);
        const sum=mem.reduce((a,n)=>a+(S.scores[n]||0),0);
        const lastT=mem.reduce((a,n)=>{const z=(S.last||[]).find(x=>x.name===n);return z?a+(z.delta||0):a;},0);
        html+='<div class="tbox"><div class="tsum">'+t+'队<br><span style="color:'+(lastT>0?'#2e8b57':(lastT<0?'#c62828':'#2c3e50'))+';">'+(lastT>0?'+':'')+lastT+'</span><br><b>'+sum+'分</b></div>'+mem.map(cardHtml).join('')+'</div>';
      });
    } else {
      html+=order.map(n=>'<div class="tbox">'+cardHtml(n)+'</div>').join('');
    }
    html+='</div>';
    document.getElementById('scoreLine').innerHTML=html;
  }
  function render(){
    if(!S) return;    document.getElementById('msStage').textContent=phaseText();
    const msEl=document.getElementById('msStage');
    const missing=(S.playerOrder||[]).filter(n=>!(S.picks||{})[n]);
    const offs=missing.filter(n=>!(S.online&&S.online[n])).map(n=>lab(n));
    if(S.phase==='pick'&&offs.length) msEl.textContent+=(' · 等 '+offs.join('、')+' 上线提交');
    const oc=Object.values(S.online||{}).filter(Boolean).length;
    const cl=document.getElementById('msCancelLb');
    if(cl) cl.textContent='取消对局'+(S.cancelVotes&&S.cancelVotes.length?('（'+S.cancelVotes.length+'/'+oc+'）'):'');
    document.getElementById('msRound').textContent='第'+S.round+'轮';
    document.getElementById('msMines').textContent='雷 剩 '+S.remaining;
    renderPlayers();
    // 结算 3 秒后：棋盘与操作条已隐藏，只保留分数板 / 排名 / 本局成就卡片
    if (S.phase==='over' && overBoardHidden) return;
    const mb=document.getElementById('modeBar');
    if(confirmMode && S.phase==='pick'){
      mb.innerHTML='<span class="mode-opt" style="border:none;background:rgba(255,255,255,.4);cursor:default;color:#6b7a90;">先点格子 → 再点同一格切换 翻开/插旗</span>';
    } else {
      mb.innerHTML='<span class="mode-opt" onclick="setFlag(false)">点击翻开</span><span class="mode-opt" onclick="setFlag(true)">插旗</span>';
      const opts=mb.querySelectorAll('.mode-opt');
      opts[0].classList.toggle('on',!flagMode);
      opts[1].classList.toggle('on',flagMode);
    }
    const mb2=document.getElementById('modeBar2');
    mb2.innerHTML='<span class="mode-opt" onclick="setConfirm(false)">直接</span><span class="mode-opt" onclick="setConfirm(true)">两步确认</span>'
      +((confirmMode&&armed)?'<span class="mode-opt on" onclick="submitPick()">✓ '+((armed.op==='open')?'翻开':'插旗')+'（'+armed.r+','+armed.c+'）</span><span class="mode-opt" onclick="armed=null;render()">取消</span>':'');
    const o2=mb2.querySelectorAll('.mode-opt');
    if(o2[0]) o2[0].classList.toggle('on',!confirmMode);
    if(o2[1]) o2[1].classList.toggle('on',confirmMode);
    const msg=document.getElementById('msMsg');
    if(S.phase==='over'&&S.over){
      const order=S.playerOrder||Object.keys(S.scores||{});
      let rows;
      if(S.mode==='team'&&S.teams){
        rows=['A','B'].map(t=>{
          const mem=order.filter(n=>S.teams[n]===t);
          const sum=mem.reduce((a,n)=>a+(S.scores[n]||0),0);
          const win=(S.over.winnerNames||[]).length&&mem.some(n=>S.over.winnerNames.includes(n));
          return '<div class="rrow'+(win?' win':'')+'"><b>'+t+' 队</b><span>'+mem.map(n=>lab(n)).join(' / ')+'</span><span class="rs">'+sum+' 分</span></div>';
        }).join('');
      } else {
        const sorted=order.slice().sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0));
        rows=sorted.map((n,i)=>{
          const win=(S.over.winnerNames||[]).includes(n);
          return '<div class="rrow'+(win?' win':'')+'"><b>'+(i+1)+'</b><span>'+esc(lab(n))+'</span><span class="rs">'+(S.scores[n]||0)+' 分</span></div>';
        }).join('');
      }
      const qC={common:'#9aa5b1',rare:'#4caf50',epic:'#9c27b0',legend:'#ff9800',hidden:'#d32f2f'};
      const achRows=Object.keys(msAchSummary||{}).map(p=>{
        const arr=msAchSummary[p]||[];
        if(!arr.length) return '';
        return '<div class="ra-row"><b>'+esc(lab(p))+'</b><span>'
          +arr.map(a=>'<span style="color:'+(qC[a.quality]||'#2c3e50')+';font-weight:600;">🏅 '+esc(a.name)+'</span>').join('　')
          +'</span></div>';
      }).filter(Boolean).join('');
      const achHtml=achRows?'<div class="res-ach"><div class="ra-title">🎖 本局成就</div>'+achRows+'</div>':'';
      msg.innerHTML='<div class="res"><div class="res-title">🏁 游戏结束 · 最终结算</div><div class="res-rows">'+rows+'</div>'+achHtml+'<span class="res-btn" onclick="msExit()">返回房间</span></div>';
      if(!msOverTimer){
        msOverTimer=setTimeout(()=>{
          overBoardHidden=true;
          const gw=document.getElementById('gridWrap'); if(gw) gw.innerHTML='';
          ['modeBar','modeBar2'].forEach(id=>{ const e=document.getElementById(id); if(e) e.style.display='none'; });
          render();
        },3000);
      }
    } else if(S.phase==='result'){
      msg.innerHTML='<span style="color:#2f8f46;">点击操作成功＋分 / 踩雷或错旗−5</span>';
    } else msg.innerHTML='';
    let g='<table class="g">';
    for(let r=1;r<=S.size;r++){ g+='<tr>'; for(let c=1;c<=S.size;c++) g+=cellHtml(r,c,S.size); g+='</tr>'; }
    document.getElementById('gridWrap').innerHTML=g+'</table>';
  }
  function setFlag(f){ if(S&&S.phase!=='pick') return; flagMode=f; if(armed&&confirmMode) armed.op=flagMode?'flag':'open'; render(); }
  function setConfirm(f){ confirmMode=!!f; localStorage.setItem('msConfirm', confirmMode?'1':'0'); armed=null; render(); }
  function toggleMode(f){ setFlag(f); }
  function directSend(r,c){
    const op=flagMode?'flag':'open';
    if(S){ S.picks=S.picks||{}; S.picks[myName]={r,c,op}; lockRound=S.round; render(); }
    socket.emit('minesweeper_pick',{r,c,op},res=>{ if(res&&!res.success&&res.msg){ if(S&&S.picks) delete S.picks[myName]; toast(res.msg); render(); } else { lockRound=S&&S.round; } });
  }
  function tapCell(r,c){
    if(!S||S.phase!=='pick') return;
    if(lockRound===S.round){ toast('本轮已提交，等揭晓'); return; }
    if(!confirmMode){ directSend(r,c); return; }
    if(!armed){ armed={r,c,op:'open'}; }
    else if(armed.r===r&&armed.c===c){ armed.op=armed.op==='open'?'flag':'open'; }
    else armed={r,c,op:'open'};
    render();
  }
  function submitPick(){
    if(!S||S.phase!=='pick'||!armed) return;
    const a=armed; armed=null;
    S.picks=S.picks||{}; S.picks[myName]={r:a.r,c:a.c,op:a.op}; lockRound=S.round; render();
    socket.emit('minesweeper_pick',{r:a.r,c:a.c,op:a.op},res=>{ if(res&&!res.success&&res.msg){ if(S&&S.picks) delete S.picks[myName]; toast(res.msg); render(); } else { lockRound=S.round; } });
  }
  function toast(m){ const e=document.getElementById('msMsg'); if(e) e.textContent=m; }
  socket.on('minesweeper_state',s=>{ S=s; render(); });
  socket.on('minesweeper_cancel',()=>location.href='/room.html?game=minesweeper');
  const msAchEl=document.createElement('div'); msAchEl.className='ach-pop'; document.body.appendChild(msAchEl); let msAchTimer=null;
  socket.on('achievement_unlocked', function(d){
    if(!d||!d.name) return;
    const qLab={common:'普通',rare:'稀有',epic:'史诗',legend:'传说',hidden:'隐藏'};
    msAchEl.innerHTML='🏅 解锁成就「'+esc(d.name)+'」<small>'+((d.quality&&(qLab[d.quality]||d.quality))||'')+(d.playerName?' · '+esc(dn(d.playerName)):'')+'</small>';
    msAchEl.style.opacity='1'; clearTimeout(msAchTimer); msAchTimer=setTimeout(function(){ msAchEl.style.opacity='0'; },2600);
  });
  socket.on('achievement_summary', function(d){
    if(!d||!d.players) return;
    msAchSummary=d.players;
    if(S&&S.phase==='over') render();
  });
  socket.on('connect',()=>{ socket.emit('get_display_names',res=>{ if(res&&res.success){_dm=res.map;render();} }); setTimeout(()=>{ socket.emit('minesweeper_enter'); socket.emit('minesweeper_pull',res=>{ if(res&&res.success){S=res;render();} }); },400); });
  socket.emit('get_display_names',res=>{ if(res&&res.success){_dm=res.map;} });
  function msCancel(){ socket.emit('minesweeper_cancel_vote',{}); }
  function msExit(){ const q=new URLSearchParams(location.search); location.href='/room.html?game=minesweeper'+(q.get('room')?'&room='+q.get('room'):''); }
  setInterval(()=>{ if(!socket.connected) return; socket.emit('minesweeper_pull',res=>{ if(res&&res.success){ S=res; render(); } }); },2200);
  </script>
  <script src='/emoji-widget.js'></script>
</body>
