<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f2f5; color: #2c3e50; font-family: 'Segoe UI', 'PingFang SC', sans-serif; padding: 16px 12px; }
    .headbar { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
    .title { font-weight: 700; font-size: 1.08rem; }
    .back { color: #4a90d9; text-decoration: none; font-size: .88rem; }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 600px; margin: 0 auto; padding: 14px 6px 60px; }
    .sec { margin-bottom: 18px; }
    .lab { font-size: .76rem; color: #9aa5b1; letter-spacing: 1px; margin: 10px 0 6px; }
    .line-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #9db4cc; color: #2c3e50; font-size: 1rem; outline: none; padding: 4px 2px; }
    .hint { font-size: .78rem; color: #adb5bd; margin-top: 6px; }
    .save { color: #4a90d9; font-size: .88rem; cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }
    .msg { font-size: .82rem; color: #e74c3c; margin-top: 8px; min-height: 16px; }
    .msg.ok { color: #27ae60; }
    .theme-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .theme-opt { padding: 5px 14px; border: 1px solid #dfe4ea; border-radius: 18px; font-size: .86rem; cursor: pointer; color: #6b7a90; background: #fff; }
    .theme-opt.active { border-color: #4a90d9; color: #4a90d9; font-weight: 700; }
    body.theme-p1 { background-image: linear-gradient(rgba(255,255,255,.78), rgba(255,255,255,.78)), url('/assets/avatars/p1/beijing.png.jpg'); background-size: cover; background-attachment: fixed; background-position: center; }
    body.theme-p1 .save { color: #f06292; }
    body.theme-p1 .theme-opt.active { border-color: #f06292; color: #f06292; }
    .note { font-size: .76rem; color: #adb5bd; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="headbar">
    <span class="title">设置</span>
    <a class="back" href="/lobby.html">返回大厅</a>
  </div>

  <div class="wrap">
    <div class="sec" id="guestNote" style="display:none;">
      <div class="lab">说明</div>
      <div class="hint">游客暂无个人档案。</div>
    </div>

    <div class="sec" id="editArea" style="display:none;">
      <div class="lab">昵称</div>
      <input class="line-input" id="nickInput" maxlength="12" placeholder="当前昵称" autocomplete="off">
      <div class="hint">（2~12 字，中英文/数字/下划线）</div>
      <span class="save" onclick="saveProfile()">保存昵称</span>
    </div>

    <div class="sec" id="themeArea" style="display:none;">
      <div class="lab">主题配色</div>
      <div class="theme-row" id="themeRow"></div>
      <span class="save" onclick="saveTheme()">应用主题</span>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const myName = sessionStorage.getItem('playerName');
    if (!myName) { window.location.href = '/index.html'; }
    const isGuest = sessionStorage.getItem('isGuest') === 'true';

    const THEME_LABELS = { initial: '初始配色', p1: '我永远都是我o', p2: '神秘粉毛', p3: '摸鱼ing', p4: '人生喵喵又咪咪' };
    let profile = null;

    const msgEl = document.getElementById('msg');
    function msg(text, ok) {
      msgEl.textContent = text;
      msgEl.className = 'msg' + (ok ? ' ok' : '');
    }

    // ===== 主题引擎 =====
    const THEME_IMG = { p1: '/assets/avatars/p1/beijing.png.jpg', p2: '/assets/avatars/p2/zuixin2.jpg', p3: '/assets/avatars/p3/zuixin3.jpg', p4: '/assets/avatars/p4/beijing4.jpg' };
    const THEME_MOBILE = { p4: '/assets/avatars/p4/zuixin4.jpg' };
    const THEME_ALPHA = { p1: 0.82, p2: 0.75, p3: 0.75, p4: 0.82 };
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;
    function ensureThemeStyle() {
      if (document.getElementById('dynThemeStyle')) return;
      const s = document.createElement('style');
      s.id = 'dynThemeStyle';
      const scoped = (prefix, selList) => selList.split(',').map(x => prefix + ' ' + x.trim()).join(',');
      const col = '.back,.back:hover,.g-hall,.save,.mini-link,.l-link,.l-link:hover,.gear,.gear:hover,.guest-toggle:hover,.f-link:hover,.theme-opt.active,.p-tri:hover,.player-card.online .status-text';
      const btn = '.controls #btnStart,.btn-roll';
      const pink =
        scoped('body.dyn-pink', col) + '{color:#f06292!important}' +
        scoped('body.dyn-pink', '.g-tab.active') + '{color:#f06292!important;border-bottom-color:#ffb3c6!important}' +
        scoped('body.dyn-pink', '.g-tab:hover') + '{color:#f06292!important}' +
        scoped('body.dyn-pink', btn) + '{background:#f06292!important;border-color:#f06292!important}' +
        'body.dyn-pink .controls #btnStart:hover,body.dyn-pink .btn-roll:hover{background:#e0507f!important}' +
        'body.dyn-pink .game-link{border-bottom-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.occupied{border-color:#ffb3c6!important}' +
        'body.dyn-pink .seat.ready{border-color:#f9b7ca!important;background:#fff4f7!important}' +
        'body.dyn-pink .me-tag{background:#ffe3ec!important;color:#e0507f!important}' +
        'body.dyn-pink .toast,body.dyn-pink .home-toast{background:#a0345c!important}';
      const green =
        scoped('body.dyn-green', col) + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', '.g-tab.active') + '{color:#6f9e63!important;border-bottom-color:#a9c79e!important}' +
        scoped('body.dyn-green', '.g-tab:hover') + '{color:#6f9e63!important}' +
        scoped('body.dyn-green', btn) + '{background:#6f9e63!important;border-color:#6f9e63!important}' +
        'body.dyn-green .controls #btnStart:hover,body.dyn-green .btn-roll:hover{background:#5b8a50!important}' +
        'body.dyn-green .game-link{border-bottom-color:#a9c79e!important}' +
        'body.dyn-green .seat.occupied{border-color:#a9c79e!important}' +
        'body.dyn-green .seat.ready{border-color:#b9d6af!important;background:#f2f8f0!important}' +
        'body.dyn-green .me-tag{background:#e6f1e2!important;color:#5b8a50!important}' +
        'body.dyn-green .toast,body.dyn-green .home-toast{background:#48673f!important}';
      s.textContent = pink + '\n' + green;
      document.head.appendChild(s);
    }
    function paintTheme(id) {
      ensureThemeStyle();
      const b = document.body;
      b.classList.remove('dyn-pink', 'dyn-green');
      if (id && id !== 'initial') {
        b.classList.add(id === 'p3' ? 'dyn-green' : 'dyn-pink');
        const img = (IS_MOBILE && THEME_MOBILE[id]) ? THEME_MOBILE[id] : THEME_IMG[id];
        const a = THEME_ALPHA[id] || 0.78;
        if (img) { b.style.backgroundImage = "linear-gradient(rgba(255,255,255," + a + "), rgba(255,255,255," + a + ")), url('" + img + "')"; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; b.style.backgroundPosition = 'center'; }
      } else {
        b.style.backgroundImage = ''; b.style.backgroundSize = ''; b.style.backgroundAttachment = ''; b.style.backgroundPosition = '';
      }
    }
    function applyThemeBody(theme) {
      localStorage.setItem('myTheme', theme || 'initial');
      paintTheme(theme || 'initial');
    }
    function renderThemes(allowed) {
      const list = (allowed && allowed.length ? allowed : ['initial']);
      document.getElementById('themeRow').innerHTML = list.map(id =>
        `<span class="theme-opt ${id === (profile ? profile.theme : '') ? 'active' : ''}" data-id="${id}" onclick="pickTheme('${id}')">${THEME_LABELS[id] || id}</span>`
      ).join('');
    }
    function pickTheme(k) {
      if (profile) profile.theme = k;
      document.querySelectorAll('#themeRow .theme-opt').forEach(o => o.classList.toggle('active', o.getAttribute('data-id') === k));
      applyThemeBody(k); // 设置页里即时预览
    }

    function saveProfile() {
      const n = document.getElementById('nickInput').value.trim();
      msg('');
      socket.emit('update_profile', { nickname: n, theme: profile.theme }, (res) => {
        if (res && res.success) {
          profile = Object.assign({}, profile, res);
          renderThemes(profile.allowedThemes);
          applyThemeBody(res.theme);
          msg('昵称已保存', true);
        } else {
          msg((res && res.msg) || '保存失败');
        }
      });
    }
    function saveTheme() {
      msg('');
      socket.emit('update_profile', { nickname: profile.nickname, theme: profile.theme }, (res) => {
        if (res && res.success) {
          profile = Object.assign({}, profile, res);
          renderThemes(profile.allowedThemes);
          applyThemeBody(res.theme);
          msg(profile.theme === 'p1' ? '已应用：玩家1专属主题' : '已切回初始配色', true);
        } else {
          msg((res && res.msg) || '保存失败');
        }
      });
    }
    document.getElementById('nickInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveProfile(); });

    const socket = io();
    function sendHeartbeat() {
      if (socket.connected) socket.emit('heartbeat', sessionStorage.getItem('playerName'), sessionStorage.getItem('isTest') === 'true', false);
    }
    socket.on('connect', sendHeartbeat);
    setInterval(sendHeartbeat, 10000);

    socket.on('connect', () => {
      socket.emit('get_profile', (res) => {
        if (!res || !res.success) return;
        profile = res;
        const extraThemes = (res.allowedThemes || []).length > 1;
        if (!res.canEdit) {
          // 游客/测试账号：昵称区隐藏；若有可体验主题则显示主题区
          document.getElementById('guestNote').style.display = 'block';
          if (extraThemes) {
            document.getElementById('themeArea').style.display = 'block';
            renderThemes(res.allowedThemes);
            applyThemeBody(res.theme);
          }
          return;
        }
        document.getElementById('editArea').style.display = 'block';
        document.getElementById('themeArea').style.display = 'block';
        document.getElementById('nickInput').placeholder = '当前昵称：' + (res.nickname || '（未设置）');
        renderThemes(res.allowedThemes);
        applyThemeBody(res.theme);
      });
    });
  </script>
</body>
</html>
